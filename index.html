<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <title>العالم الافتراضي - المشاعر المقدسة</title>
  
  <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
  <script src="https://unpkg.com/aframe-orbit-controls@1.3.2/dist/aframe-orbit-controls.min.js"></script>

  <style>
    * { box-sizing: border-box; }
    body, html {
      margin: 0; padding: 0; width: 100%; height: 100%;
      overflow: hidden; background: #020205; /* لون خلفية أسود عميق */
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    
    #vr-container {
      position: absolute; top: 0; left: 0; width: 100vw; height: 100vh;
    }

    /* الشعارات - بيضاء ومصغرة */
    .logos-wrapper {
      position: absolute; top: 25px; left: 0; right: 0;
      display: flex; justify-content: space-between; padding: 0 40px;
      z-index: 100; pointer-events: none; 
    }
    .logos-wrapper img { 
      height: 45px; /* تصغير الحجم جداً */
      object-fit: contain; pointer-events: auto;
      filter: brightness(0) invert(1); /* تحويل الشعار للون الأبيض */
      opacity: 0.8;
    }

    /* تصميم البوب-أب التقني (Cyberpunk UI) */
    #info-panel {
      position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
      width: 90%; max-width: 500px;
      background: rgba(4, 8, 15, 0.85); /* زجاج داكن */
      color: #fff; padding: 30px; border-radius: 16px; z-index: 100;
      display: none; 
      box-shadow: 0 0 30px rgba(0, 243, 255, 0.2), inset 0 0 20px rgba(0, 243, 255, 0.1);
      border: 1px solid rgba(0, 243, 255, 0.4);
      backdrop-filter: blur(10px);
    }
    .close-btn {
      position: absolute; top: 15px; left: 20px;
      background: none; border: none; color: #00f3ff; font-size: 28px;
      cursor: pointer; transition: 0.3s; text-shadow: 0 0 10px #00f3ff;
    }
    .close-btn:hover { color: #fff; transform: scale(1.1); }
    #panel-title { 
      margin: 0 0 15px 0; color: #00f3ff; font-size: 24px; 
      border-bottom: 1px solid rgba(0, 243, 255, 0.3); padding-bottom: 15px;
      text-shadow: 0 0 10px rgba(0, 243, 255, 0.5);
    }
    #panel-desc { line-height: 1.8; font-size: 15px; margin-bottom: 20px; color: #d1d5db; }
    
    /* كروت الصور السفلية */
    .gallery-container {
      display: flex; gap: 15px; overflow-x: auto; padding-bottom: 10px;
    }
    .gallery-container img {
      height: 110px; min-width: 150px; border-radius: 8px; 
      border: 1px solid rgba(0, 243, 255, 0.3);
      object-fit: cover; box-shadow: 0 5px 15px rgba(0,0,0,0.5);
    }
  </style>

  <script>
    // سكربت التفاعل مع النقاط لعرض البوب-أب
    AFRAME.registerComponent('hotspot-action', {
      schema: {
        title: {type: 'string'},
        desc: {type: 'string'},
        images: {type: 'string', default: ''} 
      },
      init: function () {
        this.el.addEventListener('click', () => {
          let data = this.data;

          document.getElementById('panel-title').innerText = data.title;
          document.getElementById('panel-desc').innerText = data.desc;
          
          let galleryHtml = '';
          if (data.images.trim() !== '') {
            data.images.split(',').forEach(img => {
              if(img.trim()) galleryHtml += `<img src="${img.trim()}" alt="صورة توضيحية">`;
            });
          }
          document.getElementById('gallery-container').innerHTML = galleryHtml;

          // تأثير ظهور ناعم
          let panel = document.getElementById('info-panel');
          panel.style.display = 'block';
          panel.style.animation = 'fadeIn 0.4s ease';
        });
      }
    });

    function closePanel() {
      document.getElementById('info-panel').style.display = 'none';
    }
  </script>
</head>
<body>

  <div id="vr-container">
    
    <!-- الشعارات باللون الأبيض -->
    <div class="logos-wrapper">
      <img src="https://haj.gov.sa/_next/image?url=https%3A%2F%2Fhaj.gov.sa%2Fs-core%2F-%2Fmedia%2FProject%2FHAJJ%2FHajj-Logos%2FHeader-Logo.svg%3Fiar%3D0%26hash%3DEA30CCD6D55090BA41D3BA548A24E24A&amp;w=256&amp;q=75" alt="وزارة الحج والعمرة">
      <img src="https://image2url.com/r2/default/images/1773558610625-b250b6cd-d224-421f-b749-0894a9cf0602.png" alt="يوروكونسلت">
    </div>

    <!-- نافذة البوب-أب التقنية -->
    <div id="info-panel">
      <button class="close-btn" onclick="closePanel()">✖</button>
      <h2 id="panel-title">--</h2>
      <p id="panel-desc">--</p>
      <div id="gallery-container" class="gallery-container"></div>
    </div>

    <a-scene embedded cursor="rayOrigin: mouse" raycaster="objects: .clickable" vr-mode-ui="enabled: true">
      
      <a-assets timeout="15000">
        <!-- الموديلات المرفوعة (تأكد من تطابق الأسماء مع ملفاتك على جيت هب) -->
        <a-asset-item id="model-jamarat" src="models/jamaraat.glb"></a-asset-item>
        <a-asset-item id="model-khimaa" src="models/KHIMAA.glb"></a-asset-item>
      </a-assets>

      <!-- 1. البيئة: سماء سوداء وشبكة نيون زرقاء -->
      <a-sky color="#020205"></a-sky>
      
      <!-- أرضية صلبة داكنة -->
      <a-plane position="0 0 0" rotation="-90 0 0" width="500" height="500" color="#010103"></a-plane>
      <!-- شبكة النيون المضيئة فوق الأرضية مباشرة -->
      <a-plane position="0 0.1 0" rotation="-90 0 0" width="200" height="200" wireframe="true" segments-width="80" segments-height="80" color="#00f3ff" opacity="0.3"></a-plane>

      <!-- 2. الإضاءة الاحترافية -->
      <!-- إضاءة عامة خافتة جداً -->
      <a-light type="ambient" color="#222233" intensity="0.3"></a-light>
      <!-- إضاءة "القمر" من الأعلى مباشرة -->
      <a-light type="directional" color="#ffffff" intensity="1.5" position="0 50 0"></a-light>
      <!-- وهج أزرق من الأسفل لينعكس على الموديلات -->
      <a-light type="point" color="#00f3ff" intensity="2" position="0 2 0" distance="80"></a-light>

      <!-- 3. حاوية الموديلات (هنا يمكنك تعديل المقاس (scale) لكل موديل ليصبح مناسباً) -->
      <a-entity id="scene-models" position="0 0 -20">
        
        <!-- === الموديل الأول: الجمرات === -->
        <!-- استخدمنا scale="0.05 0.05 0.05" لتصغيره، غير الرقم إذا كان كبيراً أو صغيراً -->
        <a-entity position="-15 0 0">
          <a-gltf-model src="#model-jamarat" scale="0.05 0.05 0.05"></a-gltf-model>
          
          <!-- الخط الأبيض الصاعد من الموديل والنقطة المضيئة -->
          <a-entity line="start: 0 0 0; end: 0 8 0; color: #ffffff"></a-entity>
          <a-sphere class="clickable" position="0 8 0" radius="0.4" color="#00f3ff" 
                    material="shader: flat"
                    animation="property: position; dir: alternate; dur: 1500; loop: true; to: 0 8.5 0"
                    hotspot-action="title: منشأة الجمرات التقنية; 
                                    desc: هذا النص وهمي مؤقت. منشأة الجمرات تعتبر من أهم المعالم في المشاعر المقدسة، تم تصميم هذا الموديل ليوضح مسارات الحركة وانسيابية التفويج في العالم الافتراضي.; 
                                    images: https://images.unsplash.com/photo-1591604129939-f1efa4d9f7fa?w=500,https://images.unsplash.com/photo-1565552643952-b91c28bdf713?w=500">
          </a-sphere>
        </a-entity>

        <!-- === الموديل الثاني: الخيام === -->
        <a-entity position="15 0 0">
          <a-gltf-model src="#model-khimaa" scale="0.05 0.05 0.05"></a-gltf-model>
          
          <!-- الخط الأبيض الصاعد من الموديل والنقطة المضيئة -->
          <a-entity line="start: 0 0 0; end: 0 6 0; color: #ffffff"></a-entity>
          <a-sphere class="clickable" position="0 6 0" radius="0.4" color="#00f3ff" 
                    material="shader: flat"
                    animation="property: position; dir: alternate; dur: 1500; loop: true; to: 0 6.5 0"
                    hotspot-action="title: مخيمات الحجاج في منى; 
                                    desc: نص تجريبي. مدينة الخيام البيضاء مجهزة بأحدث تقنيات السلامة والراحة. هنا يتم استعراض التوزيع المكاني الهندسي لتنظيم الإقامة.; 
                                    images: https://images.unsplash.com/photo-1591604129939-f1efa4d9f7fa?w=500">
          </a-sphere>
        </a-entity>

      </a-entity>

      <!-- الكاميرا المدارية (Orbit Camera) -->
      <a-entity camera look-controls="enabled: false" 
                orbit-controls="target: 0 0 -20; minDistance: 10; maxDistance: 150; initialPosition: 0 25 35; enablePan: true; enableZoom: true;">
      </a-entity>
      
    </a-scene>
  </div>
</body>
</html>
