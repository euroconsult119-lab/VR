<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <title>منصة المشاعر المقدسة الافتراضية</title>
  
  <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
  <!-- مكتبة لحركة الكاميرا السلسة -->
  <script src="https://unpkg.com/aframe-orbit-controls@1.3.2/dist/aframe-orbit-controls.min.js"></script>

  <style>
    body, html {
      margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      /* خلفية متدرجة تحاكي إضاءة الكانفس الكلية */
      background: radial-gradient(circle at top, #0a1f3d 0%, #02050a 80%);
    }

    #vr-container { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }

    /* الشعارات */
    .logos-wrapper {
      position: absolute; top: 20px; left: 0; right: 0;
      display: flex; justify-content: space-between; padding: 0 40px;
      z-index: 100; pointer-events: none; 
    }
    .logos-wrapper img { 
      height: 35px; object-fit: contain; pointer-events: auto;
      filter: brightness(0) invert(1); opacity: 0.9;
    }

    /* السلايدر الجانبي */
    #sidebar {
      position: absolute; top: 50%; right: 20px; transform: translateY(-50%);
      width: 220px; background: rgba(4, 10, 20, 0.6);
      border: 1px solid rgba(0, 150, 255, 0.3); border-radius: 12px;
      padding: 15px; z-index: 100; backdrop-filter: blur(10px);
    }
    .sidebar-btn {
      display: block; width: 100%; padding: 12px; margin-bottom: 10px;
      background: rgba(0, 150, 255, 0.1); color: #fff;
      border: 1px solid rgba(0, 150, 255, 0.4); border-radius: 8px;
      text-align: right; cursor: pointer; transition: 0.3s; font-weight: bold;
    }
    .sidebar-btn:hover { background: rgba(0, 150, 255, 0.4); box-shadow: 0 0 10px rgba(0,150,255,0.5); }
    .sidebar-btn:last-child { margin-bottom: 0; }

    /* نافذة البوب-أب */
    #info-panel {
      position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
      width: 85%; max-width: 450px;
      background: rgba(6, 12, 24, 0.85); color: #fff;
      padding: 25px; border-radius: 16px; z-index: 100; display: none; 
      box-shadow: 0 0 40px rgba(0, 100, 255, 0.3), inset 0 0 20px rgba(0, 150, 255, 0.1);
      border: 1px solid rgba(0, 150, 255, 0.4); backdrop-filter: blur(10px);
    }
    .close-btn {
      position: absolute; top: 10px; left: 15px; background: none; border: none; 
      color: #00aaff; font-size: 24px; cursor: pointer; transition: 0.3s;
    }
    .close-btn:hover { color: #fff; transform: scale(1.1); }
    #panel-title { 
      margin: 0 0 10px 0; color: #00d2ff; font-size: 20px; 
      border-bottom: 1px solid rgba(0, 150, 255, 0.3); padding-bottom: 10px;
    }
    #panel-desc { line-height: 1.6; font-size: 14px; margin-bottom: 15px; color: #cbd5e1; }
    
    .gallery-container { display: flex; gap: 10px; overflow-x: auto; padding-bottom: 5px; }
    .gallery-container img {
      height: 90px; border-radius: 6px; border: 1px solid rgba(0, 150, 255, 0.3);
      object-fit: cover;
    }
  </style>

  <script>
    // تصميم الشبكة الناعمة المطابقة للصورة المرجعية
    AFRAME.registerComponent('neon-grid', {
      init: function () {
        let canvas = document.createElement('canvas');
        canvas.width = 512; canvas.height = 512;
        let ctx = canvas.getContext('2d');
        // خلفية شفافة لدمجها مع تدرج السماء
        ctx.fillStyle = 'rgba(0, 0, 0, 0)'; 
        ctx.fillRect(0, 0, 512, 512);
        
        // خطوط زرقاء ناعمة جداً
        ctx.strokeStyle = 'rgba(0, 150, 255, 0.4)'; 
        ctx.lineWidth = 1.5;
        // تأثير التوهج للخطوط
        ctx.shadowBlur = 10;
        ctx.shadowColor = "rgba(0, 150, 255, 0.8)";
        ctx.strokeRect(0, 0, 512, 512);
        
        let texture = new THREE.CanvasTexture(canvas);
        texture.wrapS = THREE.RepeatWrapping;
        texture.wrapT = THREE.RepeatWrapping;
        texture.repeat.set(500, 500); 
        
        let material = new THREE.MeshStandardMaterial({ 
          map: texture, 
          transparent: true, 
          roughness: 0.2, 
          metalness: 0.8 
        });
        this.el.getObject3D('mesh').material = material;
      }
    });

    // بيانات الموديلات لتغذية البوب-أب
    const siteData = {
      'jamarat': {
        title: 'منشأة الجمرات',
        desc: 'مجمع معماري حديث مصمم لتسهيل حركة الحجاج أثناء رمي الجمرات، يظهر هنا تفصيل المسارات المتعددة.',
        images: 'https://images.unsplash.com/photo-1565552643952-b91c28bdf713?w=300'
      },
      'khimaa': {
        title: 'مخيمات منى',
        desc: 'مدينة الخيام المطورة، توفر إقامة آمنة ومريحة للحجاج ضمن تخطيط هندسي دقيق لمنطقة المشاعر.',
        images: 'https://images.unsplash.com/photo-1591604129939-f1efa4d9f7fa?w=300'
      }
    };

    function showInfo(id) {
      let data = siteData[id];
      if(!data) return;
      document.getElementById('panel-title').innerText = data.title;
      document.getElementById('panel-desc').innerText = data.desc;
      
      let galleryHtml = '';
      if (data.images) {
        data.images.split(',').forEach(img => {
          galleryHtml += `<img src="${img.trim()}" alt="صورة توضيحية">`;
        });
      }
      document.getElementById('gallery-container').innerHTML = galleryHtml;
      document.getElementById('info-panel').style.display = 'block';
    }

    function closePanel() {
      document.getElementById('info-panel').style.display = 'none';
    }

    // حركة الكاميرا عند اختيار موديل من السلايدر الجانبي
    function focusOnModel(modelId, targetPosition, cameraPosition) {
      let cameraEl = document.querySelector('[camera]');
      let orbit = cameraEl.components['orbit-controls'];
      
      // إغلاق النافذة أثناء الحركة
      closePanel();

      // تحريك الكاميرا (هنا نفترض تحريكاً بسيطاً بتغيير الـ target)
      // يمكن استخدام مكتبات أنيميشن متقدمة لحركة أسلس
      orbit.target.set(targetPosition.x, targetPosition.y, targetPosition.z);
      cameraEl.setAttribute('position', cameraPosition);
      
      // إظهار المعلومات بعد فترة قصيرة
      setTimeout(() => { showInfo(modelId); }, 800);
    }
  </script>
</head>
<body>

  <div id="vr-container">
    
    <div class="logos-wrapper">
      <img src="https://haj.gov.sa/_next/image?url=https%3A%2F%2Fhaj.gov.sa%2Fs-core%2F-%2Fmedia%2FProject%2FHAJJ%2FHajj-Logos%2FHeader-Logo.svg%3Fiar%3D0%26hash%3DEA30CCD6D55090BA41D3BA548A24E24A&w=256&q=75" alt="وزارة الحج والعمرة">
      <img src="https://image2url.com/r2/default/images/1773558610625-b250b6cd-d224-421f-b749-0894a9cf0602.png" alt="يوروكونسلت">
    </div>

    <!-- السلايدر الجانبي -->
    <div id="sidebar">
      <!-- تحديث إحداثيات الكاميرا والهدف لكل موديل للتقريب -->
      <button class="sidebar-btn" onclick="focusOnModel('jamarat', {x:-5, y:0, z:0}, {x:-5, y:15, z:15})">منشأة الجمرات</button>
      <button class="sidebar-btn" onclick="focusOnModel('khimaa', {x:5, y:0, z:0}, {x:5, y:15, z:15})">مخيمات منى</button>
    </div>

    <div id="info-panel">
      <button class="close-btn" onclick="closePanel()">✖</button>
      <h2 id="panel-title">--</h2>
      <p id="panel-desc">--</p>
      <div id="gallery-container" class="gallery-container"></div>
    </div>

    <!-- تفعيل antialias لمنع التشويش والتعرج -->
    <a-scene embedded antialias="true" shadow="type: pcfsoft" vr-mode-ui="enabled: true">
      
      <a-assets timeout="30000">
        <a-asset-item id="model-jamarat" src="jamaraat.glb"></a-asset-item>
        <a-asset-item id="model-khimaa" src="KHIMAA.glb"></a-asset-item>
      </a-assets>

      <!-- سماء شفافة لدمج تدرج الـ CSS بالخلفية -->
      <a-sky opacity="0"></a-sky>
      
      <!-- أرضية الشبكة المضيئة (تستقبل الظلال) -->
      <a-plane position="0 0 0" rotation="-90 0 0" width="1000" height="1000" neon-grid shadow="receive: true"></a-plane>

      <!-- الإضاءة العلوية الزرقاء الناعمة لتغمر الكانفس والظلال -->
      <a-light type="ambient" color="#0055ff" intensity="0.6"></a-light>
      <!-- كشاف قوي من الأعلى (يلقي بظلال) -->
      <a-light type="spot" color="#aaddff" intensity="2.5" position="0 80 20" rotation="-75 0 0" angle="60" penumbra="0.5" castShadow="true" shadow-mapSize="2048"></a-light>
      <!-- إضاءة زرقاء ناعمة من الأسفل -->
      <a-light type="directional" color="#0088ff" intensity="0.8" position="0 -10 10"></a-light>

      <a-entity id="models-group">
        
        <!-- الجمرات -->
        <a-entity position="-5 0 0">
          <!-- تفعيل إسقاط الظلال للموديل -->
          <a-gltf-model src="#model-jamarat" scale="0.005 0.005 0.005" shadow="cast: true"></a-gltf-model>
          
          <!-- تصغير حجم النقطة والدائرة لتكون متناسقة -->
          <a-entity line="start: 0 0.5 0; end: 0 3.5 0; color: #00d2ff; opacity: 0.6"></a-entity>
          <!-- دائرة النيون -->
          <a-sphere position="0 3.5 0" radius="0.08" color="#ffffff" material="shader: flat" 
                    animation="property: position; dir: alternate; dur: 2000; loop: true; to: 0 3.8 0"></a-sphere>
          <!-- هالة التوهج حول النقطة -->
          <a-sphere position="0 3.5 0" radius="0.15" color="#00d2ff" material="shader: flat; transparent: true; opacity: 0.4"
                    animation="property: position; dir: alternate; dur: 2000; loop: true; to: 0 3.8 0"></a-sphere>
        </a-entity>

        <!-- الخيام -->
        <!-- ملاحظة: إذا ظل الموديل غير ظاهر، قد يكون مركزه (Origin) بعيداً جداً، حاول تعديل position للموديل نفسه -->
        <a-entity position="5 0 0">
          <a-gltf-model src="#model-khimaa" scale="0.005 0.005 0.005" shadow="cast: true"></a-gltf-model>
          
          <a-entity line="start: 0 0.5 0; end: 0 3.5 0; color: #00d2ff; opacity: 0.6"></a-entity>
          <a-sphere position="0 3.5 0" radius="0.08" color="#ffffff" material="shader: flat" 
                    animation="property: position; dir: alternate; dur: 2000; loop: true; to: 0 3.8 0"></a-sphere>
          <a-sphere position="0 3.5 0" radius="0.15" color="#00d2ff" material="shader: flat; transparent: true; opacity: 0.4"
                    animation="property: position; dir: alternate; dur: 2000; loop: true; to: 0 3.8 0"></a-sphere>
        </a-entity>

      </a-entity>

      <a-entity camera look-controls="enabled: false" 
                orbit-controls="target: 0 0 0; minDistance: 5; maxDistance: 120; initialPosition: 0 20 30; 
                                enablePan: true; enableZoom: true; enableDamping: true; dampingFactor: 0.08;">
      </a-entity>
      
    </a-scene>
  </div>
</body>
</html>
