<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <title>منصة المشاعر المقدسة الافتراضية</title>
  
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&display=swap" rel="stylesheet">
  
  <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
  <!-- مكتبة دعم النصوص ثلاثية الأبعاد المتقدمة -->
  <script src="https://unpkg.com/aframe-troika-text-component@2.0.0/dist/aframe-troika-text-component.min.js"></script>
  <script src="https://unpkg.com/aframe-orbit-controls@1.3.2/dist/aframe-orbit-controls.min.js"></script>

  <style>
    body, html {
      margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden;
      font-family: 'Cairo', sans-serif;
      background: radial-gradient(circle at top, #06193b 0%, #010308 80%);
    }

    #vr-container { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }

    #start-screen {
      position: absolute; inset: 0; z-index: 200;
      background: rgba(2, 5, 10, 0.85); backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px);
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      transition: opacity 0.8s ease;
    }
    .play-btn {
      width: 100px; height: 100px; border-radius: 50%;
      background: rgba(0, 150, 255, 0.1); border: 2px solid #00d2ff;
      color: #00d2ff; font-size: 36px; display: flex; align-items: center; justify-content: center;
      cursor: pointer; transition: 0.4s; box-shadow: 0 0 40px rgba(0, 150, 255, 0.4);
      margin-bottom: 25px; outline: none; padding-left: 8px;
    }
    .play-btn:hover {
      background: #00d2ff; color: #fff; transform: scale(1.1); box-shadow: 0 0 60px rgba(0, 210, 255, 0.8);
    }
    .start-title {
      color: #ffffff; font-size: 32px; font-weight: 800; text-shadow: 0 4px 15px rgba(0, 150, 255, 0.6);
      letter-spacing: 1px; margin: 0; text-align: center;
    }

    .logos-wrapper {
      position: absolute; top: 20px; left: 0; right: 0;
      display: flex; justify-content: space-between; padding: 0 40px;
      z-index: 100; pointer-events: none; 
    }
    .logos-wrapper img { 
      height: 35px; object-fit: contain; pointer-events: auto;
      filter: brightness(0) invert(1); opacity: 0.85;
    }

    /* أزرار وعناصر الواجهة الداخلية (مخفية قبل البلاي) */
    .ui-overlay {
      display: none; /* مخفي في البداية */
    }

    .nav-arrows-container {
      position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%);
      display: flex; align-items: center; gap: 30px; z-index: 100; direction: ltr;
    }
    .nav-arrow {
      pointer-events: auto; width: 50px; height: 50px; border-radius: 50%;
      background: rgba(6, 12, 24, 0.4); border: 1px solid rgba(0, 150, 255, 0.3);
      color: #00d2ff; font-size: 22px; font-weight: bold;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; transition: 0.3s; backdrop-filter: blur(5px);
    }
    .nav-arrow:hover { 
      background: rgba(0, 150, 255, 0.2); box-shadow: 0 0 20px rgba(0, 150, 255, 0.5); 
      transform: scale(1.1); color: #fff; border-color: #00d2ff;
    }
    .nav-text {
      color: #00d2ff; font-size: 18px; font-weight: 600; letter-spacing: 1px;
      text-shadow: 0 0 10px rgba(0, 150, 255, 0.5); pointer-events: none;
    }

    #info-panel-container {
      position: absolute; top: 50%; width: 360px; z-index: 100; display: none;
      transform-style: preserve-3d;
    }

    .info-box {
      background: rgba(8, 15, 28, 0.65); color: #fff;
      padding: 25px; border-radius: 20px; margin-bottom: 15px;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.6), 0 0 20px rgba(0, 150, 255, 0.15) inset;
      border: 1px solid rgba(255, 255, 255, 0.1); border-top: 1px solid rgba(255, 255, 255, 0.2);
      backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px);
      position: relative;
    }
    
    .gallery-box {
      background: rgba(8, 15, 28, 0.65); padding: 15px; border-radius: 20px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5), 0 0 15px rgba(0, 150, 255, 0.1) inset;
      border: 1px solid rgba(255, 255, 255, 0.1); border-bottom: 1px solid rgba(255, 255, 255, 0.2);
      backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px);
    }

    .close-btn {
      position: absolute; top: 12px; left: 15px; background: none; border: none; 
      color: rgba(255,255,255,0.5); font-size: 20px; cursor: pointer; transition: 0.3s;
    }
    .close-btn:hover { color: #fff; transform: scale(1.1); }
    
    #panel-title { 
      margin: 0 0 10px 0; color: #ffffff; font-size: 24px; font-weight: 800;
      text-shadow: 0 2px 10px rgba(0, 150, 255, 0.4);
    }
    #panel-desc { line-height: 1.7; font-size: 15px; margin: 0; color: #a0aec0; }
    
    .gallery-container { display: flex; gap: 10px; overflow-x: auto; padding-bottom: 5px; }
    .gallery-container::-webkit-scrollbar { height: 4px; }
    .gallery-container::-webkit-scrollbar-thumb { background: rgba(0,150,255,0.3); border-radius: 4px; }
    .gallery-card {
      height: 90px; min-width: 140px; border-radius: 8px; 
      border: 1px solid rgba(255,255,255,0.05); overflow: hidden;
      box-shadow: 0 4px 10px rgba(0,0,0,0.3); transition: 0.3s; cursor: pointer;
    }
    .gallery-card img { width: 100%; height: 100%; object-fit: cover; }
    .gallery-card:hover { transform: translateY(-3px); box-shadow: 0 6px 15px rgba(0, 150, 255, 0.3); }

    /* زر إظهار التفاصيل */
    #show-info-btn {
      position: absolute; top: 80px; right: 20px; z-index: 90; display: none;
      background: rgba(0, 150, 255, 0.2); color: #fff; border: 1px solid #00d2ff;
      padding: 10px 20px; border-radius: 8px; font-family: 'Cairo', sans-serif;
      cursor: pointer; backdrop-filter: blur(5px); transition: 0.3s; font-weight: bold;
    }
    #show-info-btn:hover { background: rgba(0, 150, 255, 0.4); box-shadow: 0 0 15px rgba(0,150,255,0.5); }

    /* زر ملء الشاشة (ينتمي للواجهة الداخلية) */
    .fullscreen-btn {
      position: absolute; bottom: 30px; right: 30px; z-index: 100;
      background: none; border: 1px solid rgba(255,255,255,0.3); color: #fff;
      width: 45px; height: 45px; border-radius: 8px; cursor: pointer;
      display: flex; align-items: center; justify-content: center; font-size: 20px;
      backdrop-filter: blur(5px); transition: 0.3s;
    }
    .fullscreen-btn:hover { border-color: #00d2ff; background: rgba(0,150,255,0.1); color: #00d2ff;}
  </style>

  <script>
    // 1. مكون الشبكة المضيئة
    AFRAME.registerComponent('neon-grid', {
      init: function () {
        let canvas = document.createElement('canvas');
        canvas.width = 512; canvas.height = 512;
        let ctx = canvas.getContext('2d');
        ctx.fillStyle = 'rgba(1, 3, 8, 1)'; 
        ctx.fillRect(0, 0, 512, 512);
        
        ctx.strokeStyle = 'rgba(0, 150, 255, 0.15)'; 
        ctx.lineWidth = 1.5; 
        ctx.shadowBlur = 5;
        ctx.shadowColor = "#00d2ff";
        ctx.strokeRect(0, 0, 512, 512);
        
        let texture = new THREE.CanvasTexture(canvas);
        texture.wrapS = THREE.RepeatWrapping;
        texture.wrapT = THREE.RepeatWrapping;
        texture.repeat.set(400, 400); 
        
        let material = new THREE.MeshStandardMaterial({ 
          map: texture, roughness: 0.5, metalness: 0.4 
        });
        this.el.getObject3D('mesh').material = material;
      }
    });

    // 2. مكون الضبط التلقائي للارتفاع والكاميرا لمنع (الغطس/التآكل)
    AFRAME.registerComponent('auto-center-align', {
      init: function () {
        this.el.addEventListener('model-loaded', () => {
          const obj = this.el.getObject3D('mesh');
          if (!obj) return;

          // حساب البوكس المحيط بالموديل لمعرفة أبعاده الحقيقية
          const box = new THREE.Box3().setFromObject(obj);
          const center = box.getCenter(new THREE.Vector3());
          const size = box.getSize(new THREE.Vector3());
          
          // إذا كان الموديل ينزل تحت الصفر، نرفعه للأعلى
          const minY = box.min.y;
          if(minY < 0) {
             let currentPos = this.el.getAttribute('position');
             this.el.setAttribute('position', {x: currentPos.x, y: currentPos.y - minY + 0.5, z: currentPos.z});
          }

          // تسجيل نقطة المركز الحقيقية للموديل لاستخدامها كهدف للكاميرا
          this.el.dataset.centerX = center.x;
          this.el.dataset.centerY = center.y > 0 ? center.y : 2; // التأكد أن الكاميرا تنظر لارتفاع مناسب
          this.el.dataset.centerZ = center.z;
          
          // حفظ بُعد مناسب للكاميرا بناءً على حجم الموديل (لتوسيع أريحية الزوم)
          const maxDim = Math.max(size.x, size.y, size.z);
          this.el.dataset.camRadius = maxDim > 0 ? maxDim * 1.5 : 40; 
        });
      }
    });

    // 3. البيانات وتحديد إحداثيات كل محطة
    const siteData = [
      { 
        id: 'scene-welcome', title: 'مشهد الترحيب', desc: '', images: '',
        panelPosition: 'none' // مشهد البداية لا يحتاج نافذة
      },
      { // 1: الجمرات (يسار)
        id: 'model_jamarat', title: 'منشأة الجمرات',
        desc: 'مجمع معماري حديث مصمم لتسهيل حركة الحجاج أثناء رمي الجمرات بانسيابية تامة.',
        images: 'https://images.unsplash.com/photo-1565552643952-b91c28bdf713?w=300',
        panelPosition: 'right'
      },
      { // 2: الخيام (يمين)
        id: 'model_khimaa', title: 'مخيمات منى',
        desc: 'مدينة الخيام المطورة، توفر إقامة آمنة ومريحة للحجاج ضمن تخطيط هندسي دقيق.',
        images: 'https://images.unsplash.com/photo-1591604129939-f1efa4d9f7fa?w=300',
        panelPosition: 'left'
      }
    ];

    let currentIndex = 0; // يبدأ من الترحيب
    let isStarted = false;

    // 4. دالة بدء التجربة (إخفاء غطاء البداية وإظهار الواجهة)
    function startExperience() {
      let screen = document.getElementById('start-screen');
      screen.style.opacity = '0';
      
      setTimeout(() => { 
        screen.style.display = 'none'; 
        // إظهار عناصر الواجهة المخفية (الأسهم وزر الـ VR)
        let uiElements = document.querySelectorAll('.ui-overlay');
        uiElements.forEach(el => el.style.display = 'flex');
        
        // إظهار زر الـ VR الافتراضي الخاص بـ aframe
        let vrBtn = document.querySelector('.a-enter-vr');
        if(vrBtn) vrBtn.style.display = 'block';

        isStarted = true;
        // المشهد الأول الترحيبي يعمل أوتوماتيكياً
      }, 800);
    }

    // إخفاء زر الـ VR فوراً عند تحميل الصفحة قبل الضغط على Play
    document.addEventListener("DOMContentLoaded", () => {
      let checkVR = setInterval(() => {
        let vrBtn = document.querySelector('.a-enter-vr');
        if(vrBtn) {
          vrBtn.style.display = 'none'; // نخفيه حتى نضغط Play
          clearInterval(checkVR);
        }
      }, 100);
    });

    function goToPrev() {
      if(!isStarted) return;
      currentIndex = (currentIndex - 1 + siteData.length) % siteData.length;
      showCurrentModel();
    }

    function goToNext() {
      if(!isStarted) return;
      currentIndex = (currentIndex + 1) % siteData.length;
      showCurrentModel();
    }

    // 5. التبديل وإظهار الموديلات في مكانها
    function showCurrentModel() {
      let data = siteData[currentIndex];
      closePanel();

      // إخفاء مشهد الترحيب والموديلات
      document.getElementById('scene-welcome').setAttribute('visible', 'false');
      let allModels = document.querySelectorAll('.scene-model');
      allModels.forEach(model => {
        model.setAttribute('visible', 'false');
        model.classList.remove('clickable');
      });

      let cameraEl = document.querySelector('[camera]');
      let orbit = cameraEl.components['orbit-controls'];

      if(currentIndex === 0) {
        // العودة لمشهد الترحيب
        document.getElementById('scene-welcome').setAttribute('visible', 'true');
        orbit.target.set(0, 5, 0);
        cameraEl.setAttribute('position', '0 10 30');
        return;
      }

      // إظهار الموديل المحدد فقط
      let currentModelEl = document.getElementById(data.id);
      if(currentModelEl) {
        currentModelEl.setAttribute('visible', 'true');
        currentModelEl.classList.add('clickable');
        
        // جلب الإحداثيات الدقيقة التي حسبها Component (auto-center-align)
        let cx = parseFloat(currentModelEl.dataset.centerX) || 0;
        let cy = parseFloat(currentModelEl.dataset.centerY) || 2;
        let cz = parseFloat(currentModelEl.dataset.centerZ) || 0;
        let cRadius = parseFloat(currentModelEl.dataset.camRadius) || 40;

        // توجيه الكاميرا للمركز الدقيق للموديل
        orbit.target.set(cx, cy, cz); 
        // وضع الكاميرا في مسافة مريحة للزوم
        cameraEl.setAttribute('position', `${cx} ${cy + 15} ${cz + cRadius}`);
      }
      
      // تحديث وإظهار النافذة
      setTimeout(() => { updateInfoPanel(data); }, 600);
    }

    function updateInfoPanel(data) {
      if(data.panelPosition === 'none') return;

      document.getElementById('panel-title').innerText = data.title;
      document.getElementById('panel-desc').innerText = data.desc;
      
      let galleryBox = document.getElementById('gallery-box');
      if (data.images) {
        let galleryHtml = '';
        data.images.split(',').forEach(img => {
          galleryHtml += `<div class="gallery-card"><img src="${img.trim()}" alt="صورة توضيحية"></div>`;
        });
        document.getElementById('gallery-container').innerHTML = galleryHtml;
        galleryBox.style.display = 'block'; 
      } else {
        galleryBox.style.display = 'none'; 
      }
      
      let panelContainer = document.getElementById('info-panel-container');
      if (data.panelPosition === 'right') {
        panelContainer.style.left = 'auto'; panelContainer.style.right = '5%';
        panelContainer.style.transform = 'translateY(-50%) perspective(1000px) rotateY(-12deg)';
      } else {
        panelContainer.style.right = 'auto'; panelContainer.style.left = '5%';
        panelContainer.style.transform = 'translateY(-50%) perspective(1000px) rotateY(12deg)';
      }
      
      panelContainer.style.display = 'block';
      document.getElementById('show-info-btn').style.display = 'none';
    }

    function closePanel() {
      document.getElementById('info-panel-container').style.display = 'none';
      if(currentIndex !== 0) {
          document.getElementById('show-info-btn').style.display = 'block';
      }
    }

    function openPanel() {
      document.getElementById('info-panel-container').style.display = 'block';
      document.getElementById('show-info-btn').style.display = 'none';
    }

    function toggleFullScreen() {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen();
      } else {
        if (document.exitFullscreen) document.exitFullscreen();
      }
    }
  </script>
</head>
<body>

  <!-- شاشة البدء (Play Screen) -->
  <div id="start-screen">
    <button class="play-btn" onclick="startExperience()">▶</button>
    <h1 class="start-title">معالم مشعر منى مكة المكرمة</h1>
  </div>

  <div id="vr-container">
    
    <div class="logos-wrapper">
      <img src="https://haj.gov.sa/_next/image?url=https%3A%2F%2Fhaj.gov.sa%2Fs-core%2F-%2Fmedia%2FProject%2FHAJJ%2FHajj-Logos%2FHeader-Logo.svg%3Fiar%3D0%26hash%3DEA30CCD6D55090BA41D3BA548A24E24A&w=256&q=75" alt="وزارة الحج والعمرة">
      <img src="https://image2url.com/r2/default/images/1773558610625-b250b6cd-d224-421f-b749-0894a9cf0602.png" alt="يوروكونسلت">
    </div>

    <!-- أزرار الواجهة المخفية خلف شاشة البدء -->
    <button id="show-info-btn" class="ui-overlay" onclick="openPanel()">إظهار التفاصيل</button>

    <div class="nav-arrows-container ui-overlay">
      <div class="nav-arrow" onclick="goToPrev()">&#10095;</div>
      <div class="nav-arrow" onclick="goToNext()">&#10094;</div>
    </div>

    <button class="fullscreen-btn ui-overlay" onclick="toggleFullScreen()" title="ملء الشاشة">⛶</button>

    <!-- البوب-أب المنفصل والمائل -->
    <div id="info-panel-container">
      <div class="info-box">
        <button class="close-btn" onclick="closePanel()">✖</button>
        <h2 id="panel-title">--</h2>
        <p id="panel-desc">--</p>
      </div>
      <div class="gallery-box" id="gallery-box">
        <div id="gallery-container" class="gallery-container"></div>
      </div>
    </div>

    <!-- تفعيل DepthBuffer لمنع الـ Z-fighting والتآكل -->
    <a-scene embedded antialias="true" renderer="logarithmicDepthBuffer: true; colorManagement: true;" vr-mode-ui="enabled: true">
      
      <a-assets timeout="30000">
        <a-asset-item id="model-jamarat" src="jamaraat.glb"></a-asset-item>
        <a-asset-item id="model-khimaa" src="KHIMAA.glb"></a-asset-item>
        
        <!-- الخط المستخدم للنصوص 3D -->
        <a-asset-item id="cairo-font" src="https://fonts.gstatic.com/s/cairo/v28/SLXVc1nY6Hkvangq7b1qXW7-m70cR_g.woff"></a-asset-item>
      </a-assets>

      <a-sky opacity="0"></a-sky>
      
      <a-plane position="0 0 0" rotation="-90 0 0" width="3000" height="3000" neon-grid></a-plane>

      <!-- الإضاءة العلوية الناعمة -->
      <a-light type="ambient" color="#030b1a" intensity="1.8"></a-light>
      <a-light type="spot" color="#0088ff" intensity="3" position="0 80 0" rotation="-90 0 0" angle="60" penumbra="1" distance="200" decay="2"></a-light>
      <a-light type="directional" color="#ffffff" intensity="0.6" position="10 30 20"></a-light>

      <a-entity id="models-group">
        
        <!-- ======================= -->
        <!-- 0. مشهد الترحيب النيون  -->
        <!-- ======================= -->
        <a-entity id="scene-welcome" position="0 0 0" visible="true">
          
          <!-- نص نيون مفرغ 3D -->
          <!-- نستخدم troika-text لدعم العربية بشكل احترافي مع خط كايرو -->
          <a-entity position="0 8 0" rotation="0 0 0" 
                    animation="property: position; dir: alternate; dur: 2500; loop: true; to: 0 8.5 0">
             <a-entity troika-text="value: حياكم في معالم\nمشعر منى; 
                                    font: #cairo-font;
                                    fontSize: 3;
                                    align: center;
                                    color: #00f3ff;
                                    outlineWidth: 0.05;
                                    outlineColor: #00f3ff;
                                    fillOpacity: 0.1;
                                    lineHeight: 1.2"
                       material="shader: flat">
             </a-entity>
          </a-entity>

          <!-- أسهم نيون ثلاثية الأبعاد متحركة لتشجيع التقليب -->
          <a-entity position="-3 3 0" rotation="0 0 0"
                    animation="property: position; to: 3 3 0; dur: 2000; easing: easeInOutSine; loop: true;">
            <a-entity troika-text="value: > > >; font: #cairo-font; fontSize: 2; color: #00f3ff; outlineWidth: 0.03; outlineColor: #00f3ff; fillOpacity: 0.2;" material="shader: flat"></a-entity>
          </a-entity>

        </a-entity>

        <!-- ======================= -->
        <!-- 1. منشأة الجمرات        -->
        <!-- ======================= -->
        <a-entity id="model_jamarat" class="scene-model" position="0 0 0" visible="false" auto-center-align>
          <!-- 🔴 تحكم في حجم الجمرات. تم تكبيرها (0.05) لتبدو ضخمة وملائمة -->
          <a-gltf-model src="#model-jamarat" scale="0.05 0.05 0.05"></a-gltf-model>
        </a-entity>

        <!-- ======================= -->
        <!-- 2. مخيمات منى          -->
        <!-- ======================= -->
        <a-entity id="model_khimaa" class="scene-model" position="0 0 0" visible="false" auto-center-align>
          <!-- 🔴 تم تكبير الخيام. جرب 5 أو 10 -->
          <a-gltf-model src="#model-khimaa" scale="5 5 5"></a-gltf-model>
        </a-entity>

      </a-entity>

      <!-- 
        الكاميرا قريبة جداً (near: 0.1) لتمنع القطع من الأمام وتدور براحة.
        تم السماح بالزوم والتنقل (Pan).
      -->
      <a-entity camera="near: 0.1; far: 10000" look-controls="enabled: false" 
                orbit-controls="target: 0 5 0; minDistance: 2; maxDistance: 300; initialPosition: 0 10 30; 
                                enablePan: true; enableZoom: true; enableDamping: true; dampingFactor: 0.05; rotateSpeed: 0.5;">
      </a-entity>
      
    </a-scene>
  </div>
</body>
</html>
