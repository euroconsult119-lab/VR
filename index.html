<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <title>منصة المشاعر المقدسة الافتراضية</title>
  
  <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
  <script src="https://unpkg.com/aframe-orbit-controls@1.3.2/dist/aframe-orbit-controls.min.js"></script>

  <style>
    body, html {
      margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: #02050a; /* لون السماء الأساسي */
    }

    #vr-container { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }

    /* الشعارات */
    .logos-wrapper {
      position: absolute; top: 20px; left: 0; right: 0;
      display: flex; justify-content: space-between; padding: 0 40px;
      z-index: 100; pointer-events: none; 
    }
    .logos-wrapper img { 
      height: 35px; object-fit: contain; pointer-events: auto;
      filter: brightness(0) invert(1); opacity: 0.9;
    }

    /* أسهم التنقل (Slider) السفلية */
    .nav-arrows-container {
      position: absolute; bottom: 40px; left: 50%; transform: translateX(-50%);
      display: flex; gap: 60px; z-index: 100; pointer-events: none;
    }
    .nav-arrow {
      pointer-events: auto;
      width: 55px; height: 55px; border-radius: 50%;
      background: rgba(4, 10, 20, 0.7); 
      border: 1px solid rgba(0, 150, 255, 0.4);
      color: #00d2ff; font-size: 24px; font-weight: bold;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; transition: 0.3s; backdrop-filter: blur(8px);
      box-shadow: 0 0 20px rgba(0, 150, 255, 0.15);
    }
    .nav-arrow:hover { 
      background: rgba(0, 150, 255, 0.2); 
      box-shadow: 0 0 25px rgba(0, 150, 255, 0.6); 
      transform: scale(1.1); color: #fff; border-color: #00d2ff;
    }

    /* نافذة البوب-أب */
    #info-panel {
      position: absolute; top: 40%; left: 50%; transform: translate(-50%, -50%);
      width: 85%; max-width: 450px;
      background: rgba(6, 12, 24, 0.85); color: #fff;
      padding: 25px; border-radius: 16px; z-index: 100; display: none; 
      box-shadow: 0 0 40px rgba(0, 100, 255, 0.3), inset 0 0 20px rgba(0, 150, 255, 0.1);
      border: 1px solid rgba(0, 150, 255, 0.4); backdrop-filter: blur(10px);
    }
    .close-btn {
      position: absolute; top: 10px; left: 15px; background: none; border: none; 
      color: #00aaff; font-size: 24px; cursor: pointer; transition: 0.3s;
    }
    .close-btn:hover { color: #fff; transform: scale(1.1); }
    #panel-title { 
      margin: 0 0 10px 0; color: #00d2ff; font-size: 20px; 
      border-bottom: 1px solid rgba(0, 150, 255, 0.3); padding-bottom: 10px;
    }
    #panel-desc { line-height: 1.6; font-size: 14px; margin-bottom: 15px; color: #cbd5e1; }
    
    .gallery-container { display: flex; gap: 10px; overflow-x: auto; padding-bottom: 5px; }
    .gallery-container img {
      height: 90px; min-width: 130px; border-radius: 6px; border: 1px solid rgba(0, 150, 255, 0.3);
      object-fit: cover;
    }
  </style>

  <script>
    // تصميم الشبكة الناعمة والهادئة
    AFRAME.registerComponent('neon-grid', {
      init: function () {
        let canvas = document.createElement('canvas');
        canvas.width = 512; canvas.height = 512;
        let ctx = canvas.getContext('2d');
        
        ctx.fillStyle = 'rgba(0, 0, 0, 1)'; 
        ctx.fillRect(0, 0, 512, 512);
        
        // خطوط رفيعة وناعمة
        ctx.strokeStyle = 'rgba(0, 150, 255, 0.3)'; 
        ctx.lineWidth = 1.5; 
        ctx.shadowBlur = 8;
        ctx.shadowColor = "#00d2ff";
        ctx.strokeRect(0, 0, 512, 512);
        
        let texture = new THREE.CanvasTexture(canvas);
        texture.wrapS = THREE.RepeatWrapping;
        texture.wrapT = THREE.RepeatWrapping;
        texture.repeat.set(300, 300); 
        
        let material = new THREE.MeshStandardMaterial({ 
          map: texture, roughness: 0.6, metalness: 0.3 
        });
        this.el.getObject3D('mesh').material = material;
      }
    });

    const siteData = [
      {
        id: 'jamarat',
        title: 'منشأة الجمرات',
        desc: 'مجمع معماري حديث مصمم لتسهيل حركة الحجاج أثناء رمي الجمرات، يظهر هنا تفصيل المسارات المتعددة.',
        images: 'https://images.unsplash.com/photo-1565552643952-b91c28bdf713?w=300',
        camTarget: {x: -15, y: 0, z: 0},
        camPos: {x: -15, y: 12, z: 20}
      },
      {
        id: 'khimaa',
        title: 'مخيمات منى',
        desc: 'مدينة الخيام المطورة، توفر إقامة آمنة ومريحة للحجاج ضمن تخطيط هندسي دقيق لمنطقة المشاعر.',
        images: 'https://images.unsplash.com/photo-1591604129939-f1efa4d9f7fa?w=300',
        camTarget: {x: 15, y: 0, z: 0},
        camPos: {x: 15, y: 12, z: 20}
      }
    ];

    let currentIndex = 0;

    function goToNext() {
      // الاتجاه نحو اليسار (الموديل التالي)
      currentIndex = (currentIndex + 1) % siteData.length;
      animateCameraToCurrentModel();
    }

    function goToPrev() {
      // الاتجاه نحو اليمين (الموديل السابق)
      currentIndex = (currentIndex - 1 + siteData.length) % siteData.length;
      animateCameraToCurrentModel();
    }

    // حركة الكاميرا السينمائية (Zoom Out -> Zoom In)
    function animateCameraToCurrentModel() {
      let data = siteData[currentIndex];
      let cameraEl = document.querySelector('[camera]');
      
      closePanel(); // إغلاق النافذة أثناء الحركة

      let currentPos = cameraEl.getAttribute('position');
      
      // حساب نقطة في المنتصف وتكون مرتفعة جداً لعمل (الزوم أوت)
      let midX = (currentPos.x + data.camPos.x) / 2;
      let midY = Math.max(currentPos.y, data.camPos.y) + 30; // ارتفاع 30 متر
      let midZ = Math.max(currentPos.z, data.camPos.z) + 30; // رجوع 30 متر للخلف

      // 1. حركة الكاميرا للأعلى والخلف (Zoom Out)
      cameraEl.setAttribute('animation__zoomout', `property: position; to: ${midX} ${midY} ${midZ}; dur: 800; easing: easeOutSine`);
      
      // حركة الهدف (Target) بنعومة
      cameraEl.setAttribute('animation__target', `property: orbit-controls.target; to: ${data.camTarget.x} ${data.camTarget.y} ${data.camTarget.z}; dur: 1600; easing: easeInOutSine`);

      // 2. حركة الكاميرا للأسفل نحو الموديل الجديد (Zoom In) بعد 800 ملي ثانية
      setTimeout(() => {
        cameraEl.removeAttribute('animation__zoomout');
        cameraEl.setAttribute('animation__zoomin', `property: position; to: ${data.camPos.x} ${data.camPos.y} ${data.camPos.z}; dur: 800; easing: easeInSine`);
      }, 800);

      // 3. إظهار البيانات بعد انتهاء الحركة (1600 ملي ثانية)
      setTimeout(() => {
        cameraEl.removeAttribute('animation__zoomin');
        cameraEl.removeAttribute('animation__target');
        
        document.getElementById('panel-title').innerText = data.title;
        document.getElementById('panel-desc').innerText = data.desc;
        let galleryHtml = '';
        if (data.images) {
          data.images.split(',').forEach(img => {
            galleryHtml += `<img src="${img.trim()}" alt="صورة توضيحية">`;
          });
        }
        document.getElementById('gallery-container').innerHTML = galleryHtml;
        document.getElementById('info-panel').style.display = 'block';
      }, 1600);
    }

    function closePanel() {
      document.getElementById('info-panel').style.display = 'none';
    }

    // تفاعل النقطة مع الماوس لتعمل نفس وظيفة الأسهم
    AFRAME.registerComponent('hotspot-action', {
      schema: { index: {type: 'number'} },
      init: function () {
        this.el.addEventListener('click', () => {
          if (currentIndex !== this.data.index) {
            currentIndex = this.data.index;
            animateCameraToCurrentModel();
          } else {
            // إذا كنت بالفعل في الموديل، فقط أظهر النافذة
            document.getElementById('info-panel').style.display = 'block';
          }
        });
      }
    });
  </script>
</head>
<body>

  <div id="vr-container">
    
    <div class="logos-wrapper">
      <img src="https://haj.gov.sa/_next/image?url=https%3A%2F%2Fhaj.gov.sa%2Fs-core%2F-%2Fmedia%2FProject%2FHAJJ%2FHajj-Logos%2FHeader-Logo.svg%3Fiar%3D0%26hash%3DEA30CCD6D55090BA41D3BA548A24E24A&w=256&q=75" alt="وزارة الحج والعمرة">
      <img src="https://image2url.com/r2/default/images/1773558610625-b250b6cd-d224-421f-b749-0894a9cf0602.png" alt="يوروكونسلت">
    </div>

    <!-- أسهم التنقل -->
    <div class="nav-arrows-container">
      <div class="nav-arrow" onclick="goToPrev()">&#10095;</div> <!-- الأيمن يذهب للموديل السابق (يمين) -->
      <div class="nav-arrow" onclick="goToNext()">&#10094;</div> <!-- الأيسر يذهب للموديل التالي (يسار) -->
    </div>

    <div id="info-panel">
      <button class="close-btn" onclick="closePanel()">✖</button>
      <h2 id="panel-title">--</h2>
      <p id="panel-desc">--</p>
      <div id="gallery-container" class="gallery-container"></div>
    </div>

    <!-- 
      تفعيل الضباب (Fog) لدمج الأرضية مع السماء وإخفاء خط الأفق الحاد.
      تفعيل antialias لمنع التشويش.
    -->
    <a-scene embedded antialias="true" shadow="type: pcfsoft" fog="type: exponential; color: #02050a; density: 0.015" vr-mode-ui="enabled: true">
      
      <a-assets timeout="30000">
        <a-asset-item id="model-jamarat" src="jamaraat.glb"></a-asset-item>
        <a-asset-item id="model-khimaa" src="KHIMAA.glb"></a-asset-item>
      </a-assets>

      <a-sky color="#02050a"></a-sky>
      
      <!-- أرضية الشبكة تتلاشى مع الضباب في الأفق -->
      <a-plane position="0 0 0" rotation="-90 0 0" width="2000" height="2000" neon-grid shadow="receive: true"></a-plane>

      <!-- الإضاءة العلوية الزرقاء الناعمة التي تغمر الكانفس بالكامل -->
      <a-light type="ambient" color="#1e3a8a" intensity="1.2"></a-light>
      <!-- كشاف قوي من الأعلى لإضاءة الموديلات بقوة وإسقاط ظلال -->
      <a-light type="directional" color="#e0f2fe" intensity="1.8" position="0 80 20" castShadow="true" shadow-mapSize="2048"></a-light>
      <a-light type="point" color="#00aaff" intensity="1" position="0 5 10" distance="100"></a-light>

      <a-entity id="models-group">
        
        <!-- === الموديل الأول: الجمرات === -->
        <a-entity position="-15 0 0">
          <a-gltf-model src="#model-jamarat" scale="0.005 0.005 0.005" shadow="cast: true"></a-gltf-model>
          
          <!-- النقطة التفاعلية -->
          <a-entity line="start: 0 0.5 0; end: 0 3.5 0; color: #00d2ff; opacity: 0.6"></a-entity>
          <a-sphere class="clickable" position="0 3.5 0" radius="0.06" color="#ffffff" material="shader: flat" 
                    animation="property: position; dir: alternate; dur: 2000; loop: true; to: 0 3.7 0"
                    hotspot-action="index: 0"></a-sphere>
          <a-sphere position="0 3.5 0" radius="0.12" color="#00d2ff" material="shader: flat; transparent: true; opacity: 0.4"
                    animation="property: position; dir: alternate; dur: 2000; loop: true; to: 0 3.7 0"></a-sphere>
        </a-entity>

        <!-- === الموديل الثاني: الخيام === -->
        <a-entity position="15 0 0">
          <!-- 🔴 تم تكبير الخيام بقوة (من 0.005 إلى 5). إذا ظلت صغيرة اجعلها 10 أو 20 -->
          <a-gltf-model src="#model-khimaa" scale="5 5 5" shadow="cast: true"></a-gltf-model>
          
          <!-- النقطة التفاعلية -->
          <a-entity line="start: 0 0.5 0; end: 0 3.5 0; color: #00d2ff; opacity: 0.6"></a-entity>
          <a-sphere class="clickable" position="0 3.5 0" radius="0.06" color="#ffffff" material="shader: flat" 
                    animation="property: position; dir: alternate; dur: 2000; loop: true; to: 0 3.7 0"
                    hotspot-action="index: 1"></a-sphere>
          <a-sphere position="0 3.5 0" radius="0.12" color="#00d2ff" material="shader: flat; transparent: true; opacity: 0.4"
                    animation="property: position; dir: alternate; dur: 2000; loop: true; to: 0 3.7 0"></a-sphere>
        </a-entity>

      </a-entity>

      <!-- الكاميرا المدارية -->
      <a-entity camera look-controls="enabled: false" 
                orbit-controls="target: -15 0 0; minDistance: 5; maxDistance: 150; initialPosition: -15 12 20; 
                                enablePan: true; enableZoom: true; enableDamping: true; dampingFactor: 0.08;">
      </a-entity>
      
    </a-scene>
  </div>
</body>
</html>
