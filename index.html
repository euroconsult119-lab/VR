<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <title>منصة المشاعر المقدسة الافتراضية</title>
  
  <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
  <script src="https://unpkg.com/aframe-orbit-controls@1.3.2/dist/aframe-orbit-controls.min.js"></script>

  <style>
    body, html {
      margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      /* خلفية مطابقة لصورة الإضاءة العلوية الزرقاء */
      background: #010308;
    }

    #vr-container { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }

    /* الشعارات */
    .logos-wrapper {
      position: absolute; top: 20px; left: 0; right: 0;
      display: flex; justify-content: space-between; padding: 0 40px;
      z-index: 100; pointer-events: none; 
    }
    .logos-wrapper img { 
      height: 35px; object-fit: contain; pointer-events: auto;
      filter: brightness(0) invert(1); opacity: 0.85;
    }

    /* أسهم التنقل - تم إصلاحها */
    .nav-arrows-container {
      position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%);
      display: flex; gap: 80px; z-index: 100; pointer-events: none;
      direction: ltr; /* لضمان بقاء السهم الأيمن يميناً والأيسر يساراً */
    }
    .nav-arrow {
      pointer-events: auto;
      width: 50px; height: 50px; border-radius: 50%;
      background: rgba(6, 12, 24, 0.4); 
      border: 1px solid rgba(0, 150, 255, 0.3);
      color: #00d2ff; font-size: 22px; font-weight: bold;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; transition: 0.3s; backdrop-filter: blur(5px);
    }
    .nav-arrow:hover { 
      background: rgba(0, 150, 255, 0.2); 
      box-shadow: 0 0 20px rgba(0, 150, 255, 0.5); 
      transform: scale(1.1); color: #fff; border-color: #00d2ff;
    }

    /* نافذة البوب-أب الجانبية الزجاجية */
    #info-panel {
      position: absolute; top: 50%; transform: translateY(-50%);
      width: 380px; 
      background: rgba(8, 15, 28, 0.7); color: #fff;
      padding: 25px; border-radius: 20px; z-index: 100; display: none; 
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.6), 0 0 20px rgba(0, 150, 255, 0.1) inset;
      border: 1px solid rgba(255, 255, 255, 0.1); border-top: 1px solid rgba(255, 255, 255, 0.2);
      backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px);
    }
    .close-btn {
      position: absolute; top: 12px; left: 15px; background: none; border: none; 
      color: rgba(255,255,255,0.5); font-size: 20px; cursor: pointer; transition: 0.3s;
    }
    .close-btn:hover { color: #fff; transform: scale(1.1); }
    #panel-title { 
      margin: 0 0 12px 0; color: #ffffff; font-size: 22px; font-weight: 600;
      text-shadow: 0 2px 10px rgba(0, 150, 255, 0.4);
    }
    #panel-desc { line-height: 1.7; font-size: 14px; margin-bottom: 20px; color: #a0aec0; }
    
    .gallery-container { display: flex; gap: 12px; overflow-x: auto; padding-bottom: 8px; }
    .gallery-container::-webkit-scrollbar { height: 4px; }
    .gallery-container::-webkit-scrollbar-thumb { background: rgba(0,150,255,0.3); border-radius: 4px; }
    .gallery-card {
      height: 90px; min-width: 140px; border-radius: 8px; 
      border: 1px solid rgba(255,255,255,0.05); overflow: hidden;
      box-shadow: 0 4px 10px rgba(0,0,0,0.3); transition: 0.3s;
    }
    .gallery-card img { width: 100%; height: 100%; object-fit: cover; }
    .gallery-card:hover { transform: translateY(-3px); box-shadow: 0 6px 15px rgba(0, 150, 255, 0.2); }
  </style>

  <script>
    // رسم الشبكة الناعمة لتلتقط إضاءة الـ SpotLight
    AFRAME.registerComponent('neon-grid', {
      init: function () {
        let canvas = document.createElement('canvas');
        canvas.width = 512; canvas.height = 512;
        let ctx = canvas.getContext('2d');
        
        ctx.fillStyle = 'rgba(1, 3, 8, 1)'; // لون الأرضية أسود عميق
        ctx.fillRect(0, 0, 512, 512);
        
        ctx.strokeStyle = 'rgba(0, 150, 255, 0.15)'; // خطوط زرقاء ناعمة جداً
        ctx.lineWidth = 1.5; 
        ctx.strokeRect(0, 0, 512, 512);
        
        let texture = new THREE.CanvasTexture(canvas);
        texture.wrapS = THREE.RepeatWrapping;
        texture.wrapT = THREE.RepeatWrapping;
        texture.repeat.set(400, 400); 
        
        let material = new THREE.MeshStandardMaterial({ 
          map: texture, roughness: 0.5, metalness: 0.4 
        });
        this.el.getObject3D('mesh').material = material;
      }
    });

    // بيانات الموديلات والتحكم في موقع النوافذ
    const siteData = [
      {
        id: 'jamarat',
        title: 'منشأة الجمرات',
        desc: 'مجمع معماري حديث مصمم لتسهيل حركة الحجاج أثناء رمي الجمرات، يظهر هنا تفصيل المسارات المتعددة.',
        images: 'https://images.unsplash.com/photo-1565552643952-b91c28bdf713?w=300',
        camTarget: {x: -15, y: 0, z: 0},
        camPos: {x: -15, y: 15, z: 25},
        panelPosition: 'right' // الموديل يسار -> النافذة يمين
      },
      {
        id: 'khimaa',
        title: 'مخيمات منى',
        desc: 'مدينة الخيام المطورة، توفر إقامة آمنة ومريحة للحجاج ضمن تخطيط هندسي دقيق لمنطقة المشاعر.',
        images: 'https://images.unsplash.com/photo-1591604129939-f1efa4d9f7fa?w=300',
        camTarget: {x: 15, y: 0, z: 0},
        camPos: {x: 15, y: 15, z: 25},
        panelPosition: 'left' // الموديل يمين -> النافذة يسار
      }
    ];

    let currentIndex = 0;
    let isAnimating = false;

    // تم إصلاح اتجاهات الأسهم هنا
    function goToPrev() { // السهم الأيسر يذهب للجمرات (اليسار)
      if(isAnimating) return;
      currentIndex = 0;
      animateCameraToCurrentModel();
    }

    function goToNext() { // السهم الأيمن يذهب للخيام (اليمين)
      if(isAnimating) return;
      currentIndex = 1;
      animateCameraToCurrentModel();
    }

    function animateCameraToCurrentModel() {
      isAnimating = true;
      let data = siteData[currentIndex];
      let cameraEl = document.querySelector('[camera]');
      
      closePanel(); 

      let currentPos = cameraEl.getAttribute('position');
      
      // الكاميرا ترتفع وترجع للخلف ثم تهبط (حركة سينمائية)
      let midX = (currentPos.x + data.camPos.x) / 2;
      let midY = Math.max(currentPos.y, data.camPos.y) + 20; 
      let midZ = Math.max(currentPos.z, data.camPos.z) + 15; 

      cameraEl.setAttribute('animation__zoomout', `property: position; to: ${midX} ${midY} ${midZ}; dur: 800; easing: easeOutQuad`);
      cameraEl.setAttribute('animation__target', `property: orbit-controls.target; to: ${data.camTarget.x} ${data.camTarget.y} ${data.camTarget.z}; dur: 1600; easing: easeInOutSine`);

      setTimeout(() => {
        cameraEl.removeAttribute('animation__zoomout');
        cameraEl.setAttribute('animation__zoomin', `property: position; to: ${data.camPos.x} ${data.camPos.y} ${data.camPos.z}; dur: 800; easing: easeInQuad`);
      }, 800);

      setTimeout(() => {
        cameraEl.removeAttribute('animation__zoomin');
        cameraEl.removeAttribute('animation__target');
        
        document.getElementById('panel-title').innerText = data.title;
        document.getElementById('panel-desc').innerText = data.desc;
        let galleryHtml = '';
        if (data.images) {
          data.images.split(',').forEach(img => {
            galleryHtml += `<div class="gallery-card"><img src="${img.trim()}" alt="صورة توضيحية"></div>`;
          });
        }
        document.getElementById('gallery-container').innerHTML = galleryHtml;
        
        // ضبط مكان النافذة (عكس مكان الموديل)
        let panel = document.getElementById('info-panel');
        if (data.panelPosition === 'right') {
          panel.style.left = 'auto';
          panel.style.right = '5%';
        } else {
          panel.style.right = 'auto';
          panel.style.left = '5%';
        }
        
        panel.style.display = 'block';
        isAnimating = false;
      }, 1600);
    }

    function closePanel() {
      document.getElementById('info-panel').style.display = 'none';
    }

    // النقر على النقطة البيضاء 
    AFRAME.registerComponent('hotspot-action', {
      schema: { index: {type: 'number'} },
      init: function () {
        this.el.addEventListener('click', () => {
          if (currentIndex !== this.data.index) {
            currentIndex = this.data.index;
            animateCameraToCurrentModel();
          } else {
            let panel = document.getElementById('info-panel');
            if (siteData[currentIndex].panelPosition === 'right') {
              panel.style.left = 'auto'; panel.style.right = '5%';
            } else {
              panel.style.right = 'auto'; panel.style.left = '5%';
            }
            panel.style.display = 'block';
          }
        });
      }
    });
  </script>
</head>
<body>

  <div id="vr-container">
    
    <div class="logos-wrapper">
      <img src="https://haj.gov.sa/_next/image?url=https%3A%2F%2Fhaj.gov.sa%2Fs-core%2F-%2Fmedia%2FProject%2FHAJJ%2FHajj-Logos%2FHeader-Logo.svg%3Fiar%3D0%26hash%3DEA30CCD6D55090BA41D3BA548A24E24A&w=256&q=75" alt="وزارة الحج والعمرة">
      <img src="https://image2url.com/r2/default/images/1773558610625-b250b6cd-d224-421f-b749-0894a9cf0602.png" alt="يوروكونسلت">
    </div>

    <!-- أسهم التنقل (مضبوطة لتعمل بشكل سليم مع أماكن الموديلات) -->
    <div class="nav-arrows-container">
      <div class="nav-arrow" onclick="goToPrev()">&#10094;</div> <!-- يسار: يذهب للجمرات -->
      <div class="nav-arrow" onclick="goToNext()">&#10095;</div> <!-- يمين: يذهب للخيام -->
    </div>

    <div id="info-panel">
      <button class="close-btn" onclick="closePanel()">✖</button>
      <h2 id="panel-title">--</h2>
      <p id="panel-desc">--</p>
      <div id="gallery-container" class="gallery-container"></div>
    </div>

    <a-scene embedded antialias="true" renderer="colorManagement: true;" vr-mode-ui="enabled: false">
      
      <a-assets timeout="30000">
        <a-asset-item id="model-jamarat" src="jamaraat.glb"></a-asset-item>
        <a-asset-item id="model-khimaa" src="KHIMAA.glb"></a-asset-item>
      </a-assets>

      <a-sky opacity="0"></a-sky>
      
      <!-- أرضية الشبكة -->
      <a-plane position="0 0 0" rotation="-90 0 0" width="2000" height="2000" neon-grid shadow="receive: true"></a-plane>

      <!-- 
        الإضاءة العلوية الناعمة جداً (مطابقة للصورة المرجعية)
        كشاف SpotLight بفتحة واسعة وحواف ناعمة 100% يخلق بقعة ضوء زرقاء متدرجة في المنتصف
      -->
      <a-light type="ambient" color="#030b1a" intensity="1.8"></a-light>
      <a-light type="spot" color="#0088ff" intensity="3" position="0 60 0" rotation="-90 0 0" angle="50" penumbra="1" distance="150" decay="2"></a-light>
      <a-light type="directional" color="#ffffff" intensity="0.6" position="10 20 20" castShadow="true"></a-light>

      <a-entity id="models-group">
        
        <!-- الجمرات (على اليسار) -->
        <a-entity position="-20 0 0">
          <a-gltf-model src="#model-jamarat" scale="0.05 0.05 0.05" shadow="cast: true"></a-gltf-model>
          
          <!-- النقطة البيضاء التفاعلية -->
          <a-entity line="start: 0 0.5 0; end: 0 4 0; color: #ffffff; opacity: 0.5"></a-entity>
          <!-- الكرة التفاعلية غير المرئية (لتسهيل النقر) -->
          <a-sphere class="clickable" position="0 4 0" radius="0.6" opacity="0" hotspot-action="index: 0"></a-sphere>
          <!-- الشكل المرئي للنقطة -->
          <a-sphere position="0 1 0" radius="0.1" color="#ffffff" material="shader: flat" 
                    animation="property: position; dir: alternate; dur: 2000; loop: true; to: 0 4.2 0" pointer-events="none"></a-sphere>
        </a-entity>

        <!-- الخيام (على اليمين) -->
        <a-entity position="15 0 0">
          <!-- تكبير الخيام لتكون واضحة -->
          <a-gltf-model src="#model-khimaa" scale="5 5 5" shadow="cast: true"></a-gltf-model>
          
          <!-- النقطة البيضاء التفاعلية -->
          <a-entity line="start: 0 0.5 0; end: 0 4 0; color: #ffffff; opacity: 0.5"></a-entity>
          <!-- الكرة التفاعلية غير المرئية -->
          <a-sphere class="clickable" position="0 4 0" radius="0.6" opacity="0" hotspot-action="index: 1"></a-sphere>
          <!-- الشكل المرئي للنقطة -->
          <a-sphere position="0 1 0" radius="0.1" color="#ffffff" material="shader: flat" 
                    animation="property: position; dir: alternate; dur: 2000; loop: true; to: 0 4.2 0" pointer-events="none"></a-sphere>
        </a-entity>

      </a-entity>

      <!-- 
        حركة الكاميرا المدارية 
        تم تقليل سرعة الدوران dampingFactor لتكون مرنة وناعمة بالماوس
      -->
      <a-entity camera look-controls="enabled: false" 
                orbit-controls="target: -15 0 0; minDistance: 5; maxDistance: 120; initialPosition: -15 15 25; 
                                enablePan: true; enableZoom: true; enableDamping: true; dampingFactor: 0.05; rotateSpeed: 0.6; zoomSpeed: 0.8;">
      </a-entity>
      
    </a-scene>
  </div>
</body>
</html>
