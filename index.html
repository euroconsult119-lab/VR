  <script>
    AFRAME.registerComponent('gradient-sky', {
      init: function () {
        var vertexShader = `
          varying vec3 vWorldPosition;
          void main() {
            vec4 worldPosition = modelMatrix * vec4( position, 1.0 );
            vWorldPosition = worldPosition.xyz;
            gl_Position = projectionMatrix * modelViewMatrix * vec4( position, 1.0 );
          }
        `;
        var fragmentShader = `
          varying vec3 vWorldPosition;
          void main() {
            float h = normalize( vWorldPosition ).y;
            vec3 bottomColor = vec3(0.0, 0.05, 0.15); 
            vec3 topColor = vec3(0.0, 0.0, 0.0); 
            float mixFactor = max(0.0, h);
            gl_FragColor = vec4( mix(bottomColor, topColor, mixFactor), 1.0 );
          }
        `;
        var material = new THREE.ShaderMaterial({
          vertexShader: vertexShader,
          fragmentShader: fragmentShader,
          side: THREE.BackSide
        });
        var geometry = new THREE.SphereGeometry(4000, 32, 15);
        var mesh = new THREE.Mesh(geometry, material);
        this.el.setObject3D('mesh', mesh);
      }
    });

    AFRAME.registerComponent('star-system', {
      schema: {
        count: {type: 'number', default: 2500},
        radius: {type: 'number', default: 1000}
      },
      init: function () {
        let geometry = new THREE.BufferGeometry();
        let vertices = [];
        for (let i = 0; i < this.data.count; i++) {
          let x = (Math.random() - 0.5) * 2 * this.data.radius;
          let y = (Math.random() - 0.5) * 2 * this.data.radius;
          let z = (Math.random() - 0.5) * 2 * this.data.radius;
          if (Math.sqrt(x*x + y*y + z*z) < 200) continue;
          vertices.push(x, y, z);
        }
        geometry.setAttribute('position', new THREE.Float32BufferAttribute(vertices, 3));
        let material = new THREE.PointsMaterial({color: 0xffffff, size: 1.5, transparent: true, opacity: 0.8});
        this.stars = new THREE.Points(geometry, material);
        this.el.setObject3D('mesh', this.stars);
      },
      tick: function (time, delta) {
        if(this.stars) {
          this.stars.rotation.y += 0.00005 * delta;
          this.stars.rotation.x += 0.00002 * delta;
        }
      }
    });

    AFRAME.registerComponent('neon-grid', {
      init: function () {
        let canvas = document.createElement('canvas');
        canvas.width = 512; canvas.height = 512;
        let ctx = canvas.getContext('2d');
        ctx.fillStyle = 'rgba(0, 2, 8, 1)'; 
        ctx.fillRect(0, 0, 512, 512);
        
        ctx.strokeStyle = 'rgba(0, 150, 255, 0.15)'; 
        ctx.lineWidth = 1.5; 
        ctx.shadowBlur = 5;
        ctx.shadowColor = "#00d2ff";
        ctx.strokeRect(0, 0, 512, 512);
        
        let texture = new THREE.CanvasTexture(canvas);
        texture.wrapS = THREE.RepeatWrapping;
        texture.wrapT = THREE.RepeatWrapping;
        texture.repeat.set(800, 800); 
        
        let material = new THREE.MeshStandardMaterial({ 
          map: texture, roughness: 0.8, metalness: 0.1 
        });
        this.el.getObject3D('mesh').material = material;
      }
    });

    AFRAME.registerComponent('hollow-neon-text', {
      schema: {
        text: {type: 'string', default: ''},
        size: {type: 'number', default: 120},
        color: {type: 'string', default: '#00d2ff'},
        width: {type: 'number', default: 120},
        height: {type: 'number', default: 15}
      },
      init: function () {
        let canvas = document.createElement('canvas');
        canvas.width = 4096; canvas.height = 512;
        let ctx = canvas.getContext('2d');

        let texture = new THREE.CanvasTexture(canvas);
        texture.anisotropy = 16;
        let material = new THREE.MeshBasicMaterial({ map: texture, transparent: true, depthWrite: false });
        let geometry = new THREE.PlaneGeometry(this.data.width, this.data.height);
        let mesh = new THREE.Mesh(geometry, material);
        this.el.setObject3D('mesh', mesh);

        document.fonts.ready.then(() => {
          ctx.clearRect(0, 0, canvas.width, canvas.height);
          ctx.direction = 'rtl';
          ctx.textAlign = 'center'; 
          ctx.textBaseline = 'middle';
          ctx.font = `bold ${this.data.size}px Cairo, sans-serif`;
          ctx.lineJoin = "round";

          ctx.shadowColor = this.data.color;
          ctx.shadowBlur = 40;
          ctx.strokeStyle = this.data.color;
          ctx.lineWidth = 14;
          ctx.strokeText(this.data.text, canvas.width/2, canvas.height/2);

          ctx.shadowBlur = 0;
          ctx.globalCompositeOperation = 'destination-out';
          ctx.fillStyle = '#ffffff';
          ctx.fillText(this.data.text, canvas.width/2, canvas.height/2);

          ctx.globalCompositeOperation = 'source-over';
          texture.needsUpdate = true;
        });
      }
    });

        id: 'model_alkhif', 
        title: 'مسجد الخيف',
        desc: 'يُعرف مسجد الخيف بمنى بـ "مسجد الأنبياء"، حيث تشير الروايات إلى أن سبعين نبياً قد صلوا فيه، من بينهم النبي موسى والنبي محمد (عليهم الصلاة والسلام). يقع المسجد على سفح جبل المشعر، وقد استمد اسمه "الخيف" من موقعه المرتفع عن مجرى السيل. يتميز بعمارته الإسلامية الواسعة ويعد محطة إيمانية بارزة للحجاج خلال أيام التشريق.',
        images: 'https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcT-I1nzPOasZO5a5GKVKp2klpFenSXwilAcaAZILRRqpNeO-BkucpQQ2irj&s=10,https://www.qpedia.org/uploads/topics/5251201503.jpg,https://www.alriyadh.com/media/article/2022/06/15/img/8972860010.jpg,https://pn-site-storage.fra1.cdn.digitaloceanspaces.com/PN-SITE-2-WP/uploads/2023/01/2022-07-24.jpg', 
        camRadius: 100, camHeight: 40, panelPosition: 'right', offsetX: 0, offsetY: 30,
        minDist: 5, maxDist: 250 // المسجد متوسط الحجم
      }
    ];

    let currentIndex = 0;
    let isStarted = false;
    let isAnimating = false;

    function startExperience() {
      let screen = document.getElementById('start-screen');
      screen.style.opacity = '0';
      
      setTimeout(() => { 
        screen.style.display = 'none'; 
        document.querySelector('.nav-arrows-container').style.visibility = 'visible';
        
        let vrBtn = document.querySelector('.a-enter-vr');
        if(vrBtn) vrBtn.style.display = 'block';

        isStarted = true;
      }, 800);
    }

    document.addEventListener("DOMContentLoaded", () => {
      let checkVR = setInterval(() => {
        let vrBtn = document.querySelector('.a-enter-vr');
        if(vrBtn) {
          vrBtn.style.display = 'none';
          clearInterval(checkVR);
        }
      }, 100);
    });

    function goToRight() {
      if(!isStarted || isAnimating) return;
      currentIndex = (currentIndex + 1) % siteData.length;
      showCurrentModel();
    }

    function goToLeft() {
      if(!isStarted || isAnimating) return;
      currentIndex = (currentIndex - 1 + siteData.length) % siteData.length;
      showCurrentModel();
    }

    function showCurrentModel() {
      isAnimating = true;
      let data = siteData[currentIndex];
      closePanel();
      
      let fade = document.getElementById('fade-overlay');
      fade.style.opacity = '1'; 

      setTimeout(() => {
        document.getElementById('scene-welcome').setAttribute('visible', 'false');
        document.querySelectorAll('.scene-model').forEach(model => model.setAttribute('visible', 'false'));

        let cameraEl = document.querySelector('[camera]');
        let orbit = cameraEl.components['orbit-controls'];

        if(currentIndex === 0) {
          document.getElementById('scene-welcome').setAttribute('visible', 'true');
          cameraEl.setAttribute('position', `0 ${data.camHeight} ${data.camRadius}`);
          orbit.target.set(0, 10, 0);
          
          // تحديث إعدادات الزوم لشاشة الترحيب
          cameraEl.setAttribute('orbit-controls', 'minDistance', data.minDist || 5);
          cameraEl.setAttribute('orbit-controls', 'maxDistance', data.maxDist || 400);
          
        } else {
          let currentModelEl = document.getElementById(data.id);
          if(currentModelEl) {
            currentModelEl.setAttribute('visible', 'true');
            
            let currentOffsetY = data.offsetY || 10;
            currentModelEl.setAttribute('position', `${data.offsetX} ${currentOffsetY} 0`);
            
            // إعادة تعيين الكاميرا للموقع الخاص بالموديل
            cameraEl.setAttribute('position', `0 ${data.camHeight} ${data.camRadius}`);
            orbit.target.set(data.offsetX, currentOffsetY, 0);
            
            // ==========================================
            // تحديث إعدادات الزوم تلقائياً حسب حجم الموديل
            // ==========================================
            cameraEl.setAttribute('orbit-controls', 'minDistance', data.minDist || 5);
            cameraEl.setAttribute('orbit-controls', 'maxDistance', data.maxDist || 400);
            
            orbit.update();
          }
        }

        fade.style.opacity = '0';

        setTimeout(() => {
          updateInfoPanel(data); 
          isAnimating = false;
        }, 500); 
      }, 500); 
    }

    function updateInfoPanel(data) {
      if(data.panelPosition === 'none') return;
      document.getElementById('panel-title').innerText = data.title;
      document.getElementById('panel-desc').innerText = data.desc;
      
      let galleryBox = document.getElementById('gallery-box');
      if (data.images) {
        let galleryHtml = '';
        data.images.split(',').forEach(img => {
          galleryHtml += `<div class="gallery-card" onclick="openImageViewer('${img.trim()}')"><img src="${img.trim()}" alt="صورة توضيحية"></div>`;
        });
        document.getElementById('gallery-container').innerHTML = galleryHtml;
        galleryBox.style.display = 'block'; 
      } else {
        galleryBox.style.display = 'none'; 
      }
      
      let panelContainer = document.getElementById('info-panel-container');
      if (data.panelPosition === 'right') {
        panelContainer.style.left = 'auto'; panelContainer.style.right = '4%';
        panelContainer.style.transform = 'translateY(-50%) perspective(1200px) rotateY(-6deg)';
      } else {
        panelContainer.style.right = 'auto'; panelContainer.style.left = '4%';
        panelContainer.style.transform = 'translateY(-50%) perspective(1200px) rotateY(6deg)';
      }
      panelContainer.style.display = 'block';
    }

    function closePanel() {
      document.getElementById('info-panel-container').style.display = 'none';
    }

    function openImageViewer(src) {
      document.getElementById('viewer-img').src = src;
      document.getElementById('image-viewer').style.display = 'flex';
    }
    
    function closeImageViewer(e) {
      if (e) e.stopPropagation();
      document.getElementById('image-viewer').style.display = 'none';
      document.getElementById('viewer-img').src = '';
    }
  </script>
</head>
<body>

  <div id="vr-container">
      
      <div id="start-screen">
        <button class="play-btn" onclick="startExperience()">▶</button>
        <h1 class="start-title">معالم مشعر منى مكة المكرمة</h1>
      </div>

      <div id="fade-overlay"></div>

      <div id="image-viewer" onclick="closeImageViewer()">
        <button class="close-viewer-btn" onclick="closeImageViewer(event)">✖</button>
        <img id="viewer-img" src="" alt="صورة مكبرة" onclick="event.stopPropagation()">
      </div>
        
      <div class="logos-wrapper">
        <img src="https://haj.gov.sa/_next/image?url=https%3A%2F%2Fhaj.gov.sa%2Fs-core%2F-%2Fmedia%2FProject%2FHAJJ%2FHajj-Logos%2FHeader-Logo.svg%3Fiar%3D0%26hash%3DEA30CCD6D55090BA41D3BA548A24E24A&w=256&q=75" alt="وزارة الحج والعمرة">
        <img src="https://image2url.com/r2/default/images/1773558610625-b250b6cd-d224-421f-b749-0894a9cf0602.png" alt="يوروكونسلت">
      </div>

      <div class="nav-arrows-container">
        <div class="nav-arrow" onclick="goToRight()" title="التالي">&#10094;</div> 
        <div class="nav-text">مرر لرؤية المعالم</div>
        <div class="nav-arrow" onclick="goToLeft()" title="السابق">&#10095;</div> 
      </div>

      <div id="info-panel-container">
        <div class="info-box">
          <button class="close-btn" onclick="closePanel()">✖</button>
          <h2 id="panel-title">--</h2>
          <p id="panel-desc">--</p>
        </div>
        <div class="gallery-box" id="gallery-box">
          <div id="gallery-container" class="gallery-container"></div>
        </div>
      </div>

      <a-scene embedded antialias="true" renderer="logarithmicDepthBuffer: true; colorManagement: true;" vr-mode-ui="enabled: true">
        
        <a-assets timeout="120000">
          <a-asset-item id="model-jamarat" src="https://drofkqnzcoxpqzacuemk.supabase.co/storage/v1/object/public/vr-models/jamaraat.glb" crossorigin="anonymous"></a-asset-item>
          <a-asset-item id="model-khimaa" src="https://drofkqnzcoxpqzacuemk.supabase.co/storage/v1/object/public/vr-models/KHIMAA.glb" crossorigin="anonymous"></a-asset-item>
          <a-asset-item id="model-mgazer" src="https://drofkqnzcoxpqzacuemk.supabase.co/storage/v1/object/public/vr-models/Mgazer.glb" crossorigin="anonymous"></a-asset-item>
          <a-asset-item id="model-albiaa" src="https://drofkqnzcoxpqzacuemk.supabase.co/storage/v1/object/public/vr-models/Masjed%20Albiaa.glb" crossorigin="anonymous"></a-asset-item>
          <a-asset-item id="model-alkhif" src="https://drofkqnzcoxpqzacuemk.supabase.co/storage/v1/object/public/vr-models/Alkhif%20Masjed.glb" crossorigin="anonymous"></a-asset-item>
        </a-assets>

        <a-entity gradient-sky></a-entity>
        
        <a-entity star-system></a-entity>

        <a-plane position="0 -5 0" rotation="-90 0 0" width="4000" height="4000" neon-grid></a-plane>

        <a-light type="ambient" color="#051535" intensity="2.5"></a-light>
        <a-light type="point" color="#00d2ff" intensity="1.5" position="0 20 0" distance="150" decay="2"></a-light>
        <a-light type="spot" color="#0088ff" intensity="3.5" position="0 80 0" rotation="-90 0 0" angle="75" penumbra="1" distance="300" decay="2"></a-light>
        <a-light type="directional" color="#ffffff" intensity="0.6" position="15 30 20"></a-light>

        <a-entity id="models-group">
          
          <a-entity id="scene-welcome" position="0 0 0" visible="true">
            <a-entity hollow-neon-text="text: حياكم في معالم مشعر منى; color: #00d2ff; size: 140; width: 140; height: 18" 
                      position="0 15 0" 
                      animation="property: position; dir: alternate; dur: 2000; loop: true; to: 0 16 0"></a-entity>
            
            <a-entity hollow-neon-text="text: >>>>>>>>>>>>>>; color: #00d2ff; size: 100; width: 150; height: 12" 
                      position="5 8 0" 
                      animation="property: position; to: -5 8 0; dur: 2500; easing: linear; loop: true;"></a-entity>
          </a-entity>

          <a-entity id="model_jamarat" class="scene-model" position="0 10 0" visible="false">
            <a-gltf-model src="#model-jamarat" scale="0.05 0.05 0.05"></a-gltf-model>
          </a-entity>

          <a-entity id="model_khimaa" class="scene-model" position="0 1 0" rotation="0 60 0" visible="false">
            <a-gltf-model src="#model-khimaa" scale="5 5 5"></a-gltf-model>
          </a-entity>

          <a-entity id="model_mgazer" class="scene-model" position="0 0 0" rotation="0 -40 0" visible="false">
            <a-gltf-model src="#model-mgazer" scale="100 100 100"></a-gltf-model>
          </a-entity>

          <a-entity id="model_albiaa" class="scene-model" position="0 30 0" rotation="0 -50 0" visible="false">
            <a-gltf-model src="#model-albiaa" scale="100 100 100"></a-gltf-model>
          </a-entity>

          <a-entity id="model_alkhif" class="scene-model" position="0 30 0" rotation="0 60 0" visible="false">
            <a-gltf-model src="#model-alkhif" scale="100 100 100"></a-gltf-model>
          </a-entity>

        </a-entity>

        <a-entity camera="near: 0.1; far: 10000" look-controls="enabled: false" 
                  orbit-controls="target: 0 10 0; minDistance: 5; maxDistance: 400; initialPosition: 0 15 40; 
                                  enablePan: true; enableZoom: true; enableDamping: true; dampingFactor: 0.05; rotateSpeed: 0.5;">
        </a-entity>
        
      </a-scene>
  </div>
</body>
</html>
