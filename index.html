<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <title>منصة المشاعر المقدسة الافتراضية - مكة المكرمة</title>
  
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&display=swap" rel="stylesheet">
  
  <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
  <script src="https://unpkg.com/aframe-orbit-controls@1.3.2/dist/aframe-orbit-controls.min.js"></script>

  <style>
    body, html {
      margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden;
      font-family: 'Cairo', sans-serif;
      background: radial-gradient(circle at top, #06193b 0%, #010308 80%);
    }

    #vr-container { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }

    /* شاشة البدء (Overlay) */
    #start-screen {
      position: absolute; inset: 0; z-index: 200;
      background: rgba(2, 5, 10, 0.95); backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px);
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      transition: opacity 0.8s ease;
    }
    .play-btn {
      width: 100px; height: 100px; border-radius: 50%;
      background: rgba(0, 150, 255, 0.1); border: 2px solid #00d2ff;
      color: #00d2ff; font-size: 36px; display: flex; align-items: center; justify-content: center;
      cursor: pointer; transition: 0.4s; box-shadow: 0 0 40px rgba(0, 150, 255, 0.4);
      margin-bottom: 25px; outline: none; padding-left: 8px;
    }
    .play-btn:hover {
      background: #00d2ff; color: #fff; transform: scale(1.1); box-shadow: 0 0 60px rgba(0, 210, 255, 0.8);
    }
    .start-title {
      color: #ffffff; font-size: 32px; font-weight: 800; text-shadow: 0 4px 15px rgba(0, 150, 255, 0.6);
      letter-spacing: 1px; margin: 0;
    }

    /* الشعارات */
    .logos-wrapper {
      position: absolute; top: 20px; left: 0; right: 0;
      display: flex; justify-content: space-between; padding: 0 40px;
      z-index: 100; pointer-events: none; 
    }
    .logos-wrapper img { 
      height: 35px; object-fit: contain; pointer-events: auto;
      filter: brightness(0) invert(1); opacity: 0.85;
    }

    /* أسهم التنقل السفلية */
    .nav-arrows-container {
      position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%);
      display: flex; align-items: center; gap: 30px; z-index: 100; direction: ltr;
      visibility: hidden; /* مخفية حتى يتم النقر على زر Play */
    }
    .nav-arrow {
      pointer-events: auto; width: 50px; height: 50px; border-radius: 50%;
      background: rgba(6, 12, 24, 0.4); border: 1px solid rgba(0, 150, 255, 0.3);
      color: #00d2ff; font-size: 22px; font-weight: bold;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; transition: 0.3s; backdrop-filter: blur(5px);
    }
    .nav-arrow:hover { 
      background: rgba(0, 150, 255, 0.2); box-shadow: 0 0 20px rgba(0, 150, 255, 0.5); 
      transform: scale(1.1); color: #fff; border-color: #00d2ff;
    }
    .nav-text {
      color: #00d2ff; font-size: 18px; font-weight: 600; letter-spacing: 1px;
      text-shadow: 0 0 10px rgba(0, 150, 255, 0.5); pointer-events: none;
    }

    /* حاوية البوب-أب (المنظور 3D) */
    #info-panel-container {
      position: absolute; top: 50%; width: 360px; z-index: 100; display: none;
      transform-style: preserve-3d;
    }

    /* صندوق النص */
    .info-box {
      background: rgba(8, 15, 28, 0.65); color: #fff;
      padding: 25px; border-radius: 20px; margin-bottom: 15px;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.6), 0 0 20px rgba(0, 150, 255, 0.15) inset;
      border: 1px solid rgba(255, 255, 255, 0.1); border-top: 1px solid rgba(255, 255, 255, 0.2);
      backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px);
      position: relative;
    }
    
    /* صندوق الصور */
    .gallery-box {
      background: rgba(8, 15, 28, 0.65); padding: 15px; border-radius: 20px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5), 0 0 15px rgba(0, 150, 255, 0.1) inset;
      border: 1px solid rgba(255, 255, 255, 0.1); border-bottom: 1px solid rgba(255, 255, 255, 0.2);
      backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px);
    }

    .close-btn {
      position: absolute; top: 12px; left: 15px; background: none; border: none; 
      color: rgba(255,255,255,0.5); font-size: 20px; cursor: pointer; transition: 0.3s;
    }
    .close-btn:hover { color: #fff; transform: scale(1.1); }
    
    #panel-title { 
      margin: 0 0 10px 0; color: #ffffff; font-size: 24px; font-weight: 800;
      text-shadow: 0 2px 10px rgba(0, 150, 255, 0.4);
    }
    #panel-desc { line-height: 1.7; font-size: 15px; margin: 0; color: #a0aec0; }
    
    .gallery-container { display: flex; gap: 10px; overflow-x: auto; padding-bottom: 5px; }
    .gallery-container::-webkit-scrollbar { height: 4px; }
    .gallery-container::-webkit-scrollbar-thumb { background: rgba(0,150,255,0.3); border-radius: 4px; }
    .gallery-card {
      height: 90px; min-width: 140px; border-radius: 8px; 
      border: 1px solid rgba(255,255,255,0.05); overflow: hidden;
      box-shadow: 0 4px 10px rgba(0,0,0,0.3); transition: 0.3s; cursor: pointer;
    }
    .gallery-card img { width: 100%; height: 100%; object-fit: cover; }
    .gallery-card:hover { transform: translateY(-3px); box-shadow: 0 6px 15px rgba(0, 150, 255, 0.3); }
  </style>

  <script>
    // رسم الشبكة الناعمة 
    AFRAME.registerComponent('neon-grid', {
      init: function () {
        let canvas = document.createElement('canvas');
        canvas.width = 512; canvas.height = 512;
        let ctx = canvas.getContext('2d');
        
        ctx.fillStyle = 'rgba(1, 3, 8, 1)'; 
        ctx.fillRect(0, 0, 512, 512);
        
        ctx.strokeStyle = 'rgba(0, 150, 255, 0.25)'; 
        ctx.lineWidth = 1.5; 
        ctx.shadowBlur = 5;
        ctx.shadowColor = "#00d2ff";
        ctx.strokeRect(0, 0, 512, 512);
        
        let texture = new THREE.CanvasTexture(canvas);
        texture.wrapS = THREE.RepeatWrapping;
        texture.wrapT = THREE.RepeatWrapping;
        texture.repeat.set(400, 400); 
        
        let material = new THREE.MeshStandardMaterial({ 
          map: texture, roughness: 0.5, metalness: 0.4 
        });
        this.el.getObject3D('mesh').material = material;
      }
    });

    /* 
      البيانات والمسافات الشاسعة جداً (X و Z بـ 100 متر و -100 متر) 
      لضمان عدم تداخل الموديلات بعد التكبير.
      الكاميرا (camPos) تقترب (Zoom-in) نحو كل موديل.
    */
    const siteData = [
      { // 0: الركن الشمالي الغربي (يسار أعلى)
        id: 'jamarat', title: 'منشأة الجمرات',
        desc: 'مجمع معماري حديث مصمم لتسهيل حركة الحجاج أثناء رمي الجمرات، يظهر هنا تفصيل المسارات المتعددة.',
        images: 'https://images.unsplash.com/photo-1565552643952-b91c28bdf713?w=300',
        camTarget: {x: -100, y: 0, z: -100},
        camPos: {x: -100, y: 20, z: -60}, // Zoom-in قريب
        panelPosition: 'right' 
      },
      { // 1: الركن الشمالي الشرقي (يمين أعلى)
        id: 'khimaa', title: 'مخيمات منى',
        desc: 'مدينة الخيام المطورة، توفر إقامة آمنة ومريحة للحجاج ضمن تخطيط هندسي دقيق لمنطقة المشاعر.',
        images: 'https://images.unsplash.com/photo-1591604129939-f1efa4d9f7fa?w=300',
        camTarget: {x: 100, y: 0, z: -100},
        camPos: {x: 100, y: 20, z: -60}, // Zoom-in قريب
        panelPosition: 'left' 
      },
      { // 2: المنتصف
        id: 'center', title: 'المركز الرئيسي',
        desc: 'منطقة تفاعلية مستقبلية تتوسط معالم المشاعر المقدسة لتوزيع الحركة.',
        images: 'https://images.unsplash.com/photo-1565552643952-b91c28bdf713?w=300',
        camTarget: {x: 0, y: 0, z: 0},
        camPos: {x: 0, y: 20, z: 40},
        panelPosition: 'right'
      },
      { // 3: الركن الجنوبي الغربي (يسار أسفل)
        id: 'spot3', title: 'مسجد الخيف',
        desc: 'محطة مستقبلية: سيتم عرض الموديل هنا لاحقاً.',
        images: '',
        camTarget: {x: -100, y: 0, z: 100},
        camPos: {x: -100, y: 20, z: 140},
        panelPosition: 'right'
      },
      { // 4: الركن الجنوبي الشرقي (يمين أسفل)
        id: 'spot4', title: 'مسجد البيعة',
        desc: 'محطة مستقبلية: سيتم عرض الموديل هنا لاحقاً.',
        images: '',
        camTarget: {x: 100, y: 0, z: 100},
        camPos: {x: 100, y: 20, z: 140},
        panelPosition: 'left'
      }
    ];

    let currentIndex = 0;
    let isAnimating = false;
    let isStarted = false; // لمنع النقر قبل بدء العرض

    // بدء العرض من الشاشة الافتتاحية
    function startExperience() {
      let screen = document.getElementById('start-screen');
      screen.style.opacity = '0';
      setTimeout(() => { 
        screen.style.display = 'none'; 
        // إظهار الأسهم السفلية بعد البدء
        document.querySelector('.nav-arrows-container').style.visibility = 'visible';
        isStarted = true;
      }, 800);
    }

    function goToPrev() {
      if(isAnimating || !isStarted) return;
      currentIndex = (currentIndex - 1 + siteData.length) % siteData.length;
      animateCameraToCurrentModel();
    }

    function goToNext() {
      if(isAnimating || !isStarted) return;
      currentIndex = (currentIndex + 1) % siteData.length;
      animateCameraToCurrentModel();
    }

    // حركة الكاميرا: ترتفع للمشاهدة الشاملة (Zoom Out) ثم تقترب للموديل (Zoom In)
    function animateCameraToCurrentModel() {
      isAnimating = true;
      let data = siteData[currentIndex];
      let cameraEl = document.querySelector('[camera]');
      
      closePanel(); 

      let currentPos = cameraEl.getAttribute('position');
      
      // الكاميرا ترتفع وترجع للخلف (Zoom Out - رؤية واسعة)
      let midX = (currentPos.x + data.camPos.x) / 2;
      let midY = Math.max(currentPos.y, data.camPos.y) + 60; // ترتفع 60 متر
      let midZ = Math.max(currentPos.z, data.camPos.z) + 40; 

      cameraEl.setAttribute('animation__zoomout', `property: position; to: ${midX} ${midY} ${midZ}; dur: 1200; easing: easeOutQuad`);
      cameraEl.setAttribute('animation__target', `property: orbit-controls.target; to: ${data.camTarget.x} ${data.camTarget.y} ${data.camTarget.z}; dur: 2400; easing: easeInOutSine`);

      // تنزل الكاميرا وتقترب (Zoom In)
      setTimeout(() => {
        cameraEl.removeAttribute('animation__zoomout');
        cameraEl.setAttribute('animation__zoomin', `property: position; to: ${data.camPos.x} ${data.camPos.y} ${data.camPos.z}; dur: 1200; easing: easeInQuad`);
      }, 1200);

      // تفتح اللوحة بعد الوصول
      setTimeout(() => {
        cameraEl.removeAttribute('animation__zoomin');
        cameraEl.removeAttribute('animation__target');
        
        document.getElementById('panel-title').innerText = data.title;
        document.getElementById('panel-desc').innerText = data.desc;
        
        let galleryBox = document.getElementById('gallery-box');
        if (data.images) {
          let galleryHtml = '';
          data.images.split(',').forEach(img => {
            galleryHtml += `<div class="gallery-card"><img src="${img.trim()}" alt="صورة توضيحية"></div>`;
          });
          document.getElementById('gallery-container').innerHTML = galleryHtml;
          galleryBox.style.display = 'block'; 
        } else {
          galleryBox.style.display = 'none'; 
        }
        
        let panelContainer = document.getElementById('info-panel-container');
        if (data.panelPosition === 'right') {
          panelContainer.style.left = 'auto'; panelContainer.style.right = '5%';
          panelContainer.style.transform = 'translateY(-50%) perspective(1000px) rotateY(-12deg)';
        } else {
          panelContainer.style.right = 'auto'; panelContainer.style.left = '5%';
          panelContainer.style.transform = 'translateY(-50%) perspective(1000px) rotateY(12deg)';
        }
        
        panelContainer.style.display = 'block';
        isAnimating = false;
      }, 2450);
    }

    function closePanel() {
      document.getElementById('info-panel-container').style.display = 'none';
    }

    // النقر على النقطة العلوية للذهاب للموديل
    AFRAME.registerComponent('hotspot-action', {
      schema: { index: {type: 'number'} },
      init: function () {
        this.el.addEventListener('click', () => {
          if(!isStarted) return; // منع التفاعل قبل البدء
          
          if (currentIndex !== this.data.index) {
            currentIndex = this.data.index;
            animateCameraToCurrentModel();
          } else {
            let panelContainer = document.getElementById('info-panel-container');
            if (siteData[currentIndex].panelPosition === 'right') {
              panelContainer.style.left = 'auto'; panelContainer.style.right = '5%';
              panelContainer.style.transform = 'translateY(-50%) perspective(1000px) rotateY(-12deg)';
            } else {
              panelContainer.style.right = 'auto'; panelContainer.style.left = '5%';
              panelContainer.style.transform = 'translateY(-50%) perspective(1000px) rotateY(12deg)';
            }
            panelContainer.style.display = 'block';
          }
        });
      }
    });
  </script>
</head>
<body>

  <!-- شاشة البدء (Overlay) -->
  <div id="start-screen">
    <button class="play-btn" onclick="startExperience()">▶</button>
    <h1 class="start-title">معالم مشعر منى مكة المكرمة</h1>
  </div>

  <div id="vr-container">
    
    <div class="logos-wrapper">
      <img src="https://haj.gov.sa/_next/image?url=https%3A%2F%2Fhaj.gov.sa%2Fs-core%2F-%2Fmedia%2FProject%2FHAJJ%2FHajj-Logos%2FHeader-Logo.svg%3Fiar%3D0%26hash%3DEA30CCD6D55090BA41D3BA548A24E24A&w=256&q=75" alt="وزارة الحج والعمرة">
      <img src="https://image2url.com/r2/default/images/1773558610625-b250b6cd-d224-421f-b749-0894a9cf0602.png" alt="يوروكونسلت">
    </div>

    <!-- أسهم التنقل السفلية -->
    <div class="nav-arrows-container">
      <div class="nav-arrow" onclick="goToPrev()">&#10094;</div>
      <div class="nav-text">مرر لترى المعالم</div>
      <div class="nav-arrow" onclick="goToNext()">&#10095;</div> 
    </div>

    <!-- البوب-أب الجانبي المائل 3D -->
    <div id="info-panel-container">
      <div class="info-box">
        <button class="close-btn" onclick="closePanel()">✖</button>
        <h2 id="panel-title">--</h2>
        <p id="panel-desc">--</p>
      </div>
      <div class="gallery-box" id="gallery-box">
        <div id="gallery-container" class="gallery-container"></div>
      </div>
    </div>

    <a-scene embedded antialias="true" renderer="logarithmicDepthBuffer: true; colorManagement: true;" vr-mode-ui="enabled: true">
      
      <a-assets timeout="30000">
        <a-asset-item id="model-jamarat" src="jamaraat.glb"></a-asset-item>
        <a-asset-item id="model-khimaa" src="KHIMAA.glb"></a-asset-item>
      </a-assets>

      <a-sky opacity="0"></a-sky>
      
      <!-- الشبكة مساحتها شاسعة لتغطي المسافات الجديدة -->
      <a-plane position="0 0 0" rotation="-90 0 0" width="3000" height="3000" neon-grid></a-plane>

      <!-- الإضاءة العلوية الزرقاء الناعمة والهالة -->
      <a-light type="ambient" color="#030b1a" intensity="1.8"></a-light>
      <a-light type="spot" color="#0088ff" intensity="3" position="0 80 0" rotation="-90 0 0" angle="50" penumbra="1" distance="200" decay="2"></a-light>
      <a-light type="directional" color="#ffffff" intensity="0.6" position="10 30 20"></a-light>

      <!-- 
        الموديلات: 
        تمت زيادة حجم הגمرات لـ 0.05 
        وإبعاد الموديلات لـ مسافة 100 و -100 
      -->
      <a-entity id="models-group">
        
        <!-- 1. الركن الشمالي الغربي: الجمرات (تم تكبيرها وإبعادها) -->
        <a-entity position="-100 0.5 -100">
          <a-gltf-model src="#model-jamarat" scale="0.05 0.05 0.05"></a-gltf-model>
          
          <a-entity line="start: 0 0 0; end: 0 10 0; color: #ffffff; opacity: 0.5"></a-entity>
          <!-- زر النقر المخفي -->
          <a-sphere class="clickable" position="0 10 0" radius="1.5" opacity="0" hotspot-action="index: 0"></a-sphere>
          <!-- النقطة المضيئة -->
          <a-sphere position="0 10 0" radius="0.25" color="#ffffff" material="shader: flat" 
                    animation="property: position; dir: alternate; dur: 2000; loop: true; to: 0 10.5 0" pointer-events="none"></a-sphere>
          <a-sphere position="0 10 0" radius="0.6" color="#ffffff" material="shader: flat; transparent: true; opacity: 0.2"
                    animation="property: position; dir: alternate; dur: 2000; loop: true; to: 0 10.5 0" pointer-events="none"></a-sphere>
        </a-entity>

        <!-- 2. الركن الشمالي الشرقي: الخيام -->
        <a-entity position="100 0.5 -100">
          <a-gltf-model src="#model-khimaa" scale="5 5 5"></a-gltf-model>
          
          <a-entity line="start: 0 0 0; end: 0 10 0; color: #ffffff; opacity: 0.5"></a-entity>
          <a-sphere class="clickable" position="0 10 0" radius="1.5" opacity="0" hotspot-action="index: 1"></a-sphere>
          <a-sphere position="0 10 0" radius="0.25" color="#ffffff" material="shader: flat" 
                    animation="property: position; dir: alternate; dur: 2000; loop: true; to: 0 10.5 0" pointer-events="none"></a-sphere>
          <a-sphere position="0 10 0" radius="0.6" color="#ffffff" material="shader: flat; transparent: true; opacity: 0.2"
                    animation="property: position; dir: alternate; dur: 2000; loop: true; to: 0 10.5 0" pointer-events="none"></a-sphere>
        </a-entity>

        <!-- 3. المنتصف (محطة فارغة للنماذج القادمة) -->
        <a-entity position="0 0.5 0">
          <a-entity line="start: 0 0 0; end: 0 10 0; color: #ffffff; opacity: 0.5"></a-entity>
          <a-sphere class="clickable" position="0 10 0" radius="1.5" opacity="0" hotspot-action="index: 2"></a-sphere>
          <a-sphere position="0 10 0" radius="0.25" color="#ffffff" material="shader: flat" 
                    animation="property: position; dir: alternate; dur: 2000; loop: true; to: 0 10.5 0" pointer-events="none"></a-sphere>
        </a-entity>

        <!-- 4. الركن الجنوبي الغربي (محطة فارغة) -->
        <a-entity position="-100 0.5 100">
          <a-entity line="start: 0 0 0; end: 0 10 0; color: #ffffff; opacity: 0.5"></a-entity>
          <a-sphere class="clickable" position="0 10 0" radius="1.5" opacity="0" hotspot-action="index: 3"></a-sphere>
          <a-sphere position="0 10 0" radius="0.25" color="#ffffff" material="shader: flat" 
                    animation="property: position; dir: alternate; dur: 2000; loop: true; to: 0 10.5 0" pointer-events="none"></a-sphere>
        </a-entity>

        <!-- 5. الركن الجنوبي الشرقي (محطة فارغة) -->
        <a-entity position="100 0.5 100">
          <a-entity line="start: 0 0 0; end: 0 10 0; color: #ffffff; opacity: 0.5"></a-entity>
          <a-sphere class="clickable" position="0 10 0" radius="1.5" opacity="0" hotspot-action="index: 4"></a-sphere>
          <a-sphere position="0 10 0" radius="0.25" color="#ffffff" material="shader: flat" 
                    animation="property: position; dir: alternate; dur: 2000; loop: true; to: 0 10.5 0" pointer-events="none"></a-sphere>
        </a-entity>

      </a-entity>

      <!-- 
        الكاميرا الافتتاحية: مرفوعة وبعيدة جداً (Z=200, Y=100) 
        لرؤية بانورامية تشمل جميع الموديلات كـ Fit to screen عند بدء الصفحة
      -->
      <a-entity camera look-controls="enabled: false" 
                orbit-controls="target: 0 0 0; minDistance: 5; maxDistance: 300; initialPosition: 0 100 200; 
                                enablePan: true; enableZoom: true; enableDamping: true; dampingFactor: 0.05; rotateSpeed: 0.6;">
      </a-entity>
      
    </a-scene>
  </div>
</body>
</html>
