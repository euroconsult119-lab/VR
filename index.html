<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <title>منصة المشاعر المقدسة الافتراضية</title>
  
  <!-- استدعاء خط Cairo -->
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&display=swap" rel="stylesheet">
  
  <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
  <script src="https://unpkg.com/aframe-orbit-controls@1.3.2/dist/aframe-orbit-controls.min.js"></script>

  <style>
    body, html {
      margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden;
      font-family: 'Cairo', sans-serif; /* تفعيل خط كايرو */
      background: radial-gradient(circle at top, #06193b 0%, #010308 80%);
    }

    #vr-container { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }

    /* شاشة البدء السينمائية */
    #start-screen {
      position: absolute; inset: 0; z-index: 9999;
      background: radial-gradient(circle at center, #0a1f3d 0%, #010308 100%);
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      transition: opacity 1s ease;
    }
    #play-btn {
      width: 100px; height: 100px; border-radius: 50%;
      background: rgba(0, 150, 255, 0.1); border: 2px solid #00d2ff;
      color: #00d2ff; font-size: 40px; cursor: pointer; transition: 0.3s;
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 0 30px rgba(0, 150, 255, 0.3);
      padding-left: 8px; /* لضبط شكل مثلث البلاي */
    }
    #play-btn:hover { background: #00d2ff; color: #fff; transform: scale(1.1); box-shadow: 0 0 50px rgba(0, 150, 255, 0.6); }
    #start-screen h1 { 
      color: #fff; margin-top: 30px; font-weight: 800; font-size: 32px;
      text-shadow: 0 0 20px rgba(0, 150, 255, 0.6); letter-spacing: 1px;
    }

    /* طبقة واجهة المستخدم (تظهر بعد البدء) */
    #ui-layer { display: none; }

    /* الشعارات */
    .logos-wrapper {
      position: absolute; top: 20px; left: 0; right: 0;
      display: flex; justify-content: space-between; padding: 0 40px;
      z-index: 100; pointer-events: none; 
    }
    .logos-wrapper img { 
      height: 40px; object-fit: contain; pointer-events: auto;
      filter: brightness(0) invert(1); opacity: 0.9;
    }

    /* أسهم التنقل السفلية */
    .nav-arrows-container {
      position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%);
      display: flex; align-items: center; gap: 30px; z-index: 100; pointer-events: none;
      direction: ltr; /* للحفاظ على ترتيب الأسهم */
    }
    .nav-arrow {
      pointer-events: auto;
      width: 55px; height: 55px; border-radius: 50%;
      background: rgba(6, 12, 24, 0.6); border: 1px solid rgba(0, 150, 255, 0.4);
      color: #00d2ff; font-size: 24px; display: flex; align-items: center; justify-content: center;
      cursor: pointer; transition: 0.3s; backdrop-filter: blur(8px);
    }
    .nav-arrow:hover { 
      background: rgba(0, 150, 255, 0.3); transform: scale(1.1); color: #fff; border-color: #00d2ff;
      box-shadow: 0 0 20px rgba(0, 150, 255, 0.5); 
    }
    .nav-text {
      color: #00d2ff; font-weight: 600; font-size: 18px; pointer-events: auto;
      text-shadow: 0 0 10px rgba(0, 150, 255, 0.5);
    }

    /* حاوية النوافذ الثلاثية الأبعاد (منفصلة للنص والصور) */
    #panels-container {
      position: absolute; top: 50%; transform: translateY(-50%);
      display: flex; flex-direction: column; gap: 15px; width: 380px; 
      z-index: 100; display: none; perspective: 1000px; /* لتفعيل التأثير الثلاثي الأبعاد */
      transition: left 0.5s ease, right 0.5s ease;
    }
    
    .glass-panel {
      background: rgba(8, 15, 28, 0.7); color: #fff;
      padding: 25px; border-radius: 20px; position: relative;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.8), inset 0 0 15px rgba(0, 150, 255, 0.15);
      border: 1px solid rgba(255, 255, 255, 0.1); border-top: 1px solid rgba(255, 255, 255, 0.2);
      backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
      transform: translateZ(30px); /* بروز اللوحة عن الشاشة لتعطي إحساس الـ 3D */
    }

    .close-btn {
      position: absolute; top: 15px; left: 20px; background: none; border: none; 
      color: rgba(255,255,255,0.5); font-size: 20px; cursor: pointer; transition: 0.3s;
    }
    .close-btn:hover { color: #fff; transform: scale(1.1); }
    #panel-title { 
      margin: 0 0 12px 0; color: #ffffff; font-size: 24px; font-weight: 800;
      text-shadow: 0 2px 10px rgba(0, 150, 255, 0.5); border-bottom: 1px solid rgba(255, 255, 255, 0.1); padding-bottom: 12px;
    }
    #panel-desc { line-height: 1.7; font-size: 15px; margin: 0; color: #cbd5e1; font-weight: 600;}
    
    /* نافذة الصور المستقلة */
    #images-panel { padding: 15px; }
    .gallery-container { display: flex; gap: 12px; overflow-x: auto; padding-bottom: 8px; }
    .gallery-container::-webkit-scrollbar { height: 4px; }
    .gallery-container::-webkit-scrollbar-thumb { background: rgba(0,150,255,0.4); border-radius: 4px; }
    .gallery-card {
      height: 100px; min-width: 150px; border-radius: 10px; 
      border: 1px solid rgba(255,255,255,0.1); overflow: hidden;
      box-shadow: 0 5px 15px rgba(0,0,0,0.4); transition: 0.3s; cursor: pointer;
    }
    .gallery-card img { width: 100%; height: 100%; object-fit: cover; }
    .gallery-card:hover { transform: translateY(-4px); box-shadow: 0 8px 20px rgba(0, 150, 255, 0.3); }
  </style>

  <script>
    // الشبكة الناعمة 
    AFRAME.registerComponent('neon-grid', {
      init: function () {
        let canvas = document.createElement('canvas');
        canvas.width = 512; canvas.height = 512;
        let ctx = canvas.getContext('2d');
        ctx.fillStyle = 'rgba(1, 3, 8, 1)'; 
        ctx.fillRect(0, 0, 512, 512);
        ctx.strokeStyle = 'rgba(0, 150, 255, 0.2)'; 
        ctx.lineWidth = 1.5; 
        ctx.shadowBlur = 8; ctx.shadowColor = "#00d2ff";
        ctx.strokeRect(0, 0, 512, 512);
        
        let texture = new THREE.CanvasTexture(canvas);
        texture.wrapS = THREE.RepeatWrapping; texture.wrapT = THREE.RepeatWrapping;
        texture.repeat.set(400, 400); 
        let material = new THREE.MeshStandardMaterial({ map: texture, roughness: 0.6, metalness: 0.3 });
        this.el.getObject3D('mesh').material = material;
      }
    });

    // بيانات الموديلات وتحديد الأركان
    const siteData = [
      {
        id: 'jamarat',
        title: 'منشأة الجمرات',
        desc: 'مجمع معماري حديث مصمم لتسهيل حركة الحجاج أثناء رمي الجمرات. هذا التصميم يبرز انسيابية التفويج عبر الطوابق المتعددة.',
        images: 'https://images.unsplash.com/photo-1565552643952-b91c28bdf713?w=300,https://images.unsplash.com/photo-1591604129939-f1efa4d9f7fa?w=300',
        camTarget: {x: 35, y: 0, z: -25},  // الركن الأيمن
        camPos: {x: 35, y: 15, z: 5},
        panelPosition: 'left' // بما أن الموديل يمين، تظهر النافذة يسار
      },
      {
        id: 'khimaa',
        title: 'مخيمات منى',
        desc: 'مدينة الخيام البيضاء المطورة، تم تخطيطها هندسياً لضمان أعلى معايير السلامة وتوفير الراحة لضيوف الرحمن في المشاعر.',
        images: 'https://images.unsplash.com/photo-1591604129939-f1efa4d9f7fa?w=300',
        camTarget: {x: -35, y: 0, z: -25}, // الركن الأيسر
        camPos: {x: -35, y: 15, z: 5},
        panelPosition: 'right' // بما أن الموديل يسار، تظهر النافذة يمين
      }
    ];

    let currentIndex = 0;
    let isAnimating = false;

    // دالة بدء العرض (شاشة البلاي)
    function startExperience() {
      let startScreen = document.getElementById('start-screen');
      startScreen.style.opacity = '0';
      setTimeout(() => {
        startScreen.style.display = 'none';
        document.getElementById('ui-layer').style.display = 'block';
      }, 1000);

      // طيران الكاميرا لعمل (Fit to Screen) ورؤية كل الأركان
      let cameraEl = document.querySelector('[camera]');
      cameraEl.setAttribute('animation__start', `property: position; to: 0 45 60; dur: 2500; easing: easeOutQuart`);
      cameraEl.setAttribute('animation__start_target', `property: orbit-controls.target; to: 0 0 -25; dur: 2500; easing: easeOutQuart`);
    }

    function goToPrev() { // السهم الأيسر للخيام (الشمال)
      if(isAnimating) return;
      currentIndex = 1;
      animateCameraToCurrentModel();
    }

    function goToNext() { // السهم الأيمن للجمرات (اليمين)
      if(isAnimating) return;
      currentIndex = 0;
      animateCameraToCurrentModel();
    }

    function animateCameraToCurrentModel() {
      isAnimating = true;
      let data = siteData[currentIndex];
      let cameraEl = document.querySelector('[camera]');
      
      closePanel(); 

      let currentPos = cameraEl.getAttribute('position');
      
      // حركة الزوم أوت والزوم إن
      let midX = (currentPos.x + data.camPos.x) / 2;
      let midY = Math.max(currentPos.y, data.camPos.y) + 30; 
      let midZ = Math.max(currentPos.z, data.camPos.z) + 30; 

      cameraEl.setAttribute('animation__zoomout', `property: position; to: ${midX} ${midY} ${midZ}; dur: 1000; easing: easeOutQuad`);
      cameraEl.setAttribute('animation__target', `property: orbit-controls.target; to: ${data.camTarget.x} ${data.camTarget.y} ${data.camTarget.z}; dur: 2000; easing: easeInOutSine`);

      setTimeout(() => {
        cameraEl.removeAttribute('animation__zoomout');
        cameraEl.setAttribute('animation__zoomin', `property: position; to: ${data.camPos.x} ${data.camPos.y} ${data.camPos.z}; dur: 1000; easing: easeInQuad`);
      }, 1000);

      setTimeout(() => {
        cameraEl.removeAttribute('animation__zoomin');
        cameraEl.removeAttribute('animation__target');
        
        document.getElementById('panel-title').innerText = data.title;
        document.getElementById('panel-desc').innerText = data.desc;
        let galleryHtml = '';
        if (data.images) {
          data.images.split(',').forEach(img => {
            galleryHtml += `<div class="gallery-card"><img src="${img.trim()}" alt="صور"></div>`;
          });
        }
        document.getElementById('gallery-container').innerHTML = galleryHtml;
        
        let panelsContainer = document.getElementById('panels-container');
        if (data.panelPosition === 'right') {
          panelsContainer.style.left = 'auto'; panelsContainer.style.right = '5%';
        } else {
          panelsContainer.style.right = 'auto'; panelsContainer.style.left = '5%';
        }
        
        panelsContainer.style.display = 'flex';
        isAnimating = false;
      }, 2000);
    }

    function closePanel() {
      document.getElementById('panels-container').style.display = 'none';
    }

    // ربط النقطة البيضاء بفتح البوب-أب
    AFRAME.registerComponent('hotspot-action', {
      schema: { index: {type: 'number'} },
      init: function () {
        this.el.addEventListener('click', () => {
          if (currentIndex !== this.data.index) {
            currentIndex = this.data.index;
            animateCameraToCurrentModel();
          } else {
            let panelsContainer = document.getElementById('panels-container');
            if (siteData[currentIndex].panelPosition === 'right') {
              panelsContainer.style.left = 'auto'; panelsContainer.style.right = '5%';
            } else {
              panelsContainer.style.right = 'auto'; panelsContainer.style.left = '5%';
            }
            panelsContainer.style.display = 'flex';
          }
        });
      }
    });
  </script>
</head>
<body>

  <!-- شاشة البدء الكبيرة -->
  <div id="start-screen">
    <button id="play-btn" onclick="startExperience()">▶</button>
    <h1>معالم مشعر منى - مكة المكرمة</h1>
  </div>

  <div id="vr-container">
    
    <!-- واجهة المستخدم المخفية حتى بدء العرض -->
    <div id="ui-layer">
      <div class="logos-wrapper">
        <img src="https://haj.gov.sa/_next/image?url=https%3A%2F%2Fhaj.gov.sa%2Fs-core%2F-%2Fmedia%2FProject%2FHAJJ%2FHajj-Logos%2FHeader-Logo.svg%3Fiar%3D0%26hash%3DEA30CCD6D55090BA41D3BA548A24E24A&w=256&q=75" alt="وزارة الحج">
        <img src="https://image2url.com/r2/default/images/1773558610625-b250b6cd-d224-421f-b749-0894a9cf0602.png" alt="يوروكونسلت">
      </div>

      <!-- أسهم التنقل وبينها النص -->
      <div class="nav-arrows-container">
        <div class="nav-arrow" onclick="goToPrev()">&#10094;</div> 
        <div class="nav-text">مرر لترى المعالم</div>
        <div class="nav-arrow" onclick="goToNext()">&#10095;</div> 
      </div>

      <!-- حاوية البوب-أب المنفصلة (نصوص ثم صور) -->
      <div id="panels-container">
        <!-- نافذة النصوص -->
        <div id="info-panel" class="glass-panel">
          <button class="close-btn" onclick="closePanel()">✖</button>
          <h2 id="panel-title">--</h2>
          <p id="panel-desc">--</p>
        </div>
        <!-- نافذة الصور المستقلة -->
        <div id="images-panel" class="glass-panel">
          <div id="gallery-container" class="gallery-container"></div>
        </div>
      </div>
    </div>

    <!-- 
      تفعيل الواقع الافتراضي: vr-mode-ui="enabled: true"
    -->
    <a-scene embedded antialias="true" renderer="colorManagement: true;" vr-mode-ui="enabled: true">
      
      <a-assets timeout="30000">
        <a-asset-item id="model-jamarat" src="jamaraat.glb"></a-asset-item>
        <a-asset-item id="model-khimaa" src="KHIMAA.glb"></a-asset-item>
      </a-assets>

      <a-sky opacity="0"></a-sky>
      
      <a-plane position="0 0 0" rotation="-90 0 0" width="3000" height="3000" neon-grid></a-plane>

      <a-light type="ambient" color="#030b1a" intensity="1.5"></a-light>
      <a-light type="spot" color="#0088ff" intensity="3" position="0 80 0" rotation="-90 0 0" angle="60" penumbra="1" distance="200" decay="2"></a-light>

      <!-- حاوية الموديلات والأركان الخمسة -->
      <a-entity id="models-group">
        
        <!-- === الركن الأيمن: الجمرات === -->
        <!-- تم رفع الموديل عن الأرض (y=0.5) لمنع تآكل القاعدة -->
        <a-entity position="35 0.5 -25">
          <!-- تكبير الجمرات أكثر -->
          <a-gltf-model src="#model-jamarat" scale="0.015 0.015 0.015"></a-gltf-model>
          
          <!-- النقطة البيضاء التفاعلية مرفوعة فوق الموديل -->
          <a-entity line="start: 0 0 0; end: 0 8 0; color: #ffffff; opacity: 0.4"></a-entity>
          <a-sphere class="clickable" position="0 8 0" radius="1.2" opacity="0" hotspot-action="index: 0"></a-sphere>
          <a-sphere position="0 8 0" radius="0.25" color="#ffffff" material="shader: flat" 
                    animation="property: position; dir: alternate; dur: 2000; loop: true; to: 0 8.3 0"></a-sphere>
          <a-sphere position="0 8 0" radius="0.6" color="#ffffff" material="shader: flat; transparent: true; opacity: 0.2"
                    animation="property: position; dir: alternate; dur: 2000; loop: true; to: 0 8.3 0"></a-sphere>
        </a-entity>

        <!-- === الركن الأيسر: الخيام === -->
        <!-- تم رفع الموديل عن الأرض (y=1) لمنع التآكل -->
        <a-entity position="-35 1 -25">
          <!-- تكبير الخيام لدرجة ضخمة جداً -->
          <a-gltf-model src="#model-khimaa" scale="15 15 15"></a-gltf-model>
          
          <a-entity line="start: 0 0 0; end: 0 8 0; color: #ffffff; opacity: 0.4"></a-entity>
          <a-sphere class="clickable" position="0 8 0" radius="1.2" opacity="0" hotspot-action="index: 1"></a-sphere>
          <a-sphere position="0 8 0" radius="0.25" color="#ffffff" material="shader: flat" 
                    animation="property: position; dir: alternate; dur: 2000; loop: true; to: 0 8.3 0"></a-sphere>
          <a-sphere position="0 8 0" radius="0.6" color="#ffffff" material="shader: flat; transparent: true; opacity: 0.2"
                    animation="property: position; dir: alternate; dur: 2000; loop: true; to: 0 8.3 0"></a-sphere>
        </a-entity>

        <!-- بقية الأركان الثلاثة فارغة ومجهزة لإضافة الموديلات مستقبلاً -->

      </a-entity>

      <!-- الكاميرا المدارية تبدأ من المنتصف قبل الضغط على زر Play -->
      <a-entity camera look-controls="enabled: false" 
                orbit-controls="target: 0 0 -25; minDistance: 5; maxDistance: 200; initialPosition: 0 10 0; 
                                enablePan: true; enableZoom: true; enableDamping: true; dampingFactor: 0.08; rotateSpeed: 0.6;">
      </a-entity>
      
    </a-scene>
  </div>
</body>
</html>
