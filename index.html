<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <title>العالم الافتراضي - المشاعر المقدسة</title>
  
  <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
  <script src="https://unpkg.com/aframe-orbit-controls@1.3.2/dist/aframe-orbit-controls.min.js"></script>

  <style>
    * { box-sizing: border-box; }
    body, html {
      margin: 0; padding: 0; width: 100%; height: 100%;
      overflow: hidden; background: #050508; 
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    
    #vr-container {
      position: absolute; top: 0; left: 0; width: 100vw; height: 100vh;
    }

    .logos-wrapper {
      position: absolute; top: 25px; left: 0; right: 0;
      display: flex; justify-content: space-between; padding: 0 40px;
      z-index: 100; pointer-events: none; 
    }
    .logos-wrapper img { 
      height: 40px; 
      object-fit: contain; pointer-events: auto;
      filter: brightness(0) invert(1); 
      opacity: 0.85;
    }

    #info-panel {
      position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
      width: 90%; max-width: 500px;
      background: rgba(8, 12, 20, 0.9); 
      color: #fff; padding: 30px; border-radius: 16px; z-index: 100;
      display: none; 
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.8), inset 0 0 15px rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(12px);
    }
    .close-btn {
      position: absolute; top: 15px; left: 20px;
      background: none; border: none; color: #fff; font-size: 26px;
      cursor: pointer; transition: 0.3s; opacity: 0.6;
    }
    .close-btn:hover { opacity: 1; transform: scale(1.1); }
    #panel-title { 
      margin: 0 0 15px 0; color: #ffffff; font-size: 22px; font-weight: 600;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1); padding-bottom: 15px;
    }
    #panel-desc { line-height: 1.8; font-size: 14px; margin-bottom: 20px; color: #b0b5be; }
    
    .gallery-container {
      display: flex; gap: 12px; overflow-x: auto; padding-bottom: 5px;
    }
    .gallery-container img {
      height: 100px; min-width: 140px; border-radius: 8px; 
      border: 1px solid rgba(255, 255, 255, 0.1);
      object-fit: cover;
    }
  </style>

  <script>
    // تم تصغير المربعات عبر زيادة التكرار (repeat) ليصبح 5000 بدلاً من 1000
    AFRAME.registerComponent('smooth-grid', {
      init: function () {
        let canvas = document.createElement('canvas');
        canvas.width = 128; canvas.height = 128;
        let ctx = canvas.getContext('2d');
        ctx.fillStyle = '#050508'; 
        ctx.fillRect(0, 0, 128, 128);
        ctx.strokeStyle = '#0e1f33'; 
        ctx.lineWidth = 2;
        ctx.strokeRect(0, 0, 128, 128);
        
        let texture = new THREE.CanvasTexture(canvas);
        texture.wrapS = THREE.RepeatWrapping;
        texture.wrapT = THREE.RepeatWrapping;
        texture.repeat.set(5000, 5000); 
        
        this.el.getObject3D('mesh').material.map = texture;
        this.el.getObject3D('mesh').material.needsUpdate = true;
      }
    });

    AFRAME.registerComponent('hotspot-action', {
      schema: {
        title: {type: 'string'},
        desc: {type: 'string'},
        images: {type: 'string', default: ''} 
      },
      init: function () {
        this.el.addEventListener('click', () => {
          let data = this.data;
          document.getElementById('panel-title').innerText = data.title;
          document.getElementById('panel-desc').innerText = data.desc;
          
          let galleryHtml = '';
          if (data.images.trim() !== '') {
            data.images.split(',').forEach(img => {
              if(img.trim()) galleryHtml += `<img src="${img.trim()}" alt="صورة توضيحية">`;
            });
          }
          document.getElementById('gallery-container').innerHTML = galleryHtml;

          let panel = document.getElementById('info-panel');
          panel.style.display = 'block';
        });
      }
    });

    function closePanel() {
      document.getElementById('info-panel').style.display = 'none';
    }
  </script>
</head>
<body>

  <div id="vr-container">
    
    <div class="logos-wrapper">
      <img src="https://haj.gov.sa/_next/image?url=https%3A%2F%2Fhaj.gov.sa%2Fs-core%2F-%2Fmedia%2FProject%2FHAJJ%2FHajj-Logos%2FHeader-Logo.svg%3Fiar%3D0%26hash%3DEA30CCD6D55090BA41D3BA548A24E24A&amp;w=256&amp;q=75" alt="وزارة الحج والعمرة">
      <img src="https://image2url.com/r2/default/images/1773558610625-b250b6cd-d224-421f-b749-0894a9cf0602.png" alt="يوروكونسلت">
    </div>

    <div id="info-panel">
      <button class="close-btn" onclick="closePanel()">✖</button>
      <h2 id="panel-title">--</h2>
      <p id="panel-desc">--</p>
      <div id="gallery-container" class="gallery-container"></div>
    </div>

    <a-scene embedded cursor="rayOrigin: mouse" raycaster="objects: .clickable" vr-mode-ui="enabled: true">
      
      <a-assets timeout="30000">
        <a-asset-item id="model-jamarat" src="jamaraat.glb"></a-asset-item>
        <a-asset-item id="model-khimaa" src="KHIMAA.glb"></a-asset-item>
      </a-assets>

      <a-sky color="#050508"></a-sky>
      
      <!-- أرضية الشبكة بمربعات صغيرة جداً -->
      <a-plane position="0 0 0" rotation="-90 0 0" width="10000" height="10000" smooth-grid material="shader: flat;"></a-plane>

      <!-- إضاءة ساطعة جداً (قمر قوي + إضاءة محيطية شاملة) -->
      <a-light type="ambient" color="#ffffff" intensity="1.5"></a-light>
      <a-light type="directional" color="#ffffff" intensity="2" position="10 50 10"></a-light>
      <a-light type="directional" color="#dbeafe" intensity="1" position="-10 30 -10"></a-light>

      <!-- حاوية الموديلات (ثابتة تماماً بدون دوران) -->
      <a-entity position="0 0 0">
        
        <!-- الجمرات -->
        <a-entity position="-5 0 0">
          <!-- الموديل ثابت والمقاس مصغر ليكون مرئياً بالكامل -->
          <a-gltf-model src="#model-jamarat" scale="0.002 0.002 0.002"></a-gltf-model>
          
          <!-- نقطة البوب-أب -->
          <a-entity line="start: 0 0 0; end: 0 4 0; color: #ffffff"></a-entity>
          <a-sphere class="clickable" position="0 4 0" radius="0.2" color="#ffffff" material="shader: flat"
                    animation="property: position; dir: alternate; dur: 1500; loop: true; to: 0 4.3 0"
                    hotspot-action="title: منشأة الجمرات التقنية; 
                                    desc: نص تجريبي: تم تجهيز هذا الموديل بأبعاد دقيقة ليتناسب مع الرؤية الفضائية ضمن منصة المشاعر المقدسة.; 
                                    images: https://images.unsplash.com/photo-1591604129939-f1efa4d9f7fa?w=400,https://images.unsplash.com/photo-1565552643952-b91c28bdf713?w=400">
          </a-sphere>
        </a-entity>

        <!-- الخيام -->
        <a-entity position="5 0 0">
          <!-- الموديل ثابت والمقاس مصغر -->
          <a-gltf-model src="#model-khimaa" scale="0.002 0.002 0.002"></a-gltf-model>
          
          <!-- نقطة البوب-أب -->
          <a-entity line="start: 0 0 0; end: 0 4 0; color: #ffffff"></a-entity>
          <a-sphere class="clickable" position="0 4 0" radius="0.2" color="#ffffff" material="shader: flat"
                    animation="property: position; dir: alternate; dur: 1500; loop: true; to: 0 4.3 0"
                    hotspot-action="title: مخيمات الحجاج في منى; 
                                    desc: نص تجريبي: مدينة الخيام مجهزة بأحدث معايير السلامة، وهذا العرض يوضح التخطيط الهندسي لمناطق الإسكان.; 
                                    images: https://images.unsplash.com/photo-1591604129939-f1efa4d9f7fa?w=400">
          </a-sphere>
        </a-entity>

      </a-entity>

      <!-- الكاميرا مقتربة بشكل افتراضي لتبدأ الرؤية واضحة -->
      <a-entity camera look-controls="enabled: false" 
                orbit-controls="target: 0 0 0; minDistance: 2; maxDistance: 100; initialPosition: 0 8 15; 
                                enablePan: true; enableZoom: true; enableDamping: true; dampingFactor: 0.1;">
      </a-entity>
      
    </a-scene>
  </div>
</body>
</html>
