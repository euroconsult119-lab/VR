<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <title>منصة المشاعر المقدسة الافتراضية</title>
  
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&display=swap" rel="stylesheet">
  
  <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
  <!-- مكتبة لدعم النصوص 3D باللغة العربية -->
  <script src="https://unpkg.com/aframe-troika-text-component@2.0.0/dist/aframe-troika-text-component.min.js"></script>
  <script src="https://unpkg.com/aframe-orbit-controls@1.3.2/dist/aframe-orbit-controls.min.js"></script>

  <style>
    body, html {
      margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden;
      font-family: 'Cairo', sans-serif;
      background: radial-gradient(circle at top, #06193b 0%, #010308 90%);
    }

    #vr-container { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }

    /* شاشة البدء */
    #start-screen {
      position: absolute; inset: 0; z-index: 200;
      background: rgba(2, 5, 10, 0.85); backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px);
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      transition: opacity 0.8s ease;
    }
    .play-btn {
      width: 100px; height: 100px; border-radius: 50%;
      background: rgba(0, 150, 255, 0.1); border: 2px solid #00d2ff;
      color: #00d2ff; font-size: 36px; display: flex; align-items: center; justify-content: center;
      cursor: pointer; transition: 0.4s; box-shadow: 0 0 40px rgba(0, 150, 255, 0.4);
      margin-bottom: 25px; outline: none; padding-left: 8px;
    }
    .play-btn:hover {
      background: #00d2ff; color: #fff; transform: scale(1.1); box-shadow: 0 0 60px rgba(0, 210, 255, 0.8);
    }
    .start-title {
      color: #ffffff; font-size: 32px; font-weight: 800; text-shadow: 0 4px 15px rgba(0, 150, 255, 0.6);
      letter-spacing: 1px; margin: 0; text-align: center;
    }

    /* الشعارات */
    .logos-wrapper {
      position: absolute; top: 20px; left: 0; right: 0;
      display: flex; justify-content: space-between; padding: 0 40px;
      z-index: 100; pointer-events: none; 
    }
    .logos-wrapper img { 
      height: 35px; object-fit: contain; pointer-events: auto;
      filter: brightness(0) invert(1); opacity: 0.9;
    }

    /* أسهم التنقل السفلية */
    .nav-arrows-container {
      position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%);
      display: flex; align-items: center; gap: 30px; z-index: 100; direction: ltr;
      visibility: hidden; /* مخفية حتى نضغط Play */
    }
    .nav-arrow {
      pointer-events: auto; width: 45px; height: 45px; border-radius: 50%;
      background: rgba(6, 12, 24, 0.4); border: 1px solid rgba(0, 150, 255, 0.3);
      color: #00d2ff; font-size: 20px; font-weight: bold;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; transition: 0.3s; backdrop-filter: blur(5px);
    }
    .nav-arrow:hover { 
      background: rgba(0, 150, 255, 0.2); box-shadow: 0 0 20px rgba(0, 150, 255, 0.5); 
      transform: scale(1.1); color: #fff; border-color: #00d2ff;
    }
    .nav-text {
      color: #00d2ff; font-size: 16px; font-weight: 600; letter-spacing: 1px;
      text-shadow: 0 0 10px rgba(0, 150, 255, 0.5); pointer-events: none;
    }

    /* النافذة الجانبية المائلة (البوب أب) */
    #info-panel-container {
      position: absolute; top: 50%; width: 340px; z-index: 100; display: none;
      right: 5%; transform: translateY(-50%) perspective(1000px) rotateY(-8deg); 
      transform-style: preserve-3d;
    }
    .info-box {
      background: rgba(6, 10, 18, 0.75); color: #fff;
      padding: 20px; border-radius: 16px; margin-bottom: 12px;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.6), 0 0 15px rgba(0, 150, 255, 0.1) inset;
      border: 1px solid rgba(0, 150, 255, 0.2); border-top: 1px solid rgba(0, 150, 255, 0.4);
      backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px);
      position: relative;
    }
    .gallery-box {
      background: rgba(6, 10, 18, 0.75); padding: 12px; border-radius: 16px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5), 0 0 15px rgba(0, 150, 255, 0.1) inset;
      border: 1px solid rgba(0, 150, 255, 0.2); border-bottom: 1px solid rgba(0, 150, 255, 0.4);
      backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px);
    }
    .close-btn {
      position: absolute; top: 10px; left: 15px; background: none; border: none; 
      color: rgba(255,255,255,0.5); font-size: 20px; cursor: pointer; transition: 0.3s;
    }
    .close-btn:hover { color: #fff; transform: scale(1.1); }
    #panel-title { 
      margin: 0 0 10px 0; color: #ffffff; font-size: 22px; font-weight: 800;
      text-shadow: 0 2px 10px rgba(0, 150, 255, 0.5);
    }
    #panel-desc { line-height: 1.6; font-size: 14px; margin: 0; color: #a0aec0; }
    
    .gallery-container { display: flex; gap: 10px; overflow-x: auto; padding-bottom: 5px; }
    .gallery-container::-webkit-scrollbar { height: 4px; }
    .gallery-container::-webkit-scrollbar-thumb { background: rgba(0,150,255,0.3); border-radius: 4px; }
    .gallery-card {
      height: 80px; min-width: 120px; border-radius: 8px; 
      border: 1px solid rgba(255,255,255,0.05); overflow: hidden;
      box-shadow: 0 4px 10px rgba(0,0,0,0.3); transition: 0.3s; cursor: pointer;
    }
    .gallery-card img { width: 100%; height: 100%; object-fit: cover; }
    .gallery-card:hover { transform: translateY(-3px); box-shadow: 0 6px 15px rgba(0, 150, 255, 0.3); }

  </style>

  <script>
    // تصميم الشبكة 
    AFRAME.registerComponent('neon-grid', {
      init: function () {
        let canvas = document.createElement('canvas');
        canvas.width = 512; canvas.height = 512;
        let ctx = canvas.getContext('2d');
        ctx.fillStyle = 'rgba(0, 0, 0, 1)'; 
        ctx.fillRect(0, 0, 512, 512);
        
        ctx.strokeStyle = 'rgba(0, 150, 255, 0.2)'; 
        ctx.lineWidth = 1.5; 
        ctx.shadowBlur = 5;
        ctx.shadowColor = "#00d2ff";
        ctx.strokeRect(0, 0, 512, 512);
        
        let texture = new THREE.CanvasTexture(canvas);
        texture.wrapS = THREE.RepeatWrapping;
        texture.wrapT = THREE.RepeatWrapping;
        texture.repeat.set(500, 500); 
        
        let material = new THREE.MeshStandardMaterial({ 
          map: texture, roughness: 0.7, metalness: 0.2 
        });
        this.el.getObject3D('mesh').material = material;
      }
    });

    // بيانات الموديلات
    const siteData = [
      { 
        id: 'scene-welcome', title: 'مشهد الترحيب', desc: '', images: '',
        camRadius: 40, camHeight: 15, targetY: 10, panelPosition: 'none'
      },
      { 
        id: 'model_jamarat', title: 'منشأة الجمرات',
        desc: 'مجمع معماري حديث مصمم لتسهيل حركة الحجاج أثناء رمي الجمرات، يظهر هنا تفصيل المسارات المتعددة.',
        images: 'https://images.unsplash.com/photo-1565552643952-b91c28bdf713?w=300,https://images.unsplash.com/photo-1591604129939-f1efa4d9f7fa?w=300',
        camRadius: 35, camHeight: 18, targetY: 10, panelPosition: 'right'
      },
      { 
        id: 'model_khimaa', title: 'مخيمات منى',
        desc: 'مدينة الخيام المطورة، توفر إقامة آمنة ومريحة للحجاج ضمن تخطيط هندسي دقيق لمنطقة المشاعر.',
        images: 'https://images.unsplash.com/photo-1591604129939-f1efa4d9f7fa?w=300',
        camRadius: 35, camHeight: 18, targetY: 10, panelPosition: 'left'
      }
    ];

    let currentIndex = 0;
    let isStarted = false;

    function startExperience() {
      let screen = document.getElementById('start-screen');
      screen.style.opacity = '0';
      setTimeout(() => { 
        screen.style.display = 'none'; 
        document.querySelector('.nav-arrows-container').style.visibility = 'visible';
        isStarted = true;
      }, 800);
    }

    function goToPrev() {
      if(!isStarted) return;
      currentIndex = (currentIndex - 1 + siteData.length) % siteData.length;
      showCurrentModel();
    }

    function goToNext() {
      if(!isStarted) return;
      currentIndex = (currentIndex + 1) % siteData.length;
      showCurrentModel();
    }

    function showCurrentModel() {
      let data = siteData[currentIndex];
      closePanel();

      // إخفاء جميع الموديلات
      document.getElementById('scene-welcome').setAttribute('visible', 'false');
      let allModels = document.querySelectorAll('.scene-model');
      allModels.forEach(model => {
        model.setAttribute('visible', 'false');
        model.classList.remove('clickable');
      });

      let cameraEl = document.querySelector('[camera]');
      let orbit = cameraEl.components['orbit-controls'];

      if(currentIndex === 0) {
        // العودة لمشهد الترحيب (النيون)
        document.getElementById('scene-welcome').setAttribute('visible', 'true');
        orbit.target.set(0, data.targetY, 0);
        cameraEl.setAttribute('position', `0 ${data.camHeight} ${data.camRadius}`);
        return;
      }

      // إظهار الموديل المحدد وتوجيه الكاميرا له
      let currentModelEl = document.getElementById(data.id);
      if(currentModelEl) {
        currentModelEl.setAttribute('visible', 'true');
        orbit.target.set(0, data.targetY, 0); 
        cameraEl.setAttribute('position', `0 ${data.camHeight} ${data.camRadius}`);
      }
      
      setTimeout(() => { updateInfoPanel(data); }, 600);
    }

    function updateInfoPanel(data) {
      if(data.panelPosition === 'none') return;

      document.getElementById('panel-title').innerText = data.title;
      document.getElementById('panel-desc').innerText = data.desc;
      
      let galleryBox = document.getElementById('gallery-box');
      if (data.images) {
        let galleryHtml = '';
        data.images.split(',').forEach(img => {
          galleryHtml += `<div class="gallery-card"><img src="${img.trim()}" alt="صورة توضيحية"></div>`;
        });
        document.getElementById('gallery-container').innerHTML = galleryHtml;
        galleryBox.style.display = 'block'; 
      } else {
        galleryBox.style.display = 'none'; 
      }
      
      let panelContainer = document.getElementById('info-panel-container');
      if (data.panelPosition === 'right') {
        panelContainer.style.left = 'auto'; panelContainer.style.right = '5%';
        panelContainer.style.transform = 'translateY(-50%) perspective(1000px) rotateY(-12deg)';
      } else {
        panelContainer.style.right = 'auto'; panelContainer.style.left = '5%';
        panelContainer.style.transform = 'translateY(-50%) perspective(1000px) rotateY(12deg)';
      }
      
      panelContainer.style.display = 'block';
    }

    function closePanel() {
      document.getElementById('info-panel-container').style.display = 'none';
    }
  </script>
</head>
<body>

  <!-- شاشة البدء -->
  <div id="start-screen">
    <button class="play-btn" onclick="startExperience()">▶</button>
    <h1 class="start-title">معالم مشعر منى مكة المكرمة</h1>
  </div>

  <div id="vr-container">
    
    <div class="logos-wrapper">
      <img src="https://haj.gov.sa/_next/image?url=https%3A%2F%2Fhaj.gov.sa%2Fs-core%2F-%2Fmedia%2FProject%2FHAJJ%2FHajj-Logos%2FHeader-Logo.svg%3Fiar%3D0%26hash%3DEA30CCD6D55090BA41D3BA548A24E24A&w=256&q=75" alt="وزارة الحج والعمرة">
      <img src="https://image2url.com/r2/default/images/1773558610625-b250b6cd-d224-421f-b749-0894a9cf0602.png" alt="يوروكونسلت">
    </div>

    <!-- أسهم التنقل السفلية مع الجملة المطلوبة -->
    <div class="nav-arrows-container">
      <div class="nav-arrow" onclick="goToPrev()">&#10095;</div> 
      <div class="nav-text">مرر لرؤية المعالم</div>
      <div class="nav-arrow" onclick="goToNext()">&#10094;</div> 
    </div>

    <!-- البوب-أب الجانبي -->
    <div id="info-panel-container">
      <div class="info-box">
        <button class="close-btn" onclick="closePanel()">✖</button>
        <h2 id="panel-title">--</h2>
        <p id="panel-desc">--</p>
      </div>
      <div class="gallery-box" id="gallery-box">
        <div id="gallery-container" class="gallery-container"></div>
      </div>
    </div>

    <!-- 
      1. تم إخفاء زر الـ VR نهائياً (vr-mode-ui="enabled: false")
      2. تم تفعيل logarithmicDepthBuffer لمنع التآكل والغطس
    -->
    <a-scene embedded antialias="true" renderer="logarithmicDepthBuffer: true; colorManagement: true;" vr-mode-ui="enabled: false">
      
      <a-assets timeout="30000">
        <a-asset-item id="model-jamarat" src="jamaraat.glb"></a-asset-item>
        <a-asset-item id="model-khimaa" src="KHIMAA.glb"></a-asset-item>
        <a-asset-item id="cairo-font" src="https://fonts.gstatic.com/s/cairo/v28/SLXVc1nY6Hkvangq7b1qXW7-m70cR_g.woff"></a-asset-item>
      </a-assets>

      <a-sky opacity="0"></a-sky>
      
      <!-- الشبكة (تم تخفيضها قليلاً للأسفل -2 متر لزيادة الأمان ومنع أي تقاطع مع الموديل) -->
      <a-plane position="0 -2 0" rotation="-90 0 0" width="2000" height="2000" neon-grid></a-plane>

      <a-light type="ambient" color="#030b1a" intensity="1.8"></a-light>
      <a-light type="spot" color="#0088ff" intensity="3" position="0 80 0" rotation="-90 0 0" angle="70" penumbra="1" distance="200" decay="2"></a-light>
      <a-light type="directional" color="#ffffff" intensity="0.5" position="15 30 20"></a-light>

      <a-entity id="models-group">
        
        <!-- ============================================ -->
        <!-- 0. مشهد الترحيب النيون (حياكم في معالم مشعر منى) -->
        <!-- ============================================ -->
        <a-entity id="scene-welcome" position="0 0 0" visible="true">
          <!-- النص الأساسي 3D مفرغ النيون -->
          <a-entity position="0 15 0" 
                    animation="property: position; dir: alternate; dur: 2500; loop: true; to: 0 15.5 0">
             <a-entity troika-text="value: حياكم في معالم\nمشعر منى; 
                                    font: #cairo-font;
                                    fontSize: 4;
                                    align: center;
                                    color: #00d2ff;
                                    outlineWidth: 0.05;
                                    outlineColor: #00d2ff;
                                    fillOpacity: 0.2;
                                    lineHeight: 1.2"
                       material="shader: flat">
             </a-entity>
          </a-entity>
          <!-- أسهم نيون 3D تتحرك لليمين -->
          <a-entity position="-4 10 0" 
                    animation="property: position; to: 4 10 0; dur: 2000; easing: linear; loop: true;">
            <a-entity troika-text="value: >>>>>>>>; font: #cairo-font; fontSize: 2.5; color: #00d2ff; outlineWidth: 0.04; outlineColor: #00d2ff; fillOpacity: 0.2;" material="shader: flat"></a-entity>
          </a-entity>
        </a-entity>

        <!-- ============================================ -->
        <!-- 1. منشأة الجمرات (مرفوعة 10 أمتار عن الأرضية لمنع التآكل) -->
        <!-- ============================================ -->
        <a-entity id="model_jamarat" class="scene-model" position="0 10 0" visible="false">
          <a-gltf-model src="#model-jamarat" scale="0.05 0.05 0.05"></a-gltf-model>
          <a-entity line="start: 0 0 0; end: 0 6 0; color: #ffffff; opacity: 0.4"></a-entity>
          <a-sphere position="0 6 0" radius="0.2" color="#ffffff" material="shader: flat" 
                    animation="property: position; dir: alternate; dur: 2000; loop: true; to: 0 6.5 0"></a-sphere>
        </a-entity>

        <!-- ============================================ -->
        <!-- 2. مخيمات منى (مرفوعة 10 أمتار عن الأرضية) -->
        <!-- ============================================ -->
        <a-entity id="model_khimaa" class="scene-model" position="0 10 0" visible="false">
          <a-gltf-model src="#model-khimaa" scale="5 5 5"></a-gltf-model>
          <a-entity line="start: 0 0 0; end: 0 6 0; color: #ffffff; opacity: 0.4"></a-entity>
          <a-sphere position="0 6 0" radius="0.2" color="#ffffff" material="shader: flat" 
                    animation="property: position; dir: alternate; dur: 2000; loop: true; to: 0 6.5 0"></a-sphere>
        </a-entity>

      </a-entity>

      <!-- 
        الكاميرا مضبوطة لعدم قطع المجسمات (near: 0.1) وتدور حول الموديل بسلاسة
      -->
      <a-entity camera="near: 0.1; far: 10000" look-controls="enabled: false" 
                orbit-controls="target: 0 10 0; minDistance: 5; maxDistance: 150; initialPosition: 0 15 40; 
                                enablePan: true; enableZoom: true; enableDamping: true; dampingFactor: 0.05; rotateSpeed: 0.5;">
      </a-entity>
      
    </a-scene>
  </div>
</body>
</html>
