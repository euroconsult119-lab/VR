<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <title>منصة المشاعر المقدسة - عرض ثلاثي الأبعاد</title>
  
  <!-- مكتبة A-Frame الأساسية -->
  <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
  <!-- مكتبة Orbit Controls لمحاكاة حركة كاميرا Sketchfab -->
  <script src="https://unpkg.com/aframe-orbit-controls@1.3.2/dist/aframe-orbit-controls.min.js"></script>

  <style>
    /* تفريغ الهوامش وجعل الصفحة تملأ الشاشة بالكامل */
    * { box-sizing: border-box; }
    body, html {
      margin: 0; padding: 0;
      width: 100%; height: 100%;
      overflow: hidden; /* يمنع ظهور أشرطة التمرير نهائياً */
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: #f4f4f4;
    }
    
    /* حاوية المشهد (تمتد بكامل مساحة الشاشة) */
    #vr-container {
      position: absolute;
      top: 0; left: 0;
      width: 100vw; height: 100vh;
      border: none; border-radius: 0;
      overflow: hidden;
      background: #f4f4f4;
    }

    /* الشعارات - غير قابلة لعرقلة الماوس في الخلفية */
    .logos-wrapper {
      position: absolute; top: 20px; left: 0; right: 0;
      display: flex; justify-content: space-between; padding: 0 30px;
      z-index: 100; pointer-events: none; 
    }
    .logos-wrapper img { height: 75px; object-fit: contain; pointer-events: auto; }
    
    /* لوحة التحكم السفلية */
    .control-panel { position: absolute; bottom: 30px; right: 30px; z-index: 100; }
    .btn-primary {
      background: #2c3e50; color: #fff; border: none; padding: 12px 24px;
      border-radius: 8px; cursor: pointer; font-weight: bold; transition: 0.3s;
      box-shadow: 0 4px 10px rgba(0,0,0,0.3);
    }
    .btn-primary.active { background: #27ae60; }
    
    /* نافذة استخراج الأكواد */
    #coord-logger {
      position: absolute; top: 110px; right: 30px; z-index: 100;
      background: rgba(255,255,255,0.95); padding: 15px; border-radius: 8px;
      display: none; color: #333; direction: ltr; border: 1px solid #ddd;
      font-family: monospace; max-width: 400px; word-wrap: break-word;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
    }

    /* لوحة المعلومات التفاعلية (الإطار الأسود الشفاف) */
    #info-panel {
      position: absolute; bottom: 40px; left: 50%; transform: translateX(-50%);
      width: 90%; max-width: 650px;
      background: rgba(25, 32, 40, 0.92); color: #fff;
      padding: 24px; border-radius: 12px; z-index: 100;
      display: none; box-shadow: 0 10px 40px rgba(0,0,0,0.5);
      border: 1px solid rgba(255,255,255,0.1);
      backdrop-filter: blur(5px);
    }
    .close-btn {
      position: absolute; top: 15px; left: 20px;
      background: none; border: none; color: #aaa; font-size: 24px;
      cursor: pointer; transition: 0.2s;
    }
    .close-btn:hover { color: #fff; }
    #panel-title { margin: 0 0 10px 0; color: #dcb994; font-size: 22px; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 10px;}
    #panel-desc { line-height: 1.7; font-size: 15px; margin-bottom: 15px;}
    
    /* معرض الصور الجانبي */
    .gallery-container {
      display: flex; gap: 10px; overflow-x: auto;
      padding: 10px; background: rgba(0,0,0,0.4); border-radius: 8px;
    }
    .gallery-container img {
      height: 90px; border-radius: 6px; border: 1px solid #555;
      object-fit: cover; cursor: pointer; transition: 0.2s;
    }
    .gallery-container img:hover { transform: scale(1.05); }
  </style>

  <script>
    let isEditMode = false;

    // أداة استخراج الإحداثيات
    AFRAME.registerComponent('hotspot-creator', {
      init: function () {
        this.el.addEventListener('click', (e) => {
          if (!isEditMode || !e.detail.intersection) return;
          
          let p = e.detail.intersection.point;
          let coords = `${p.x.toFixed(2)} ${p.y.toFixed(2)} ${p.z.toFixed(2)}`;
          
          let marker = document.createElement('a-sphere');
          marker.setAttribute('position', coords);
          marker.setAttribute('radius', '0.6');
          marker.setAttribute('color', '#e74c3c');
          this.el.sceneEl.appendChild(marker);

          let logger = document.getElementById('coord-logger');
          logger.style.display = 'block';
          logger.innerHTML = `<strong>كود النقطة (انسخه والصقه في HTML):</strong><br><br>
            <span style="color:#c0392b;">&lt;a-sphere</span> <span style="color:#2980b9;">class="clickable" position="${coords}" radius="0.5" color="#f1c40f"<br>
            animation="property: position; dir: alternate; dur: 2000; loop: true; to: ${p.x.toFixed(2)} ${(p.y + 0.5).toFixed(2)} ${p.z.toFixed(2)}"<br>
            hotspot-action="title: عنوان; desc: وصف; images: images/pic1.jpg"&gt;&lt;/a-sphere&gt;</span>`;
        });
      }
    });

    // أكشن التفاعل مع النقاط
    AFRAME.registerComponent('hotspot-action', {
      schema: {
        title: {type: 'string'},
        desc: {type: 'string'},
        audio: {type: 'string', default: ''},
        images: {type: 'string', default: ''} 
      },
      init: function () {
        this.el.addEventListener('click', (e) => {
          if (isEditMode) return; 
          
          let data = this.data;
          
          // إيقاف الصوتيات
          document.querySelectorAll('.voiceover').forEach(audio => { 
            audio.pause(); audio.currentTime = 0; 
          });
          
          // تشغيل الصوت
          if (data.audio) {
            let audioEl = document.querySelector(data.audio);
            if (audioEl) audioEl.play().catch(e => console.log('Audio error:', e));
          }

          // تعبئة البيانات
          document.getElementById('panel-title').innerText = data.title;
          document.getElementById('panel-desc').innerText = data.desc;
          
          // تعبئة الصور
          let galleryHtml = '';
          if (data.images.trim() !== '') {
            data.images.split(',').forEach(img => {
              if(img.trim()) galleryHtml += `<img src="${img.trim()}" alt="صورة للموقع">`;
            });
          }
          document.getElementById('gallery-container').innerHTML = galleryHtml;
          document.getElementById('info-panel').style.display = 'block';
        });
      }
    });

    function toggleEditMode() {
      isEditMode = !isEditMode;
      let btn = document.getElementById('edit-mode-btn');
      let logger = document.getElementById('coord-logger');
      
      if(isEditMode) {
        btn.classList.add('active');
        btn.innerText = "إنهاء التحرير (وضع الإضافة مفعل)";
      } else {
        btn.classList.remove('active');
        btn.innerText = "تفعيل إضافة النقاط (Edit Mode)";
        logger.style.display = 'none';
      }
    }
    
    function closePanel() {
      document.getElementById('info-panel').style.display = 'none';
      document.querySelectorAll('.voiceover').forEach(a => { a.pause(); a.currentTime = 0; });
    }
  </script>
</head>
<body>

  <div id="vr-container">
    
    <!-- الشعارات -->
    <div class="logos-wrapper">
      <img src="https://haj.gov.sa/_next/image?url=https%3A%2F%2Fhaj.gov.sa%2Fs-core%2F-%2Fmedia%2FProject%2FHAJJ%2FHajj-Logos%2FHeader-Logo.svg%3Fiar%3D0%26hash%3DEA30CCD6D55090BA41D3BA548A24E24A&amp;w=256&amp;q=75" alt="وزارة الحج والعمرة">
      <img src="https://image2url.com/r2/default/images/1773558610625-b250b6cd-d224-421f-b749-0894a9cf0602.png" alt="يوروكونسلت">
    </div>

    <!-- التحكم -->
    <div class="control-panel">
      <button id="edit-mode-btn" class="btn-primary" onclick="toggleEditMode()">تفعيل إضافة النقاط (Edit Mode)</button>
    </div>
    <div id="coord-logger"></div>

    <!-- لوحة العرض -->
    <div id="info-panel">
      <button class="close-btn" onclick="closePanel()">✖</button>
      <h2 id="panel-title">--</h2>
      <p id="panel-desc">--</p>
      <div id="gallery-container" class="gallery-container"></div>
    </div>

    <!-- المشهد -->
    <a-scene embedded cursor="rayOrigin: mouse" raycaster="objects: .clickable, .model-surface" hotspot-creator vr-mode-ui="enabled: true">
      
      <a-assets timeout="10000">
        <a-asset-item id="model-jamarat" src="models/jamaraat.glb"></a-asset-item>
        <a-asset-item id="model-khimaa" src="models/KHIMAA.glb"></a-asset-item>
  
        
        <audio id="audio-jamarat" class="voiceover" src="audio/jamarat.mp3" preload="auto"></audio>
      </a-assets>

      <!-- سماء مضيئة وإضاءة ناعمة -->
      <a-sky color="#f4f4f4"></a-sky>
      <a-light type="ambient" color="#ffffff" intensity="0.6"></a-light>
      <a-light type="directional" color="#ffffff" intensity="0.4" position="-1 2 1"></a-light>

      <!-- المنصة الدائرية -->
      <a-circle position="0 -0.1 -20" rotation="-90 0 0" radius="80" color="#3d4044" roughness="0.9"></a-circle>

      <!-- الموديلات -->
      <a-entity class="model-surface">
        <a-gltf-model src="#model-kif" position="20 0 -20"></a-gltf-model>
        <a-gltf-model src="#model-jamarat" position="0 0 -30"></a-gltf-model>
        <a-gltf-model src="#model-khimaa" position="-20 0 -20"></a-gltf-model>
        <a-gltf-model src="#model-albiaa" position="40 0 -20"></a-gltf-model>
        <a-gltf-model src="#model-mgazer" position="-40 0 -20"></a-gltf-model>
      </a-entity>

      <!-- نقطة تجريبية (يُمكنك حذفها واستبدالها بنقاطك) -->
      <a-sphere class="clickable" position="0 5 -30" radius="0.5" color="#f1c40f"
                animation="property: position; dir: alternate; dur: 2000; loop: true; to: 0 5.5 -30"
                hotspot-action="title: منشأة الجمرات; desc: مجمع معماري متعدد الطوابق صُمم لتسهيل انسيابية حركة الحجاج بأمان أثناء أداء شعيرة رمي الجمرات.; audio: #audio-jamarat; images: images/jamarat1.jpg,images/jamarat2.jpg">
      </a-sphere>

      <!-- الكاميرا المدارية -->
      <a-entity camera look-controls="enabled: false" 
                orbit-controls="target: 0 0 -20; minDistance: 5; maxDistance: 150; initialPosition: 0 40 40; enablePan: true; enableZoom: true;">
      </a-entity>
      
    </a-scene>
  </div>
</body>
</html>
