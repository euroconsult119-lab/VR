<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <title>منصة المشاعر المقدسة الافتراضية</title>
  
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&display=swap" rel="stylesheet">
  <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
  <script src="https://unpkg.com/aframe-orbit-controls@1.3.2/dist/aframe-orbit-controls.min.js"></script>

  <style>
    body, html {
      margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden;
      font-family: 'Cairo', sans-serif;
      background: #02050d;
    }

    #vr-container { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }

    /* --- شاشة البداية --- */
    #start-screen {
      position: absolute; inset: 0; z-index: 200;
      background: rgba(2, 5, 10, 0.95); backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px);
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      transition: opacity 0.8s ease;
    }
    .play-btn {
      width: 100px; height: 100px; border-radius: 50%;
      background: rgba(0, 150, 255, 0.1); border: 2px solid #00d2ff;
      color: #00d2ff; font-size: 36px; display: flex; align-items: center; justify-content: center;
      cursor: pointer; transition: 0.4s; box-shadow: 0 0 40px rgba(0, 150, 255, 0.4);
      margin-bottom: 25px; outline: none; padding-left: 8px;
    }
    .play-btn:hover {
      background: #00d2ff; color: #fff; transform: scale(1.1); box-shadow: 0 0 60px rgba(0, 210, 255, 0.8);
    }
    .start-title {
      color: #ffffff; font-size: 28px; font-weight: 800; 
      text-shadow: 0 0 10px rgba(255, 255, 255, 0.5), 0 0 20px rgba(0, 150, 255, 0.8);
      margin: 0; text-align: center;
    }

    /* --- الشعارات --- */
    .logos-wrapper {
      position: absolute; top: 20px; left: 0; right: 0;
      display: flex; justify-content: space-between; padding: 0 40px;
      z-index: 100; pointer-events: none; 
    }
    .logos-wrapper img { 
      height: 35px; object-fit: contain; pointer-events: auto;
      filter: brightness(0) invert(1); opacity: 0.85;
    }

    /* --- أسهم التنقل السفلية --- */
    .nav-arrows-container {
      position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%);
      display: flex; align-items: center; gap: 30px; z-index: 100; 
      visibility: hidden; direction: ltr;
    }
    .nav-arrow {
      pointer-events: auto; width: 45px; height: 45px; border-radius: 50%;
      background: rgba(6, 12, 24, 0.6); border: 1px solid rgba(0, 150, 255, 0.4);
      color: #00d2ff; font-size: 20px; font-weight: bold;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; transition: 0.3s; backdrop-filter: blur(5px);
    }
    .nav-arrow:hover { 
      background: rgba(0, 150, 255, 0.3); box-shadow: 0 0 20px rgba(0, 150, 255, 0.6); 
      transform: scale(1.1); color: #fff; border-color: #00d2ff;
    }
    .nav-text {
      color: #00d2ff; font-size: 16px; font-weight: 600; letter-spacing: 1px;
      text-shadow: 0 0 10px rgba(0, 150, 255, 0.5); pointer-events: none;
    }

    /* --- النافذة الجانبية --- */
    #info-panel-container {
      position: absolute; top: 50%; width: 500px; 
      z-index: 100; display: none; transform-style: preserve-3d;
    }
    .info-box {
      background: rgba(6, 10, 18, 0.85); color: #fff;
      padding: 25px; border-radius: 16px; margin-bottom: 15px;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.6), 0 0 15px rgba(0, 150, 255, 0.1) inset;
      border: 1px solid rgba(0, 150, 255, 0.2); border-top: 1px solid rgba(0, 150, 255, 0.4);
      backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px);
      position: relative;
    }
    .gallery-box {
      background: rgba(6, 10, 18, 0.85); padding: 15px; border-radius: 16px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5), 0 0 15px rgba(0, 150, 255, 0.1) inset;
      border: 1px solid rgba(0, 150, 255, 0.2); border-bottom: 1px solid rgba(0, 150, 255, 0.4);
      backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px);
    }
    .close-btn {
      position: absolute; top: 12px; left: 15px; background: none; border: none; 
      color: rgba(255,255,255,0.5); font-size: 20px; cursor: pointer; transition: 0.3s;
    }
    .close-btn:hover { color: #fff; transform: scale(1.1); }
    #panel-title { 
      margin: 0 0 12px 0; color: #ffffff; font-size: 24px; font-weight: 800;
      text-shadow: 0 2px 10px rgba(0, 150, 255, 0.5);
    }
    #panel-desc { line-height: 1.7; font-size: 15px; margin: 0; color: #a0aec0; }
    
    .gallery-container { display: flex; gap: 10px; overflow-x: auto; padding-bottom: 5px; }
    .gallery-container::-webkit-scrollbar { height: 6px; }
    .gallery-container::-webkit-scrollbar-thumb { background: rgba(0,150,255,0.4); border-radius: 4px; }
    .gallery-card {
      height: 90px; min-width: 140px; border-radius: 8px; 
      border: 1px solid rgba(255,255,255,0.1); overflow: hidden;
      box-shadow: 0 4px 10px rgba(0,0,0,0.4); transition: 0.3s; cursor: pointer;
    }
    .gallery-card img { width: 100%; height: 100%; object-fit: cover; }
    .gallery-card:hover { transform: translateY(-3px); box-shadow: 0 6px 15px rgba(0, 150, 255, 0.4); }

    /* --- عارض الصور المكبرة --- */
    #image-viewer {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(2, 5, 13, 0.95); backdrop-filter: blur(10px);
      z-index: 300; display: none; align-items: center; justify-content: center;
    }
    #image-viewer img {
      max-width: 90%; max-height: 80%; border-radius: 12px;
      box-shadow: 0 10px 40px rgba(0, 150, 255, 0.4);
      border: 2px solid rgba(0, 150, 255, 0.3); object-fit: contain;
    }
    .close-viewer-btn {
      position: absolute; top: 30px; right: 40px;
      background: rgba(0, 150, 255, 0.1); border: 1px solid #00d2ff; color: #00d2ff;
      font-size: 24px; width: 45px; height: 45px; border-radius: 50%;
      cursor: pointer; display: flex; align-items: center; justify-content: center; transition: 0.3s;
    }
    .close-viewer-btn:hover { background: #00d2ff; color: #fff; transform: scale(1.1); box-shadow: 0 0 20px rgba(0, 150, 255, 0.5); }

    /* --- تأثير Fade الانسيابي --- */
    #fade-overlay {
      position: absolute; inset: 0; background: #02050d; opacity: 0;
      z-index: 150; pointer-events: none; transition: opacity 0.5s ease-in-out;
    }
  </style>

  <script>
    // 1. مكون الشبكة 
    AFRAME.registerComponent('neon-grid', {
      init: function () {
        let canvas = document.createElement('canvas');
        canvas.width = 512; canvas.height = 512;
        let ctx = canvas.getContext('2d');
        ctx.fillStyle = 'rgba(2, 5, 13, 1)'; 
        ctx.fillRect(0, 0, 512, 512);
        
        ctx.strokeStyle = 'rgba(0, 150, 255, 0.2)'; 
        ctx.lineWidth = 1.5; 
        ctx.shadowBlur = 5;
        ctx.shadowColor = "#00d2ff";
        ctx.strokeRect(0, 0, 512, 512);
        
        let texture = new THREE.CanvasTexture(canvas);
        texture.wrapS = THREE.RepeatWrapping;
        texture.wrapT = THREE.RepeatWrapping;
        texture.repeat.set(800, 800); 
        
        let material = new THREE.MeshStandardMaterial({ 
          map: texture, roughness: 0.8, metalness: 0.1 
        });
        this.el.getObject3D('mesh').material = material;
      }
    });

    // 2. مكون النص النيون الأصلي والواضح
    AFRAME.registerComponent('hollow-neon-text', {
      schema: {
        text: {type: 'string', default: ''},
        size: {type: 'number', default: 120},
        color: {type: 'string', default: '#00d2ff'},
        width: {type: 'number', default: 60},
        height: {type: 'number', default: 15}
      },
      init: function () {
        let canvas = document.createElement('canvas');
        canvas.width = 2048; canvas.height = 512;
        let ctx = canvas.getContext('2d');

        let texture = new THREE.CanvasTexture(canvas);
        let material = new THREE.MeshBasicMaterial({ map: texture, transparent: true, alphaTest: 0.05 });
        let geometry = new THREE.PlaneGeometry(this.data.width, this.data.height);
        let mesh = new THREE.Mesh(geometry, material);
        this.el.setObject3D('mesh', mesh);

        document.fonts.ready.then(() => {
          ctx.clearRect(0, 0, canvas.width, canvas.height);
          ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
          ctx.font = `bold ${this.data.size}px Cairo, sans-serif`;

          ctx.shadowColor = this.data.color;
          ctx.shadowBlur = 40;
          ctx.strokeStyle = this.data.color;
          ctx.lineWidth = 8;
          ctx.strokeText(this.data.text, canvas.width/2, canvas.height/2);

          ctx.shadowBlur = 10;
          ctx.strokeStyle = '#ffffff';
          ctx.lineWidth = 2;
          ctx.strokeText(this.data.text, canvas.width/2, canvas.height/2);

          texture.needsUpdate = true;
        });
      }
    });

    // 3. البيانات مع النقل اليمين لجميع البوب-أب
    const siteData = [
      { 
        id: 'scene-welcome', title: '', desc: '', images: '', panelPosition: 'none', 
        camRadius: 40, camHeight: 15, offsetX: 0
      },
      { 
        id: 'model_jamarat', 
        title: 'منشأة الجمرات',
        desc: 'تُعد منشأة الجمرات الموقع الذي تُؤدى فيه شعيرة رمي الجمرات الثلاث (الصغرى، والوسطى، والعقبة) بالحصى. صُمم هذا الصرح المعماري بخمسة طوابق ومسارات ذكية باتجاه واحد، لاستيعاب مئات الآلاف من الحجاج في الساعة الواحدة وتأمين حركتهم دون تكدس هنا قلب مشعر منى حيث تتم إدارة وتفويج الحشود الهائلة عبر مسارات دخول وخروج لا تتقاطع.',
        images: 'https://vid.alarabiya.net/images/2022/07/09/6306caa4-ea67-4b15-b748-44d5540cf7ec/6306caa4-ea67-4b15-b748-44d5540cf7ec.jpg?crop=4:3&width=1200,https://pbs.twimg.com/media/HJTiNr5WcAAl8z4?format=webp&name=large,https://mubasher.news/wp-content/uploads/3-753.jpg,https://cp.slaati.com//wp-content/uploads/2018/08/7ec71df0-a2dd-4039-82fb-68c573b6b664.jpeg',
        camRadius: 50, 
        camHeight: 25, 
        panelPosition: 'right',
        offsetX: 0 
      },
      { 
        id: 'model_khimaa', 
        title: 'مخيمات منى',
        desc: 'تُعرف منى بـ مدينة الخيام وهي أكبر مدينة خيام في العالم. يغطي الوادي خيام مطورة مصنوعة من الألياف الزجاجية المقاومة للحريق (التفلون)، ومزودة بأنظمة تكييف متطورة، لضمان أعلى معايير السلامة والراحة لملايين الحجاج أثناء إقامتهم.',
        images: 'https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSUUvqndurt7_k0op_AP_8Bn3ztxms1D3Ao4nJqWntuck9wWLKQKNgz9tE&s=10,https://media.almashhad.com/twitter/1687144283906_DHBmm.webp,https://img.youm7.com/ArticleImgs/2017/8/29/53467-%D9%85%D8%AE%D9%8A%D9%85%D8%A7%D8%AA-%D9%85%D9%86%D9%89.jpg,https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSZFXJxeM2TYDudOUYIyEUasHvYV2ruH93LONqowv_IAgWHb8taft84H1s&s=10',
        camRadius: 40, 
        camHeight: 20, 
        panelPosition: 'right', // 🔴 تم تعديل البوب-أب للخيام ليكون في اليمين دائماً
        offsetX: -40 
      }
    ];

    let currentIndex = 0;
    let isStarted = false;
    let isAnimating = false;

    function startExperience() {
      let screen = document.getElementById('start-screen');
      screen.style.opacity = '0';
      
      setTimeout(() => { 
        screen.style.display = 'none'; 
        document.querySelector('.nav-arrows-container').style.visibility = 'visible';
        
        // إظهار زر الـ VR الافتراضي
        let vrBtn = document.querySelector('.a-enter-vr');
        if(vrBtn) vrBtn.style.display = 'block';

        isStarted = true;
      }, 800);
    }

    // التنقل الدائري اللانهائي (Loop) بين جميع العناصر
    function goToRight() {
      if(!isStarted || isAnimating) return;
      currentIndex = (currentIndex + 1) % siteData.length;
      showCurrentModel();
    }

    function goToLeft() {
      if(!isStarted || isAnimating) return;
      currentIndex = (currentIndex - 1 + siteData.length) % siteData.length;
      showCurrentModel();
    }

    // حركة Fade الانسيابية وتبديل الموديلات
    function showCurrentModel() {
      isAnimating = true;
      let data = siteData[currentIndex];
      closePanel();
      
      let fade = document.getElementById('fade-overlay');
      fade.style.opacity = '1'; 

      setTimeout(() => {
        // إخفاء كل العناصر
        document.getElementById('scene-welcome').setAttribute('visible', 'false');
        document.querySelectorAll('.scene-model').forEach(model => model.setAttribute('visible', 'false'));

        let cameraEl = document.querySelector('[camera]');
        let orbit = cameraEl.components['orbit-controls'];

        if(currentIndex === 0) {
          // العودة للترحيب
          document.getElementById('scene-welcome').setAttribute('visible', 'true');
          orbit.target.set(0, 10, 0);
          cameraEl.setAttribute('position', `0 ${data.camHeight} ${data.camRadius}`);
        } else {
          // إظهار الموديل الجديد
          let currentModelEl = document.getElementById(data.id);
          if(currentModelEl) {
            currentModelEl.setAttribute('visible', 'true');
            currentModelEl.setAttribute('position', `${data.offsetX} 10 0`);
            
            orbit.target.set(0, 10, 0);
            cameraEl.setAttribute('position', `0 ${data.camHeight} ${data.camRadius}`);
          }
        }

        // إزالة تأثير الـ Fade
        fade.style.opacity = '0';

        setTimeout(() => {
          updateInfoPanel(data); 
          isAnimating = false;
        }, 500); 
      }, 500); 
    }

    function updateInfoPanel(data) {
      if(data.panelPosition === 'none') return;
      document.getElementById('panel-title').innerText = data.title;
      document.getElementById('panel-desc').innerText = data.desc;
      
      let galleryBox = document.getElementById('gallery-box');
      if (data.images) {
        let galleryHtml = '';
        data.images.split(',').forEach(img => {
          galleryHtml += `<div class="gallery-card" onclick="openImageViewer('${img.trim()}')"><img src="${img.trim()}" alt="صورة توضيحية"></div>`;
        });
        document.getElementById('gallery-container').innerHTML = galleryHtml;
        galleryBox.style.display = 'block'; 
      } else {
        galleryBox.style.display = 'none'; 
      }
      
      let panelContainer = document.getElementById('info-panel-container');
      if (data.panelPosition === 'right') {
        panelContainer.style.left = 'auto'; panelContainer.style.right = '4%';
        panelContainer.style.transform = 'translateY(-50%) perspective(1200px) rotateY(-6deg)';
      } else {
        panelContainer.style.right = 'auto'; panelContainer.style.left = '4%';
        panelContainer.style.transform = 'translateY(-50%) perspective(1200px) rotateY(6deg)';
      }
      panelContainer.style.display = 'block';
    }

    function closePanel() {
      document.getElementById('info-panel-container').style.display = 'none';
    }

    function openImageViewer(src) {
      document.getElementById('viewer-img').src = src;
      document.getElementById('image-viewer').style.display = 'flex';
    }
    
    function closeImageViewer(e) {
      if (e) e.stopPropagation();
      document.getElementById('image-viewer').style.display = 'none';
      document.getElementById('viewer-img').src = '';
    }

    // إخفاء زر الـ VR تلقائياً قبل الـ Play
    document.addEventListener("DOMContentLoaded", () => {
      let checkVR = setInterval(() => {
        let vrBtn = document.querySelector('.a-enter-vr');
        if(vrBtn) {
          vrBtn.style.display = 'none';
          clearInterval(checkVR);
        }
      }, 100);
    });

  </script>
</head>
<body>

  <!-- الحاوية الرئيسية التي تتضمن كل شيء وسيتم تكبيرها -->
  <div id="vr-container">
      
      <!-- شاشة البدء -->
      <div id="start-screen">
        <button class="play-btn" onclick="startExperience()">▶</button>
        <h1 class="start-title">معالم مشعر منى مكة المكرمة</h1>
      </div>

      <!-- تأثير الـ Fade الانسيابي -->
      <div id="fade-overlay"></div>

      <!-- عارض الصور المكبرة -->
      <div id="image-viewer" onclick="closeImageViewer()">
        <button class="close-viewer-btn" onclick="closeImageViewer(event)">✖</button>
        <img id="viewer-img" src="" alt="صورة مكبرة" onclick="event.stopPropagation()">
      </div>
        
      <div class="logos-wrapper">
        <img src="https://haj.gov.sa/_next/image?url=https%3A%2F%2Fhaj.gov.sa%2Fs-core%2F-%2Fmedia%2FProject%2FHAJJ%2FHajj-Logos%2FHeader-Logo.svg%3Fiar%3D0%26hash%3DEA30CCD6D55090BA41D3BA548A24E24A&w=256&q=75" alt="وزارة الحج والعمرة">
        <img src="https://image2url.com/r2/default/images/1773558610625-b250b6cd-d224-421f-b749-0894a9cf0602.png" alt="يوروكونسلت">
      </div>

      <!-- أسهم التنقل (يمين/يسار) -->
      <div class="nav-arrows-container">
        <div class="nav-arrow" onclick="goToRight()" title="التالي">&#10094;</div> 
        <div class="nav-text">مرر لرؤية المعالم</div>
        <div class="nav-arrow" onclick="goToLeft()" title="السابق">&#10095;</div> 
      </div>

      <div id="info-panel-container">
        <div class="info-box">
          <button class="close-btn" onclick="closePanel()">✖</button>
          <h2 id="panel-title">--</h2>
          <p id="panel-desc">--</p>
        </div>
        <div class="gallery-box" id="gallery-box">
          <div id="gallery-container" class="gallery-container"></div>
        </div>
      </div>

      <!-- 
        الـ Scene الخاص بـ A-Frame:
        تفعيل vr-mode-ui لعرض المشهد عبر نظارات الـ VR
      -->
      <a-scene embedded antialias="true" renderer="logarithmicDepthBuffer: true; colorManagement: true;" vr-mode-ui="enabled: true">
        
        <a-assets timeout="30000">
          <a-asset-item id="model-jamarat" src="jamaraat.glb"></a-asset-item>
          <a-asset-item id="model-khimaa" src="KHIMAA.glb"></a-asset-item>
        </a-assets>

        <a-sky color="#02050d"></a-sky>
        <a-plane position="0 -5 0" rotation="-90 0 0" width="4000" height="4000" neon-grid></a-plane>

        <a-light type="ambient" color="#051535" intensity="2.5"></a-light>
        <a-light type="point" color="#00d2ff" intensity="1.5" position="0 20 0" distance="150" decay="2"></a-light>
        <a-light type="spot" color="#0088ff" intensity="3.5" position="0 80 0" rotation="-90 0 0" angle="75" penumbra="1" distance="300" decay="2"></a-light>
        <a-light type="directional" color="#ffffff" intensity="0.6" position="15 30 20"></a-light>

        <a-entity id="models-group">
          
          <!-- الترحيب النيون -->
          <a-entity id="scene-welcome" position="0 0 0" visible="true">
            <a-entity hollow-neon-text="text: حياكم في معالم مشعر منى; color: #00d2ff; size: 160; width: 60; height: 15" 
                      position="0 15 0" 
                      animation="property: position; dir: alternate; dur: 2000; loop: true; to: 0 16 0"></a-entity>
            
            <a-entity hollow-neon-text="text: <<<<<<<<<<; color: #00d2ff; size: 120; width: 50; height: 12" 
                      position="5 8 0" 
                      animation="property: position; to: -5 8 0; dur: 2500; easing: linear; loop: true;"></a-entity>
          </a-entity>

          <!-- الجمرات -->
          <a-entity id="model_jamarat" class="scene-model" position="0 10 0" visible="false">
            <a-gltf-model src="#model-jamarat" scale="0.05 0.05 0.05"></a-gltf-model>
          </a-entity>

          <!-- الخيام (النافذة الخاصة بها تظهر في اليمين دائماً بناءً على الإعدادات) -->
          <a-entity id="model_khimaa" class="scene-model" position="0 10 0" visible="false">
            <a-gltf-model src="#model-khimaa" scale="5 5 5"></a-gltf-model>
          </a-entity>

        </a-entity>

        <a-entity camera="near: 0.1; far: 10000" look-controls="enabled: false" 
                  orbit-controls="target: 0 10 0; minDistance: 5; maxDistance: 150; initialPosition: 0 15 40; 
                                  enablePan: true; enableZoom: true; enableDamping: true; dampingFactor: 0.05; rotateSpeed: 0.5;">
        </a-entity>
        
      </a-scene>
  </div>
</body>
</html>
