<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <title>منصة المشاعر المقدسة الافتراضية</title>
  
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&display=swap" rel="stylesheet">
  <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
  <script src="https://unpkg.com/aframe-orbit-controls@1.3.2/dist/aframe-orbit-controls.min.js"></script>

  <style>
    body, html {
      margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden;
      font-family: 'Cairo', sans-serif;
      background: #02050d;
    }

    #vr-container { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }

    /* شاشة البدء */
    #start-screen {
      position: absolute; inset: 0; z-index: 200;
      background: rgba(2, 5, 10, 0.85); backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px);
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      transition: opacity 0.8s ease;
    }
    .play-btn {
      width: 100px; height: 100px; border-radius: 50%;
      background: rgba(0, 150, 255, 0.1); border: 2px solid #00d2ff;
      color: #00d2ff; font-size: 36px; display: flex; align-items: center; justify-content: center;
      cursor: pointer; transition: 0.4s; box-shadow: 0 0 40px rgba(0, 150, 255, 0.4);
      margin-bottom: 25px; outline: none; padding-left: 8px;
    }
    .play-btn:hover {
      background: #00d2ff; color: #fff; transform: scale(1.1); box-shadow: 0 0 60px rgba(0, 210, 255, 0.8);
    }

    /* الشعارات */
    .logos-wrapper {
      position: absolute; top: 20px; left: 0; right: 0;
      display: flex; justify-content: space-between; padding: 0 40px;
      z-index: 100; pointer-events: none; 
    }
    .logos-wrapper img { 
      height: 35px; object-fit: contain; pointer-events: auto;
      filter: brightness(0) invert(1); opacity: 0.85;
    }

    /* مشهد الترحيب النيون (مبني بـ CSS لتجنب تكسر النصوص) */
    #neon-welcome {
      position: absolute; top: 30%; left: 50%; transform: translate(-50%, -50%);
      text-align: center; z-index: 50; display: none; pointer-events: none;
    }
    .neon-text {
      font-size: 80px; font-weight: 800; color: transparent;
      -webkit-text-stroke: 2px #00d2ff; text-stroke: 2px #00d2ff;
      text-shadow: 0 0 20px rgba(0, 210, 255, 0.5), 0 0 40px rgba(0, 210, 255, 0.3);
      margin: 0; padding: 0; line-height: 1.2;
      animation: float 3s ease-in-out infinite;
    }
    .neon-arrows {
      font-size: 60px; font-weight: 800; color: transparent;
      -webkit-text-stroke: 2px #00d2ff; text-stroke: 2px #00d2ff;
      text-shadow: 0 0 20px rgba(0, 210, 255, 0.5);
      margin-top: 20px;
      animation: moveArrows 2s linear infinite;
    }

    @keyframes float {
      0% { transform: translateY(0px); }
      50% { transform: translateY(-15px); }
      100% { transform: translateY(0px); }
    }
    @keyframes moveArrows {
      0% { transform: translateX(-30px); }
      100% { transform: translateX(30px); }
    }

    /* أسهم التنقل السفلية */
    .nav-arrows-container {
      position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%);
      display: flex; align-items: center; gap: 30px; z-index: 100; 
      visibility: hidden; direction: ltr;
    }
    .nav-arrow {
      pointer-events: auto; width: 45px; height: 45px; border-radius: 50%;
      background: rgba(6, 12, 24, 0.4); border: 1px solid rgba(0, 150, 255, 0.3);
      color: #00d2ff; font-size: 20px; font-weight: bold;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; transition: 0.3s; backdrop-filter: blur(5px);
    }
    .nav-arrow:hover { 
      background: rgba(0, 150, 255, 0.2); box-shadow: 0 0 20px rgba(0, 150, 255, 0.5); 
      transform: scale(1.1); color: #fff; border-color: #00d2ff;
    }
    .nav-text {
      color: #00d2ff; font-size: 16px; font-weight: 600; letter-spacing: 1px;
      text-shadow: 0 0 10px rgba(0, 150, 255, 0.5); pointer-events: none;
    }

    /* البوب أب (توسيع العرض لـ 500px) */
    #info-panel-container {
      position: absolute; top: 50%; width: 500px; /* العرض الجديد */
      z-index: 100; display: none; transform-style: preserve-3d;
    }
    .info-box {
      background: rgba(6, 10, 18, 0.75); color: #fff;
      padding: 20px; border-radius: 16px; margin-bottom: 12px;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.6), 0 0 15px rgba(0, 150, 255, 0.1) inset;
      border: 1px solid rgba(0, 150, 255, 0.2); border-top: 1px solid rgba(0, 150, 255, 0.4);
      backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px);
      position: relative;
    }
    .gallery-box {
      background: rgba(6, 10, 18, 0.75); padding: 12px; border-radius: 16px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5), 0 0 15px rgba(0, 150, 255, 0.1) inset;
      border: 1px solid rgba(0, 150, 255, 0.2); border-bottom: 1px solid rgba(0, 150, 255, 0.4);
      backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px);
    }
    .close-btn {
      position: absolute; top: 10px; left: 15px; background: none; border: none; 
      color: rgba(255,255,255,0.5); font-size: 20px; cursor: pointer; transition: 0.3s;
    }
    .close-btn:hover { color: #fff; transform: scale(1.1); }
    #panel-title { 
      margin: 0 0 10px 0; color: #ffffff; font-size: 22px; font-weight: 800;
      text-shadow: 0 2px 10px rgba(0, 150, 255, 0.5);
    }
    #panel-desc { line-height: 1.6; font-size: 14px; margin: 0; color: #a0aec0; }
    
    .gallery-container { display: flex; gap: 10px; overflow-x: auto; padding-bottom: 5px; }
    .gallery-container::-webkit-scrollbar { height: 4px; }
    .gallery-container::-webkit-scrollbar-thumb { background: rgba(0,150,255,0.3); border-radius: 4px; }
    .gallery-card {
      height: 80px; min-width: 120px; border-radius: 8px; 
      border: 1px solid rgba(255,255,255,0.05); overflow: hidden;
      box-shadow: 0 4px 10px rgba(0,0,0,0.3); transition: 0.3s; cursor: pointer;
    }
    .gallery-card img { width: 100%; height: 100%; object-fit: cover; }
    .gallery-card:hover { transform: translateY(-3px); box-shadow: 0 6px 15px rgba(0, 150, 255, 0.3); }
  </style>

  <script>
    AFRAME.registerComponent('neon-grid', {
      init: function () {
        let canvas = document.createElement('canvas');
        canvas.width = 512; canvas.height = 512;
        let ctx = canvas.getContext('2d');
        ctx.fillStyle = 'rgba(2, 5, 13, 1)'; 
        ctx.fillRect(0, 0, 512, 512);
        
        ctx.strokeStyle = 'rgba(0, 150, 255, 0.2)'; 
        ctx.lineWidth = 1.5; 
        ctx.shadowBlur = 5;
        ctx.shadowColor = "#00d2ff";
        ctx.strokeRect(0, 0, 512, 512);
        
        let texture = new THREE.CanvasTexture(canvas);
        texture.wrapS = THREE.RepeatWrapping;
        texture.wrapT = THREE.RepeatWrapping;
        texture.repeat.set(800, 800); 
        
        let material = new THREE.MeshStandardMaterial({ 
          map: texture, roughness: 0.8, metalness: 0.1 
        });
        this.el.getObject3D('mesh').material = material;
      }
    });

    // مكون حساب المركز أوتوماتيكياً (لحل مشكلة انحراف الكاميرا)
    AFRAME.registerComponent('auto-center-align', {
      init: function () {
        this.el.addEventListener('model-loaded', () => {
          const obj = this.el.getObject3D('mesh');
          if (!obj) return;
          const box = new THREE.Box3().setFromObject(obj);
          const center = box.getCenter(new THREE.Vector3());
          
          this.el.dataset.centerX = center.x;
          this.el.dataset.centerY = center.y > 0 ? center.y : 5;
          this.el.dataset.centerZ = center.z;
        });
      }
    });

    const siteData = [
      { 
        id: 'scene-welcome', title: '', desc: '', images: '', panelPosition: 'none'
      },
      { 
        id: 'model_jamarat', title: 'منشأة الجمرات',
        desc: 'تُعد منشأة الجمرات الموقع الذي تُؤدى فيه شعيرة رمي الجمرات الثلاث (الصغرى، والوسطى، والعقبة) بالحصى. صُمم هذا الصرح المعماري بخمسة طوابق ومسارات ذكية باتجاه واحد، لاستيعاب مئات الآلاف من الحجاج في الساعة الواحدة وتأمين حركتهم دون تكدس هنا قلب مشعر منى حيث تتم إدارة وتفويج الحشود الهائلة عبر مسارات دخول وخروج لا تتقاطع.',
        images: 'https://vid.alarabiya.net/images/2022/07/09/6306caa4-ea67-4b15-b748-44d5540cf7ec/6306caa4-ea67-4b15-b748-44d5540cf7ec.jpg?crop=4:3&width=1200,https://pbs.twimg.com/media/HJTiNr5WcAAl8z4?format=webp&name=large,https://mubasher.news/wp-content/uploads/3-753.jpg,https://cp.slaati.com//wp-content/uploads/2018/08/7ec71df0-a2dd-4039-82fb-68c573b6b664.jpeg',
        camRadius: 40, camHeight: 18, panelPosition: 'right'
      },
      { 
        id: 'model_khimaa', title: 'مخيمات منى',
        desc: 'تُعرف منى بـ مدينة الخيام وهي أكبر مدينة خيام في العالم. يغطي الوادي خيام مطورة مصنوعة من الألياف الزجاجية المقاومة للحريق (التفلون)، ومزودة بأنظمة تكييف متطورة، لضمان أعلى معايير السلامة والراحة لملايين الحجاج أثناء إقامتهم.',
        images: 'https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSUUvqndurt7_k0op_AP_8Bn3ztxms1D3Ao4nJqWntuck9wWLKQKNgz9tE&s=10,https://media.almashhad.com/twitter/1687144283906_DHBmm.webp,https://img.youm7.com/ArticleImgs/2017/8/29/53467-%D9%85%D8%AE%D9%8A%D9%85%D8%A7%D8%AA-%D9%85%D9%86%D9%89.jpg,https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSZFXJxeM2TYDudOUYIyEUasHvYV2ruH93LONqowv_IAgWHb8taft84H1s&s=10',
        camRadius: 50, camHeight: 25, panelPosition: 'left'
      }
    ];

    let currentIndex = 0;
    let isStarted = false;
    let isAnimating = false;

    function startExperience() {
      let screen = document.getElementById('start-screen');
      screen.style.opacity = '0';
      setTimeout(() => { 
        screen.style.display = 'none'; 
        document.querySelector('.nav-arrows-container').style.visibility = 'visible';
        document.getElementById('neon-welcome').style.display = 'block'; // إظهار الترحيب
        
        let vrBtn = document.querySelector('.a-enter-vr');
        if(vrBtn) vrBtn.style.display = 'block';

        isStarted = true;
      }, 800);
    }

    document.addEventListener("DOMContentLoaded", () => {
      let checkVR = setInterval(() => {
        let vrBtn = document.querySelector('.a-enter-vr');
        if(vrBtn) {
          vrBtn.style.display = 'none';
          clearInterval(checkVR);
        }
      }, 100);
    });

    function goToRight() {
      if(!isStarted || isAnimating) return;
      currentIndex = 2; // الخيام
      showCurrentModel();
    }

    function goToLeft() {
      if(!isStarted || isAnimating) return;
      currentIndex = 1; // الجمرات
      showCurrentModel();
    }

    function showCurrentModel() {
      isAnimating = true;
      let data = siteData[currentIndex];
      closePanel();

      let neonWelcome = document.getElementById('neon-welcome');
      if (currentIndex === 0) {
          neonWelcome.style.display = 'block';
      } else {
          neonWelcome.style.display = 'none';
      }

      let allModels = document.querySelectorAll('.scene-model');
      allModels.forEach(model => {
        model.setAttribute('visible', 'false');
      });

      let cameraEl = document.querySelector('[camera]');
      let orbit = cameraEl.components['orbit-controls'];

      if(currentIndex === 0) {
        orbit.target.set(0, 10, 0);
        cameraEl.setAttribute('position', '0 15 40');
        isAnimating = false;
        return;
      }

      let currentModelEl = document.getElementById(data.id);
      if(currentModelEl) {
        currentModelEl.setAttribute('visible', 'true');
        
        // جلب المركز الحقيقي للموديل
        let cx = parseFloat(currentModelEl.dataset.centerX) || 0;
        let cy = parseFloat(currentModelEl.dataset.centerY) || 5;
        let cz = parseFloat(currentModelEl.dataset.centerZ) || 0;

        // حركة الكاميرا الانسيابية (Morph Effect)
        let currentPos = cameraEl.getAttribute('position');
        cameraEl.setAttribute('animation__zoomout', `property: position; to: ${cx} ${data.camHeight + 30} ${cz + data.camRadius + 30}; dur: 1200; easing: easeInOutCubic`);
        cameraEl.setAttribute('animation__target', `property: orbit-controls.target; to: ${cx} ${cy} ${cz}; dur: 1800; easing: easeInOutCubic`);

        setTimeout(() => {
          cameraEl.removeAttribute('animation__zoomout');
          cameraEl.setAttribute('animation__zoomin', `property: position; to: ${cx} ${data.camHeight} ${cz + data.camRadius}; dur: 1200; easing: easeInOutCubic`);
        }, 1200);

        setTimeout(() => {
          cameraEl.removeAttribute('animation__zoomin');
          cameraEl.removeAttribute('animation__target');
          updateInfoPanel(data); 
          isAnimating = false;
        }, 2500);
      }
    }

    function updateInfoPanel(data) {
      if(data.panelPosition === 'none') return;
      document.getElementById('panel-title').innerText = data.title;
      document.getElementById('panel-desc').innerText = data.desc;
      
      let galleryBox = document.getElementById('gallery-box');
      if (data.images) {
        let galleryHtml = '';
        data.images.split(',').forEach(img => {
          galleryHtml += `<div class="gallery-card"><img src="${img.trim()}" alt="صورة توضيحية"></div>`;
        });
        document.getElementById('gallery-container').innerHTML = galleryHtml;
        galleryBox.style.display = 'block'; 
      } else {
        galleryBox.style.display = 'none'; 
      }
      
      let panelContainer = document.getElementById('info-panel-container');
      if (data.panelPosition === 'right') {
        panelContainer.style.left = 'auto'; panelContainer.style.right = '5%';
        panelContainer.style.transform = 'translateY(-50%) perspective(1000px) rotateY(-8deg)';
      } else {
        panelContainer.style.right = 'auto'; panelContainer.style.left = '5%';
        panelContainer.style.transform = 'translateY(-50%) perspective(1000px) rotateY(8deg)';
      }
      panelContainer.style.display = 'block';
    }

    function closePanel() {
      document.getElementById('info-panel-container').style.display = 'none';
    }
  </script>
</head>
<body>

  <div id="start-screen">
    <button class="play-btn" onclick="startExperience()">▶</button>
    <h1 class="start-title">معالم مشعر منى مكة المكرمة</h1>
  </div>

  <!-- واجهة HTML للترحيب النيون -->
  <div id="neon-welcome">
    <h1 class="neon-text">حياكم في معالم<br>مشعر منى</h1>
    <div class="neon-arrows">>>>>>>>></div>
  </div>

  <div id="vr-container">
    
    <div class="logos-wrapper">
      <img src="https://haj.gov.sa/_next/image?url=https%3A%2F%2Fhaj.gov.sa%2Fs-core%2F-%2Fmedia%2FProject%2FHAJJ%2FHajj-Logos%2FHeader-Logo.svg%3Fiar%3D0%26hash%3DEA30CCD6D55090BA41D3BA548A24E24A&w=256&q=75" alt="وزارة الحج والعمرة">
      <img src="https://image2url.com/r2/default/images/1773558610625-b250b6cd-d224-421f-b749-0894a9cf0602.png" alt="يوروكونسلت">
    </div>

    <!-- أسهم التنقل مطابقة للصورة -->
    <div class="nav-arrows-container">
      <div class="nav-arrow" onclick="goToLeft()" title="منشأة الجمرات">&#10094;</div>
      <div class="nav-text">مرر لرؤية المعالم</div>
      <div class="nav-arrow" onclick="goToRight()" title="مخيمات منى">&#10095;</div> 
    </div>

    <div id="info-panel-container">
      <div class="info-box">
        <button class="close-btn" onclick="closePanel()">✖</button>
        <h2 id="panel-title">--</h2>
        <p id="panel-desc">--</p>
      </div>
      <div class="gallery-box" id="gallery-box">
        <div id="gallery-container" class="gallery-container"></div>
      </div>
    </div>

    <a-scene embedded antialias="true" renderer="logarithmicDepthBuffer: true; colorManagement: true;" vr-mode-ui="enabled: true">
      
      <a-assets timeout="30000">
        <a-asset-item id="model-jamarat" src="jamaraat.glb"></a-asset-item>
        <a-asset-item id="model-khimaa" src="KHIMAA.glb"></a-asset-item>
      </a-assets>

      <a-sky color="#02050d"></a-sky>
      
      <a-plane position="0 -5 0" rotation="-90 0 0" width="4000" height="4000" neon-grid></a-plane>

      <a-light type="ambient" color="#051535" intensity="2.5"></a-light>
      <a-light type="point" color="#00d2ff" intensity="1.5" position="0 20 0" distance="150" decay="2"></a-light>
      <a-light type="spot" color="#0088ff" intensity="3.5" position="0 80 0" rotation="-90 0 0" angle="75" penumbra="1" distance="300" decay="2"></a-light>
      <a-light type="directional" color="#ffffff" intensity="0.6" position="15 30 20"></a-light>

      <a-entity id="models-group">
        
        <!-- الجمرات -->
        <a-entity id="model_jamarat" class="scene-model" position="-40 10 -40" visible="false" auto-center-align>
          <a-gltf-model src="#model-jamarat" scale="0.05 0.05 0.05"></a-gltf-model>
        </a-entity>

        <!-- الخيام -->
        <a-entity id="model_khimaa" class="scene-model" position="40 10 -40" visible="false" auto-center-align>
          <a-gltf-model src="#model-khimaa" scale="5 5 5"></a-gltf-model>
        </a-entity>

      </a-entity>

      <a-entity camera="near: 0.1; far: 10000" look-controls="enabled: false" 
                orbit-controls="target: 0 10 0; minDistance: 5; maxDistance: 150; initialPosition: 0 15 40; 
                                enablePan: true; enableZoom: true; enableDamping: true; dampingFactor: 0.05; rotateSpeed: 0.5;">
      </a-entity>
      
    </a-scene>
  </div>
</body>
</html>
