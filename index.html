<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <title>معالم مشعر منى مكة المكرمة - الواقع الافتراضي</title>
  
  <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
  <script src="https://unpkg.com/aframe-orbit-controls@1.3.2/dist/aframe-orbit-controls.min.js"></script>

  <style>
    body, html {
      margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: #010308;
    }

    #vr-container { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }

    /* شاشة البدء (Start Screen) */
    #start-screen {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      background: radial-gradient(circle at center, #06193b 0%, #000000 100%);
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      z-index: 9999; color: #fff; transition: opacity 0.8s ease;
    }
    #start-screen h1 {
      font-size: 38px; margin-bottom: 40px; color: #00d2ff;
      text-shadow: 0 0 20px rgba(0, 210, 255, 0.6); letter-spacing: 2px;
    }
    .play-btn {
      background: rgba(0, 150, 255, 0.2); border: 2px solid #00d2ff;
      color: #fff; font-size: 24px; padding: 15px 50px; border-radius: 50px;
      cursor: pointer; font-weight: bold; transition: 0.4s;
      box-shadow: 0 0 20px rgba(0, 150, 255, 0.4), inset 0 0 10px rgba(0, 150, 255, 0.2);
      backdrop-filter: blur(5px);
    }
    .play-btn:hover {
      background: rgba(0, 150, 255, 0.5); box-shadow: 0 0 40px rgba(0, 150, 255, 0.8);
      transform: scale(1.05);
    }

    /* الشعارات */
    .logos-wrapper {
      position: absolute; top: 20px; left: 0; right: 0;
      display: flex; justify-content: space-between; padding: 0 40px;
      z-index: 100; pointer-events: none; 
    }
    .logos-wrapper img { 
      height: 40px; object-fit: contain; pointer-events: auto;
      filter: brightness(0) invert(1); opacity: 0.9;
    }

    /* أسهم التنقل والنص السفلية */
    .nav-container {
      position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%);
      display: flex; align-items: center; gap: 30px; z-index: 100;
      background: rgba(0, 0, 0, 0.4); padding: 10px 30px; border-radius: 50px;
      border: 1px solid rgba(0, 150, 255, 0.2); backdrop-filter: blur(8px);
    }
    .nav-text {
      color: #00d2ff; font-size: 16px; font-weight: bold; letter-spacing: 1px;
    }
    .nav-arrow {
      pointer-events: auto; width: 45px; height: 45px; border-radius: 50%;
      background: rgba(6, 12, 24, 0.6); border: 1px solid rgba(0, 150, 255, 0.5);
      color: #00d2ff; font-size: 20px; display: flex; align-items: center; justify-content: center;
      cursor: pointer; transition: 0.3s; box-shadow: 0 0 10px rgba(0, 150, 255, 0.2);
    }
    .nav-arrow:hover { 
      background: rgba(0, 150, 255, 0.3); transform: scale(1.1); color: #fff;
      box-shadow: 0 0 20px rgba(0, 150, 255, 0.6);
    }

    /* حاوية النوافذ (تصميم 3D مفصول) */
    #popups-container {
      position: absolute; top: 50%; transform: translateY(-50%);
      width: 400px; z-index: 100; display: none;
      display: flex; flex-direction: column; gap: 20px; /* الفراغ بين البوب-أب الرئيسي والصور */
    }

    /* البوب أب الرئيسي (النص) 3D Style */
    .info-panel {
      background: linear-gradient(135deg, rgba(15, 25, 45, 0.85) 0%, rgba(5, 10, 20, 0.95) 100%);
      color: #fff; padding: 25px; border-radius: 16px;
      box-shadow: 20px 20px 40px rgba(0, 0, 0, 0.8), -2px -2px 10px rgba(0, 150, 255, 0.3) inset;
      border: 1px solid rgba(255, 255, 255, 0.1); border-top: 2px solid rgba(0, 150, 255, 0.6);
      backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px);
      position: relative;
    }
    .close-btn {
      position: absolute; top: 10px; left: 15px; background: none; border: none; 
      color: #00aaff; font-size: 20px; cursor: pointer; transition: 0.3s;
    }
    .close-btn:hover { color: #fff; transform: scale(1.2); }
    #panel-title { 
      margin: 0 0 10px 0; color: #ffffff; font-size: 22px; font-weight: bold;
      text-shadow: 0 2px 10px rgba(0, 150, 255, 0.6);
    }
    #panel-desc { line-height: 1.7; font-size: 14px; margin: 0; color: #cbd5e1; }

    /* بوب أب الصور المستقل 3D Style */
    .gallery-panel {
      background: rgba(10, 15, 30, 0.7); padding: 15px; border-radius: 16px;
      box-shadow: 15px 15px 30px rgba(0, 0, 0, 0.7), -1px -1px 8px rgba(0, 150, 255, 0.2) inset;
      border: 1px solid rgba(255, 255, 255, 0.05); border-left: 2px solid rgba(0, 150, 255, 0.5);
      backdrop-filter: blur(10px);
    }
    .gallery-container { display: flex; gap: 12px; overflow-x: auto; padding-bottom: 5px; }
    .gallery-container::-webkit-scrollbar { height: 6px; }
    .gallery-container::-webkit-scrollbar-thumb { background: rgba(0,150,255,0.4); border-radius: 10px; }
    .gallery-card {
      height: 100px; min-width: 150px; border-radius: 8px; 
      border: 2px solid rgba(255,255,255,0.1); overflow: hidden;
      box-shadow: 0 8px 15px rgba(0,0,0,0.5); transition: 0.3s;
    }
    .gallery-card img { width: 100%; height: 100%; object-fit: cover; }
    .gallery-card:hover { transform: translateY(-5px) scale(1.02); box-shadow: 0 10px 20px rgba(0, 150, 255, 0.4); border-color: #00d2ff;}
  </style>

  <script>
    // الشبكة التقنية المضيئة
    AFRAME.registerComponent('neon-grid', {
      init: function () {
        let canvas = document.createElement('canvas');
        canvas.width = 512; canvas.height = 512;
        let ctx = canvas.getContext('2d');
        ctx.fillStyle = 'rgba(1, 3, 8, 1)'; 
        ctx.fillRect(0, 0, 512, 512);
        ctx.strokeStyle = 'rgba(0, 150, 255, 0.2)'; 
        ctx.lineWidth = 1.5; 
        ctx.shadowBlur = 5; ctx.shadowColor = "#00d2ff";
        ctx.strokeRect(0, 0, 512, 512);
        let texture = new THREE.CanvasTexture(canvas);
        texture.wrapS = THREE.RepeatWrapping; texture.wrapT = THREE.RepeatWrapping;
        texture.repeat.set(400, 400); 
        let material = new THREE.MeshStandardMaterial({ map: texture, roughness: 0.7, metalness: 0.2 });
        this.el.getObject3D('mesh').material = material;
      }
    });

    // وضع الموديلات في الأركان (اليمين 45، واليسار -45)
    const siteData = [
      {
        id: 'jamarat',
        title: 'منشأة الجمرات',
        desc: 'تم رفع الموديل لتوضيح مسارات وشوارع التفويج بالكامل. يعتبر المجمع من أهم المشاريع الهندسية لتسهيل حركة الحشود بأمان.',
        images: 'https://images.unsplash.com/photo-1565552643952-b91c28bdf713?w=300,https://images.unsplash.com/photo-1591604129939-f1efa4d9f7fa?w=300',
        camTarget: {x: 45, y: 3, z: -45}, // الركن الأيمن
        camPos: {x: 45, y: 18, z: -20}, // موقع الكاميرا عند الزوم
        panelPosition: 'left' // النافذة في اليسار لعدم التغطية
      },
      {
        id: 'khimaa',
        title: 'مخيمات منى',
        desc: 'مدينة الخيام المطورة والمضادة للحريق، توفر إقامة آمنة ومريحة للحجاج ضمن تخطيط هندسي دقيق يراعي جغرافية المكان.',
        images: 'https://images.unsplash.com/photo-1591604129939-f1efa4d9f7fa?w=300',
        camTarget: {x: -45, y: 1, z: -45}, // الركن الأيسر
        camPos: {x: -45, y: 18, z: -20}, 
        panelPosition: 'right' // النافذة في اليمين
      }
    ];

    let currentIndex = -1; // -1 يعني المشهد البانورامي العام
    let isAnimating = false;

    // دالة البدء وإزالة الشاشة السوداء
    function startExperience() {
      let startScreen = document.getElementById('start-screen');
      startScreen.style.opacity = '0';
      setTimeout(() => { startScreen.style.display = 'none'; }, 800);
    }

    function goToNext() {
      if(isAnimating) return;
      currentIndex = (currentIndex === -1) ? 0 : (currentIndex + 1) % siteData.length;
      animateCameraToCurrentModel();
    }

    function goToPrev() {
      if(isAnimating) return;
      currentIndex = (currentIndex === -1) ? 0 : (currentIndex - 1 + siteData.length) % siteData.length;
      animateCameraToCurrentModel();
    }

    // حركة الكاميرا السينمائية المتطورة
    function animateCameraToCurrentModel() {
      isAnimating = true;
      let data = siteData[currentIndex];
      let cameraEl = document.querySelector('[camera]');
      
      // إغلاق أي نافذة مفتوحة
      document.getElementById('popups-container').style.display = 'none'; 

      let currentPos = cameraEl.getAttribute('position');
      
      // نقطة عليا للتراجع (Zoom Out)
      let midX = (currentPos.x + data.camPos.x) / 2;
      let midY = Math.max(currentPos.y, data.camPos.y) + 40; // ارتفاع 40 متر لأعلى
      let midZ = Math.max(currentPos.z, data.camPos.z) + 30; // تراجع 30 متر للخلف

      // 1. Zoom Out & Move
      cameraEl.setAttribute('animation__zoomout', `property: position; to: ${midX} ${midY} ${midZ}; dur: 1000; easing: easeOutSine`);
      cameraEl.setAttribute('animation__target', `property: orbit-controls.target; to: ${data.camTarget.x} ${data.camTarget.y} ${data.camTarget.z}; dur: 2000; easing: easeInOutSine`);

      // 2. Zoom In
      setTimeout(() => {
        cameraEl.removeAttribute('animation__zoomout');
        cameraEl.setAttribute('animation__zoomin', `property: position; to: ${data.camPos.x} ${data.camPos.y} ${data.camPos.z}; dur: 1000; easing: easeInSine`);
      }, 1000);

      // 3. إظهار النوافذ المفصولة الـ 3D
      setTimeout(() => {
        cameraEl.removeAttribute('animation__zoomin');
        cameraEl.removeAttribute('animation__target');
        
        document.getElementById('panel-title').innerText = data.title;
        document.getElementById('panel-desc').innerText = data.desc;
        let galleryHtml = '';
        if (data.images) {
          data.images.split(',').forEach(img => {
            galleryHtml += `<div class="gallery-card"><img src="${img.trim()}" alt="صورة توضيحية"></div>`;
          });
        }
        document.getElementById('gallery-container').innerHTML = galleryHtml;
        
        // تحديد موقع النوافذ
        let popups = document.getElementById('popups-container');
        if (data.panelPosition === 'right') {
          popups.style.left = 'auto'; popups.style.right = '5%';
        } else {
          popups.style.right = 'auto'; popups.style.left = '5%';
        }
        
        popups.style.display = 'flex';
        isAnimating = false;
      }, 2050);
    }

    function closePanel() {
      document.getElementById('popups-container').style.display = 'none';
      currentIndex = -1; // العودة للوضع الحر
    }

    // تفاعل النقطة العلوية
    AFRAME.registerComponent('hotspot-action', {
      schema: { index: {type: 'number'} },
      init: function () {
        this.el.addEventListener('click', () => {
          if (currentIndex !== this.data.index) {
            currentIndex = this.data.index;
            animateCameraToCurrentModel();
          } else {
             // إظهار النوافذ إذا كان المستخدم بالفعل عند الموديل
            document.getElementById('popups-container').style.display = 'flex';
          }
        });
      }
    });
  </script>
</head>
<body>

  <!-- شاشة البدء (Play Screen) -->
  <div id="start-screen">
    <h1>معالم مشعر منى مكة المكرمة</h1>
    <button class="play-btn" onclick="startExperience()">▶ ابدأ العرض</button>
  </div>

  <div id="vr-container">
    
    <div class="logos-wrapper">
      <img src="https://haj.gov.sa/_next/image?url=https%3A%2F%2Fhaj.gov.sa%2Fs-core%2F-%2Fmedia%2FProject%2FHAJJ%2FHajj-Logos%2FHeader-Logo.svg%3Fiar%3D0%26hash%3DEA30CCD6D55090BA41D3BA548A24E24A&w=256&q=75" alt="وزارة الحج والعمرة">
      <img src="https://image2url.com/r2/default/images/1773558610625-b250b6cd-d224-421f-b749-0894a9cf0602.png" alt="يوروكونسلت">
    </div>

    <!-- أسهم التنقل -->
    <div class="nav-container">
      <div class="nav-arrow" onclick="goToPrev()">&#10095;</div> 
      <span class="nav-text">مرر لترى المعالم</span>
      <div class="nav-arrow" onclick="goToNext()">&#10094;</div> 
    </div>

    <!-- حاوية النوافذ المفص
